      - apps/server/src/serverRuntimeStartup.test.ts
    upstream:
      status: unassessed
      tracking: []
      retire_when: Upstream lists Claude before Codex and bootstraps new threads on Claude, or styal stops preferring Claude.

  - id: claude-exact-history-rewind
    title: Rewind Claude turns using the complete saved history
    status: maintained
    prs: [611, 631, 635]
    rationale: Claude's history reader can omit retained prompts and assistant messages even though the native fork preserves them; matching its filtered message bodies or positions cannot recover those turn boundaries. V2 persists human prompt references, reads the complete saved transcript, validates native forks before replacing the provider thread, and remaps retained prompt and assistant references.
    invariants:
      - Claude rewind retains every preceding turn and removes the requested turns even when the SDK conversation reader hides disconnected saved history or trailing system notices.
      - Repeated rewind uses the fork's rewritten native turn IDs; repeated prompts, steering, and tool results do not shift turn boundaries.
      - Unknown older turn IDs do not block rewind at a known recent boundary; the complete retained conversation is still validated and unknown IDs remain unknown across forks.
      - Missing, changed, or reordered retained conversation fails validation before replacing the current provider session.
      - Rolling a forked thread back to its start keeps its inherited history in a new native fork rather than resuming the old session at the inherited head, and turn rewinds carry that head over to the new session.
      - Native history operations stay within the selected provider instance's Claude configuration directory.
    implementation_paths:
      - apps/server/src/claudeHistoryWorker.ts
      - apps/server/src/orchestration-v2/Adapters/ClaudeAdapterV2.ts
      - apps/server/src/orchestration-v2/Adapters/ClaudeHistoryRewind.ts
      - apps/server/src/provider/claudeSessionHistory.ts
    upstream_paths:
      - apps/server/src/orchestration-v2/Adapters/ClaudeAdapterV2.ts
    tests:
      - apps/server/src/orchestration-v2/Adapters/ClaudeAdapterV2.test.ts
      - apps/server/src/orchestration-v2/Adapters/ClaudeHistoryRewind.test.ts
    upstream:
      status: partial
      tracking:
        - https://github.com/pingdotgg/t3code/pull/11954
        - https://github.com/pingdotgg/t3code/pull/2829
