  - id: provider-auto-updates
    title: styal managed updates install canary-verified provider versions
    status: maintained
    prs: [868]
    invariants:
      - An absolute custom VP_HOME proves global Vite+ ownership only when its binary metadata names the provider package and agrees with the executed shim. npm-linked shims update the matching Node runtime prefix through its absolute Node executable and npm CLI, with an explicit prefix and that runtime first on PATH; proven vp-managed POSIX links or Windows trampolines with a matching single-root sidecar (or no sidecar and bounded bytes identical to that install's vp-shim.exe payload) use that home's absolute Vite+ launcher. Exact-version actions preserve these targets and the effective provider-instance environment. Unproven custom shims and a default-layout shim paired with another VP_HOME never update another global copy.
      - With styal managed updates (setting key `autoUpdateProviders`, unchanged on the wire) and provider update checks on (both default on), a non-dev server installs a provider version in the background only when an `autoUpdates` entry in the matching compatibility policy of a manifest fetched from main in the last two days names it, for the installation's own npm package, verified on a published styal build the server's code contains (a later nightly, or a stable release of a later version; a stable or same build itself). It installs the newest such version and never anything newer. The bundled manifest never authorizes an automatic install.
      - Only installers that can pin a version take part, and they install exactly the verified version. That includes proven native Claude Code installs on macOS, Linux, and Windows (`claude install <version>`); Windows pinning is an explicit capability of the Claude installer, WinGet ownership stays manual, and unknown native locations stay unpinnable. On macOS and Linux it also includes standalone Codex installs (the `codex update` install script with `--release <version>` against the shared `CODEX_HOME`, without touching shell profiles), which removes Codex's self-update marker so styal takes over from Codex's own updater until a manual update hands it back, and proven native OpenCode 2 installs (`opencode upgrade <version>`, whose own installer runs with `--no-modify-path` and which refuses rather than installs elsewhere when it does not recognise the install as its own), which leave OpenCode's own `autoupdate` setting alone; native OpenCode 1.x installs are not pinned. Manual updates of those installs still run `claude update` / `codex update` / `opencode upgrade`. A standalone Codex install already on the newest verified version whose self-update marker (`$CODEX_HOME/packages/standalone/auto-update-version`, read-only) still names the selected release gets that same version as a background pinned install (a takeover, `takeover = true` in `provider.update.finished`), which succeeds only once the marker is gone; an install ahead of every verified version, or without an active marker, is left alone, and nothing is ever downgraded. `claude install` leaves native Claude Code's updater on (`autoUpdatesProtectedForNative`), so after every successful background install of a native Claude Code install styal sets `DISABLE_AUTOUPDATER` = `1` with the ownership record `STYAL_MANAGED_UPDATES` = `1` in the `env` block of the instance's `<config dir>/settings.json` (`homePath`, `CLAUDE_CONFIG_DIR`, or `~/.claude`), written atomically through symlinks with the file's mode, unless Claude's updater is already off (either variable in the process or settings env, `DISABLE_UPDATES`, `CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC`, or `autoUpdates` false without the native protection) or the user set `DISABLE_AUTOUPDATER` themselves; an unparsable settings file is never rewritten. A native Claude Code install on the newest verified version whose updater is on is taken over the same way as Codex, unless the user set `DISABLE_AUTOUPDATER` themselves, even to a value that leaves the updater on (reported as `selfUpdaterActive` null). A successful manual update with managed updates off removes the ownership record and, when it is still `1`, `DISABLE_AUTOUPDATER`; one with managed updates on keeps both. Homebrew, other native self-updaters, and native installs on Windows other than proven Claude Code installs are never run in the background.
      - A background pass skips a provider CLI only while a non-archived thread whose provider instance runs the same install (installer lock key and package) is preparing, starting, running, waiting, or has a pending approval or question; threads on other CLIs never hold it back, and each skip is logged with its reason. A pending request stops holding the CLI back once it is at least an hour old and the thread has no run preparing, starting, running, or waiting (an agent that asked and then finished), on every platform; each ignored request is logged with its instance and thread, without the question text. Passes also skip providers that are disabled, missing, or already failing their health check, and try each instance and version at most once per six hours, takeovers included. Under the machine-wide install lock, a fresh health check and activity check run again, and the install is dropped without publishing a state when a thread became active, settings changed, the provider already reached the version, or, for a takeover, the version moved or a fresh read finds the provider's own updater already off.
      - Manual and background updates share one server-lifetime maintenance runner and its install locks, and background updates publish the same update state clients show for manual updates.
      - Every manual or background install holds a machine-wide lock file per installer lock key, in upstream's directory and format so styal and T3 Code servers on one host exclude each other. A background update skips while another process holds it; a manual update reports that another update is running. The lock also records the installer's pid, so it stays held if the server dies while the installer keeps running.
      - While an install runs, turn starts (including scheduled and delegated ones) for provider instances that use the same CLI wait until it finishes, then start with the updated CLI; another server's install holds turns on every CLI under its lock key.
      - Host activity counts installs in flight, so server update, restart and desktop quit confirmations warn that a provider update will be interrupted.
      - Hourly, after each successful nightly run, and on demand, the provider canary workflow verifies each new release against the published stable and nightly styal builds, checked out from their release tags, and records a version with the build it passed on only after real turns (tool use, checkpoint, resume, interrupt, approval, rewind, native subagent, restart) pass, retrying a failed run once. A release that failed on a build is not verified on that build again for six hours unless forced. It proposes the manifest change as a pull request to main. The open canary pull request's own additions are carried over rather than verified again; entries withdrawn from main are not brought back.
      - The canary pull request gets auto-merge, enabled with GITHUB_TOKEN so it waits for main's required checks, only when its diff from main changes nothing but `updatedAt` (moving forward) and `autoUpdates` arrays that recording its new entries reproduces; otherwise auto-merge is off and the body says why.
      - The canary keeps one "Provider canary status" issue with at most one problem per provider and kind (failed, blocked, skipped) plus failed jobs. A problem clears only when a later run checks that provider again. The issue gets a comment only when a new problem appears or every problem clears, and closes when every check passes.
      - Clients show the setting only as on for environments that advertise the `providerAutoUpdates` capability.
      - Provider snapshots carry the version automatic updates would install (`compatibilityAdvisory.verifiedVersion`), from the same recent-manifest rule, and omit it when none applies.
      - The sidebar update-everything button leaves out a provider on an environment with automatic updates on when that provider has a verified version, passes its health check, and its installer can pin a version, including when the newest release is not verified yet; the Settings → Providers Update all button still includes it.
      - Web and mobile provider settings say when the latest release is newer than the verified version.
      - The setting is labelled styal managed updates on web, mobile and in the MCP environment preferences description. The web Providers settings page links to the provider update check and managed update rows in Settings → General, which stay in General.
    rationale: Upstream keeps provider updates user-initiated (closed issue 2993) and its open background-install pull request has no tested-version gate. styal updates providers for users by default, so every automatic install is limited to a release the canary verified. The fork borrowed that pull request's machine-wide install lock (ProviderInstallLock.ts, kept close to its source) and its turn-start gate, narrowed to the CLI being installed, but not its 15-minute client-idle window, host-wide activity rule, or detached installer, so updates still happen on busy hosts.
    implementation_paths:
      - .github/workflows/provider-canary.yml
      - apps/mobile/src/features/settings/SettingsEnvironmentDetailRouteScreen.tsx
      - apps/mobile/src/features/settings/SettingsServerControlsRouteScreen.tsx
