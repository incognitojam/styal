name: Fork CLI Build

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      version:
        required: true
        type: string
      dist_tag:
        required: true
        type: string
      publish:
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build:
    name: Pack and verify CLI
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      T3CODE_CLERK_PUBLISHABLE_KEY: ${{ vars.CLERK_PUBLISHABLE_KEY }}
      T3CODE_CLERK_JWT_TEMPLATE: ${{ vars.CLERK_JWT_TEMPLATE }}
      T3CODE_CLERK_CLI_OAUTH_CLIENT_ID: ${{ vars.CLERK_CLI_OAUTH_CLIENT_ID }}
      T3CODE_RELAY_URL: ${{ vars.RELAY_URL }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@styal/cli...
              - --filter=@t3tools/scripts...
      - name: Align release versions
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: node scripts/update-release-package-versions.ts "$RELEASE_VERSION"
      - name: Download verified release archives
        uses: actions/download-artifact@v8
        with:
          pattern: cli-archive-*
          merge-multiple: true
          path: cli-archives
      - name: Verify release bytes
        run: cd cli-archives && sha256sum --check SHA256SUMS
      - name: Build platform packages and npm launcher
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: node scripts/build-npm-platform-packages.ts --archives-dir cli-archives --version "$RELEASE_VERSION" --output-dir cli-release
      - name: Verify npm install and legacy preflight in a clean container
        run: |
          docker run --rm -v "$PWD/cli-release/@styal:/artifacts:ro" -v "$PWD/scripts/verify-cli-package.mjs:/verify.mjs:ro" node:26-bookworm node /verify.mjs /artifacts /verification
      - name: Upload npm packages
        uses: actions/upload-artifact@v7
        with:
          name: cli-package
          path: cli-release/@styal/*.tgz
          if-no-files-found: error

  publish:
    name: Publish CLI to npm
    needs: build
    if: inputs.publish
    # npm OIDC publishing requires a GitHub-hosted runner.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v8
        with:
          name: cli-package
          path: cli-release
      - name: Publish verified archive
        env:
          DIST_TAG: ${{ inputs.dist_tag }}
        shell: bash
        run: |
          set -euo pipefail
          # Publish all five exact-version dependencies before their launcher.
          for key in darwin-arm64 linux-x64 linux-arm64 win32-x64 win32-arm64; do
            npm publish "./cli-release/cli-$key.tgz" --access public --tag "$DIST_TAG" --provenance
          done
          npm publish ./cli-release/cli.tgz --access public --tag "$DIST_TAG" --provenance
