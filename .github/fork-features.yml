version: 1
coverage: incremental

# Capabilities, not commits. Follow-up fixes belong to the feature they preserve.
features:
  - id: completion-sounds
    title: Configurable agent completion sounds
    status: maintained
    prs: [5, 7, 19, 72]
    invariants:
      - Users can select, preview, and disable the sound played when an agent finishes or awaits input.
      - Sound playback follows persisted client settings without firing repeatedly for the same turn state.
    implementation_paths:
      - apps/web/src/components/TurnCompletionSound.tsx
      - apps/web/src/components/settings/SettingsPanels.tsx
      - apps/web/src/lib/completionSound.logic.ts
      - apps/web/src/lib/completionSound.ts
      - packages/contracts/src/settings.ts
    upstream_paths:
      - apps/web/src/AppRoot.tsx
      - apps/web/src/components/settings/SettingsPanels.tsx
      - packages/contracts/src/settings.ts
    tests:
      - apps/desktop/src/settings/DesktopClientSettings.test.ts
      - apps/web/src/lib/completionSound.logic.test.ts
      - apps/web/src/lib/completionSound.test.ts
      - packages/contracts/src/settings.test.ts
    upstream:
      status: unassessed
      tracking: []
      retire_when: Upstream provides configurable completion and awaiting-input sounds with equivalent persistence and playback behavior.

  - id: composer-draft-sync
    title: Cross-device composer draft synchronization
    status: maintained
    prs: [39, 44]
    invariants:
      - Existing-thread draft text and attachments survive restarts and synchronize without overwriting newer local edits.
      - Web, desktop-hosted web, and mobile use the same server-backed draft contract and fork-owned migration history.
    implementation_paths:
      - apps/mobile/src/state/use-composer-drafts.ts
      - apps/server/src/persistence/ComposerDrafts.ts
      - apps/server/src/persistence/ForkMigrations/001_ComposerDrafts.ts
      - apps/web/src/composerDraftStore.ts
      - packages/contracts/src/composerDraft.ts
    upstream_paths:
      - apps/server/src/server.ts
      - apps/server/src/ws.ts
      - apps/web/src/components/ChatView.tsx
      - apps/web/src/components/chat/ChatComposer.tsx
      - packages/client-runtime/src/rpc/client.ts
      - packages/contracts/src/rpc.ts
    tests:
      - apps/mobile/src/state/use-composer-drafts.test.ts
      - apps/server/src/persistence/ComposerDrafts.test.ts
      - apps/server/src/persistence/ForkMigrations.test.ts
      - apps/web/src/composerDraftStore.test.ts
    upstream:
      status: unassessed
      tracking: []
      retire_when: Upstream synchronizes equivalent composer draft state across clients and safely migrates installations carrying the fork schema.

  - id: github-outage-status
    title: GitHub outage status in the sidebar
    status: maintained
    prs: [14, 136]
    invariants:
      - Enabled clients distinguish GitHub incidents from missing or malformed status responses.
      - The sidebar notice reports affected services without blocking ordinary source-control work.
    implementation_paths:
      - apps/web/src/components/settings/SettingsPanels.tsx
      - apps/web/src/components/sidebar/GitHubStatusNotice.tsx
      - apps/web/src/githubStatus.ts
      - packages/contracts/src/settings.ts
    upstream_paths:
      - apps/web/src/components/settings/SettingsPanels.tsx
      - apps/web/src/components/sidebar/SidebarChrome.tsx
      - packages/contracts/src/settings.ts
    tests:
      - apps/desktop/src/settings/DesktopClientSettings.test.ts
      - apps/web/src/githubStatus.test.ts
      - packages/contracts/src/settings.test.ts
    upstream:
      status: unassessed
      tracking: []
      retire_when: Upstream exposes equivalent configurable GitHub incident reporting in the primary navigation.

  - id: github-pull-request-query-budget
    title: Bound GitHub pull request query cost
    status: maintained
    prs: [131]
    invariants:
      - Opening and refreshing a pull request cannot exhaust the GitHub GraphQL quota through unbounded nested review-thread connections.
      - Large review conversations remain pageable up to the maintained safety ceiling instead of being silently truncated to the cheap initial query.
    implementation_paths:
      - apps/server/src/pullRequest/GitHubPullRequestCli.ts
      - apps/server/src/pullRequest/gitHubPullRequestJson.ts
    upstream_paths:
      - apps/server/src/pullRequest/GitHubPullRequestCli.ts
      - apps/server/src/pullRequest/GitHubPullRequestProvider.ts
      - apps/server/src/pullRequest/PullRequestService.ts
      - apps/server/src/pullRequest/gitHubPullRequestJson.ts
    tests:
      - apps/server/src/pullRequest/GitHubPullRequestCli.test.ts
      - apps/server/src/pullRequest/gitHubPullRequestJson.test.ts
    upstream:
      status: partial
      tracking:
        - https://github.com/pingdotgg/t3code/pull/6466
      retire_when: Upstream bounds nested GitHub review-thread query fan-out while retaining equivalent pagination and provider-budget protection.

  - id: github-reference-links
    title: Resolve GitHub references across chat and pull requests
    status: maintained
    prs: [31, 134]
    invariants:
      - GitHub issue, pull request, commit, and repository references resolve against the project remote and become navigable links in chat and pull request Markdown.
      - Reference resolution is environment-scoped, authorized, and cached without leaking repository context across projects.
    implementation_paths:
      - apps/server/src/sourceControl/gitHubReferences.ts
      - apps/server/src/sourceControl/referenceCache.ts
      - apps/web/src/components/chat/githubReferenceLinks.ts
      - apps/web/src/markdown-github-references.ts
    upstream_paths:
      - apps/server/src/ws.ts
      - apps/web/src/components/ChatMarkdown.tsx
      - apps/web/src/components/pullRequest/PullRequestDetailPanel.tsx
      - apps/web/src/components/pullRequest/PullRequestMarkdown.tsx
      - packages/contracts/src/rpc.ts
    tests:
      - apps/server/src/sourceControl/gitHubReferences.test.ts
      - apps/server/src/sourceControl/referenceCache.test.ts
      - apps/web/src/components/chat/githubReferenceLinks.test.ts
      - apps/web/src/markdown-github-references.test.tsx
    upstream:
      status: unassessed
      tracking: []
      retire_when: Upstream resolves equivalent environment-scoped GitHub references in chat and pull request Markdown with the same navigation behavior.

  - id: integrated-browser-links
    title: Open local development links in the integrated browser
    status: maintained
    prs: [107, 145, 153, 156]
    invariants:
      - Loopback links opened from chat or terminal activity resolve on the environment machine in the integrated browser.
      - Unsupported links retain an external-browser path and never strand the user behind an unavailable preview runtime.
    implementation_paths:
      - apps/desktop/src/preview/BrowserSession.ts
      - apps/server/src/preview/TerminalBrowserOpen.ts
      - apps/web/src/components/chat/loopbackLinkPreview.ts
      - apps/web/src/components/preview/PreviewAutomationHosts.tsx
      - apps/web/src/components/preview/openTerminalLinkInPreview.ts
    upstream_paths:
      - apps/desktop/src/preview/Manager.ts
      - apps/server/src/http.ts
      - apps/server/src/terminal/Manager.ts
      - apps/web/src/components/ChatMarkdown.tsx
      - apps/web/src/components/ThreadTerminalDrawer.tsx
      - apps/web/src/components/preview/PreviewAutomationHosts.tsx
    tests:
      - apps/desktop/src/preview/BrowserSession.test.ts
      - apps/server/src/preview/TerminalBrowserOpen.test.ts
      - apps/web/src/components/chat/loopbackLinkPreview.test.ts
      - apps/web/src/components/preview/openTerminalLinkInPreview.test.ts
    upstream:
      status: unassessed
      tracking: []
      retire_when: Upstream routes local chat and terminal links through an environment-aware integrated browser with an external fallback.

  - id: preview-hidden-tab-capture
    title: Capture hidden preview tabs reliably
    status: maintained
    prs: [172, 174]
    invariants:
      - Screenshot and recording operations can capture a background preview tab without making it visibly active.
      - Capture leases are bounded, single-flight, and always released so a failed native capture cannot strand or overlap compositor work.
    implementation_paths:
      - apps/desktop/src/preview/Manager.ts
      - apps/web/src/browser/HostedBrowserWebview.tsx
      - apps/web/src/browser/browserSurfaceStore.ts
      - apps/web/src/components/preview/PreviewAutomationHosts.tsx
    upstream_paths:
      - apps/desktop/src/preview/Manager.ts
      - apps/web/src/browser/HostedBrowserWebview.tsx
      - apps/web/src/components/preview/PreviewAutomationHosts.tsx
    tests:
      - apps/desktop/src/preview/Manager.test.ts
      - apps/web/src/browser/browserSurfaceStore.test.ts
      - apps/web/src/browser/hostedBrowserWebviewStyle.test.ts
    upstream:
      status: unassessed
      tracking: []
      retire_when: Upstream reliably captures hidden preview tabs with bounded native work and no user-visible activation.

  - id: project-filter-continuity
    title: Preserve project filters while navigating and creating threads
    status: maintained
    prs: [83, 162]
    invariants:
      - Reopening the sidebar does not discard the user's project filter.
      - New-thread actions follow the visible project scope without unexpectedly switching the active thread's project.
    implementation_paths:
      - apps/web/src/components/CommandPalette.tsx
      - apps/web/src/components/Sidebar.tsx
      - apps/web/src/lib/chatThreadActions.ts
      - apps/web/src/sidebarProjectScopeStore.ts
    upstream_paths:
      - apps/web/src/components/AppSidebarLayout.tsx
      - apps/web/src/components/CommandPalette.tsx
      - apps/web/src/components/Sidebar.tsx
    tests:
      - apps/web/src/lib/chatThreadActions.test.ts
    upstream:
      status: unassessed
      tracking: []
      retire_when: Upstream preserves project scope across sidebar state and every new-thread entry point.

  - id: pull-request-live-refresh
    title: Keep open pull request details current
    status: maintained
    prs: [101]
    invariants:
      - An open pull request refreshes core host state without leaving the visible panel one stale response behind.
      - Automatic refresh preserves cached diffs and fetches heavier activity only after the pull request revision changes, while manual refresh reloads all visible data.
    implementation_paths:
      - apps/server/src/pullRequest/PullRequestService.ts
      - apps/web/src/components/pullRequest/PullRequestDetailPanel.tsx
      - packages/contracts/src/pullRequest.ts
    upstream_paths:
      - apps/server/src/pullRequest/PullRequestService.ts
      - apps/web/src/components/pullRequest/PullRequestDetailPanel.tsx
      - packages/contracts/src/pullRequest.ts
    tests:
      - apps/server/src/pullRequest/PullRequestService.test.ts
      - apps/web/src/hooks/useLiveRefresh.test.ts
      - packages/contracts/src/pullRequest.test.ts
    upstream:
      status: partial
      tracking:
        - https://github.com/pingdotgg/t3code/pull/6466
      retire_when: Upstream keeps the visible pull request current without stale responses, unnecessary activity reads, or invalidating cached diffs.

  - id: pull-request-required-checks
    title: Show required pull request checks and merge readiness
    status: maintained
    prs: [151]
    invariants:
      - The Checks tab distinguishes host-required checks from optional jobs and represents required checks that have not reported yet.
      - The primary action follows GitHub merge readiness, offering auto-merge when requirements block an otherwise mergeable pull request.
    implementation_paths:
      - apps/server/src/pullRequest/GitHubPullRequestCli.ts
      - apps/server/src/pullRequest/GitHubPullRequestProvider.ts
      - apps/web/src/components/pullRequest/PullRequestChecksTab.tsx
      - apps/web/src/components/pullRequest/pullRequestDetail.logic.ts
    upstream_paths:
      - apps/server/src/pullRequest/GitHubPullRequestCli.ts
      - apps/server/src/pullRequest/GitHubPullRequestProvider.ts
      - apps/server/src/pullRequest/PullRequestService.ts
      - apps/web/src/components/pullRequest/PullRequestDetailPanel.tsx
      - apps/web/src/components/pullRequest/pullRequestDetail.logic.ts
      - packages/contracts/src/pullRequest.ts
    tests:
      - apps/server/src/pullRequest/GitHubPullRequestCli.test.ts
      - apps/server/src/pullRequest/GitHubPullRequestProvider.test.ts
      - apps/web/src/components/pullRequest/PullRequestChecksTab.test.tsx
      - apps/web/src/components/pullRequest/pullRequestDetail.logic.test.ts
    upstream:
      status: unassessed
      tracking: []
      retire_when: Upstream exposes repository-policy-aware required checks and equivalent merge or auto-merge guidance in pull request details.

  - id: run-shell-code-blocks
    title: Run completed shell code blocks in a terminal
    status: maintained
    prs: [97]
    invariants:
      - Completed recognized shell fences expose a Run in terminal action with the exact displayed command.
      - Incomplete or non-shell code blocks never expose the terminal action.
    implementation_paths:
      - apps/web/src/components/ChatMarkdown.tsx
      - apps/web/src/components/chat/MessagesTimeline.tsx
    upstream_paths:
      - apps/web/src/components/ChatMarkdown.tsx
      - apps/web/src/components/chat/MessagesTimeline.tsx
    tests:
      - apps/web/src/components/ChatMarkdown.test.tsx
      - apps/web/src/components/chat/MessagesTimeline.test.tsx
    upstream:
      status: unassessed
      tracking: []
      retire_when: Upstream offers equivalent guarded terminal execution for completed shell code blocks.
