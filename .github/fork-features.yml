      - apps/web/src/components/RightPanelTabs.test.tsx
      - apps/web/src/keybindings.test.ts
      - packages/contracts/src/keybindings.test.ts
    upstream:
      status: unassessed
      tracking: []
      retire_when: Upstream closes focused panel tabs with the platform Mod+W shortcut and preserves focus ownership across panel menus and launchers.

