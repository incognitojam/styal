  - id: server-restart-continuation-note
    title: Response continuity and timing
    status: review-needed
    prs: [515, 744, 802, 877, 889, 892]
    invariants:
      - Restart recovery records a durable server-created continuation message and an explicit restartContinuationOfRunId link; retries do not dispatch the same recovery message twice and newer user work takes precedence.
      - Web and mobile render the recovery prompt as a standalone note inside the response the restart cut short, preserving one final answer and one worked duration with the outage excluded. A continuation of a completed or waiting run, prompted only about its cancelled background work, starts its own response under the note and leaves the earlier final answer visible; unrelated background wake continuations remain separate.
      - The standalone restart divider reads Server restarted, remaining accurate after the continued response finishes.
      - While a linked replacement run is working, earlier assistant footers stay hidden and tools remain scoped to their own run; a new user message starts a separate response.
      - The live conversation timer on web and mobile measures the current response, includes work before each linked restart, and excludes outage gaps, matching completed or stopped response duration. Background wakes start separate response clocks; thread lists retain the task-wide clock carried across wakes. Both clocks include quiet work through its recorded end time, and new user prompts start fresh timers.
      - Each prompt starts at most one response. Separate background responses exclude earlier response work and idle time; collapsed or start-positioned tool rows retain completion timing boundaries, and stopped responses include the full duration of overlapping tools.
      - Recovery closes dead streaming messages and unfinished provider work using their last recorded update times, while event and run lifecycle timestamps still record when recovery occurred.
      - A prompted continuation of a turn the restart cut mid-way tells the agent that the styal server restarted and interrupted the turn, so a killed command is not mistaken for the command's own failure; a settled turn's continuation carries only its cancelled background-work note. Codex resumes a cut turn natively and receives no prompt unless the turn also lost background work.
    rationale: Upstream V2 durable continuation messages and explicit run lineage supersede V1 restart activity events and their inferred turn linkage. The fork retains the note presentation, linked response folding, outage exclusion, and mobile footer behavior against canonical V2 recovery state.
