name: Fork Nightly

on:
  schedule:
    - cron: "23 */3 * * *"
  workflow_dispatch:
    inputs:
      force_notarization:
        description: Ignore an active Apple notarization submission
        required: false
        type: boolean
        default: false
      dry_run:
        description: >-
          Run the full pipeline even without new changes, but leave the
          release as an unpublished draft and skip nightly promotion
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  id-token: none

concurrency:
  group: fork-nightly-publish

jobs:
  prepare:
    name: Prepare and verify candidate
    if: github.repository == 'incognitojam/t3code' || github.repository == 'incognitojam/styal'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    permissions:
      actions: read
      contents: read
    outputs:
      has_changes: ${{ steps.candidate.outputs.has_changes }}
      ref: ${{ steps.candidate.outputs.ref }}
      # The upstream commit main currently sits on. Release notes compare
      # against it; it only moves when a PR brings upstream work in.
      upstream_ref: ${{ steps.candidate.outputs.upstream_ref }}
      version: ${{ steps.release_meta.outputs.version }}
      tag: ${{ steps.release_meta.outputs.tag }}
      release_name: ${{ steps.release_meta.outputs.name }}
      previous_tag: ${{ steps.previous_tag.outputs.previous_tag }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      # Picks the newest commit on main that passed Fork CI, waiting for any
      # run still in flight.
      - id: candidate
        name: Resolve candidate
        shell: bash
        env:
          DRY_RUN: ${{ inputs.dry_run == true }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          fork_ci_run() {
            gh run list --workflow fork-ci.yml --branch main --event push \
              --commit "$1" --limit 1 --json databaseId,status,conclusion \
              --jq '.[0] // empty | "\(.databaseId) \(.status) \(.conclusion)"'
          }

          candidate_ref=""
          for sha in $(git rev-list --first-parent --max-count=50 HEAD); do
            read -r run_id status conclusion <<<"$(fork_ci_run "$sha")" || true
            case "${status:-}" in
              queued | waiting | pending | requested | in_progress)
                echo "Fork CI run ${run_id} for ${sha} is ${status}; waiting for it."
                gh run watch "$run_id" --interval 30 >/dev/null || true
                read -r run_id status conclusion <<<"$(fork_ci_run "$sha")" || true
                ;;
            esac
            if [[ "${status:-}" == "completed" && "${conclusion:-}" == "success" ]]; then
              candidate_ref=$sha
              break
            fi
            echo "Skipping ${sha}: Fork CI ${status:-has not run}${conclusion:+ (${conclusion})}."
          done

          if [[ -z "$candidate_ref" ]]; then
            echo "::error::None of the last 50 commits on main has a successful Fork CI run."
            exit 1
          fi

          echo "Candidate ${candidate_ref} ($(git log -1 --format=%s "$candidate_ref"))."
          git checkout --quiet --detach "$candidate_ref"

          git fetch --no-tags https://github.com/pingdotgg/t3code.git main
          upstream_ref=$(git merge-base "$candidate_ref" FETCH_HEAD)

          git fetch origin '+refs/heads/nightly:refs/remotes/origin/nightly' || true

          has_changes=true
          if git rev-parse --verify refs/remotes/origin/nightly >/dev/null 2>&1; then
            if [[ "$DRY_RUN" != "true" ]] && git diff --quiet origin/nightly "$candidate_ref" --; then
              has_changes=false
            fi
          fi

          {
            echo "has_changes=$has_changes"
            echo "ref=$candidate_ref"
            echo "upstream_ref=$upstream_ref"
          } >> "$GITHUB_OUTPUT"

      - name: Setup Vite+
        if: steps.candidate.outputs.has_changes == 'true'
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      # Fork CI ran this against the previous nightly as of the PR; it is
      # repeated here because origin/nightly may have moved since.
      - name: Test previous nightly schema upgrade
        if: steps.candidate.outputs.has_changes == 'true'
        run: vp run --filter ./apps/server test:nightly-upgrade -- origin/nightly

      - id: release_meta
        name: Resolve nightly version
        if: steps.candidate.outputs.has_changes == 'true'
        shell: bash
        env:
          CANDIDATE_REF: ${{ steps.candidate.outputs.ref }}
          NIGHTLY_RUN_NUMBER: ${{ github.run_number }}
        run: |
          nightly_date=$(date -u +%Y%m%d)
          node scripts/resolve-nightly-release.ts \
            --date "$nightly_date" \
            --run-number "$NIGHTLY_RUN_NUMBER" \
            --sha "$CANDIDATE_REF" \
            --github-output

      - id: previous_tag
        name: Resolve previous fork nightly
        if: steps.candidate.outputs.has_changes == 'true'
        run: |
          node scripts/resolve-previous-release-tag.ts \
            --channel nightly \
            --current-tag "${{ steps.release_meta.outputs.tag }}" \
            --github-output

  build_desktop_mac:
    name: Build macOS desktop artifact
    needs: prepare
    if: needs.prepare.outputs.has_changes == 'true'
    uses: ./.github/workflows/fork-desktop-build.yml
    with:
      ref: ${{ needs.prepare.outputs.ref }}
      version: ${{ needs.prepare.outputs.version }}
      target: macos-arm64
      sign_macos: true
      check_notarization: true
      force_notarization: ${{ inputs.force_notarization == true }}
    secrets: inherit

  build_desktop_linux:
    name: Build Linux desktop artifact
    needs: prepare
    if: needs.prepare.outputs.has_changes == 'true'
    uses: ./.github/workflows/fork-desktop-build.yml
    with:
      ref: ${{ needs.prepare.outputs.ref }}
      version: ${{ needs.prepare.outputs.version }}
      target: linux-x64
    secrets: inherit

  build_desktop_windows:
    name: Build Windows desktop artifact
    needs: prepare
    if: needs.prepare.outputs.has_changes == 'true'
    uses: ./.github/workflows/fork-desktop-build.yml
    with:
      ref: ${{ needs.prepare.outputs.ref }}
      version: ${{ needs.prepare.outputs.version }}
      target: windows-x64
    secrets: inherit

  build_cli_archives:
    name: Build standalone CLI archives
    needs: prepare
    if: needs.prepare.outputs.has_changes == 'true'
    uses: ./.github/workflows/fork-cli-archives.yml
    with:
      ref: ${{ needs.prepare.outputs.ref }}
      version: ${{ needs.prepare.outputs.version }}
      sign_macos: true
    secrets: inherit

  build_cli:
    name: Build and verify CLI
    needs: [prepare, build_cli_archives]
    if: needs.prepare.outputs.has_changes == 'true'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/fork-cli-build.yml
    with:
      ref: ${{ needs.prepare.outputs.ref }}
      version: ${{ needs.prepare.outputs.version }}
      operation: build

  publish_cli:
    name: Publish CLI to npm
    needs:
      [
        prepare,
        build_desktop_mac,
        build_desktop_linux,
        build_desktop_windows,
        build_cli,
        build_cli_archives,
      ]
    if: >-
      ${{
        !cancelled() &&
        needs.prepare.outputs.has_changes == 'true' &&
        needs.build_desktop_mac.result == 'success' &&
        needs.build_desktop_linux.result == 'success' &&
        needs.build_desktop_windows.result == 'success' &&
        needs.build_cli.result == 'success' &&
        needs.build_cli_archives.result == 'success' &&
        vars.STYAL_CLI_PUBLISH_ENABLED == 'true' &&
        inputs.dry_run != true
      }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/fork-cli-build.yml
    with:
      ref: ${{ needs.prepare.outputs.ref }}
      version: ${{ needs.prepare.outputs.version }}
      operation: publish
      dist_tag: nightly

  release:
    name: Publish GitHub prerelease
    needs:
      [
        prepare,
        build_desktop_mac,
        build_desktop_linux,
        build_desktop_windows,
        build_cli,
        build_cli_archives,
        publish_cli,
      ]
    permissions:
      contents: write
      pull-requests: read
    if: >-
      !cancelled() &&
      needs.prepare.outputs.has_changes == 'true' &&
      needs.build_desktop_mac.result == 'success' &&
      needs.build_desktop_linux.result == 'success' &&
      needs.build_desktop_windows.result == 'success' &&
      needs.build_cli.result == 'success' &&
      needs.build_cli_archives.result == 'success' &&
      (needs.publish_cli.result == 'success' || needs.publish_cli.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout released source
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          fetch-depth: 0
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Download release assets
        uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          merge-multiple: true
          path: release-assets

      - name: Download standalone CLI archives and checksums
        uses: actions/download-artifact@v8
        with:
          pattern: cli-archive-*
          merge-multiple: true
          path: release-assets

      - name: Download CLI archive
        uses: actions/download-artifact@v8
        with:
          name: cli-package
          path: release-assets

      - name: Generate prerelease notes
        shell: bash
        env:
          FORK_SOURCE_REF: ${{ needs.prepare.outputs.ref }}
          GH_TOKEN: ${{ github.token }}
          NEW_TAG: ${{ needs.prepare.outputs.tag }}
          PREVIOUS_TAG: ${{ needs.prepare.outputs.previous_tag }}
          UPSTREAM_REF: ${{ needs.prepare.outputs.upstream_ref }}
        run: |
          set -euo pipefail

          git fetch --no-tags origin "$FORK_SOURCE_REF"
          git rev-parse --verify "${FORK_SOURCE_REF}^{commit}" >/dev/null
          git rev-parse --verify "${UPSTREAM_REF}^{commit}" >/dev/null
          source .github/scripts/release-changelog.sh

          if [[ -n "$PREVIOUS_TAG" ]]; then
            git rev-parse --verify "${PREVIOUS_TAG}^{commit}" >/dev/null
            previous_upstream_ref=$(git merge-base "$PREVIOUS_TAG" "$UPSTREAM_REF")
          else
            previous_upstream_ref=$(git merge-base "$FORK_SOURCE_REF" "$UPSTREAM_REF")
          fi

          upstream_changes=()
          while IFS= read -r sha; do
            upstream_changes+=("$sha")
          done < <(git rev-list --reverse "${previous_upstream_ref}..${UPSTREAM_REF}")

          fork_changes=()
          while IFS= read -r sha; do
            fork_changes+=("$sha")
          done < <(
            list_fork_release_commits "$PREVIOUS_TAG" "$FORK_SOURCE_REF" "$UPSTREAM_REF"
          )

          {
            printf "## What's Changed\n\n"
            if (( ${#fork_changes[@]} > 0 )); then
              append_release_changes "$GITHUB_REPOSITORY" "${fork_changes[@]}"
            fi
            if (( ${#upstream_changes[@]} > 0 )); then
              append_release_changes pingdotgg/t3code "${upstream_changes[@]}"
            fi
            if (( ${#fork_changes[@]} + ${#upstream_changes[@]} == 0 )); then
              printf 'No user-facing changes.\n'
            fi
            # Compare the fork's own release tags. Comparing upstream refs named
            # the wrong repository, and collapsed to an empty range whenever the
            # nightly carried no upstream changes.
            if [[ -n "$PREVIOUS_TAG" ]]; then
              printf '\n**Full Changelog**: https://github.com/%s/compare/%s...%s\n' \
                "$GITHUB_REPOSITORY" "$PREVIOUS_TAG" "$NEW_TAG"
            fi
          } > release-notes.md

      # GITHUB_TOKEN cannot create a release tag at a commit whose workflow
      # files differ from main's, so the tag is pushed before the release.
      - name: Create nightly tag
        if: inputs.dry_run != true
        shell: bash
        env:
          FORK_SOURCE_REF: ${{ needs.prepare.outputs.ref }}
          NEW_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail

          existing=$(
            git ls-remote origin "refs/tags/${NEW_TAG}" "refs/tags/${NEW_TAG}^{}" | cut -f1
          )
          if [[ -n "$existing" ]]; then
            if [[ $'\n'"$existing"$'\n' == *$'\n'"$FORK_SOURCE_REF"$'\n'* ]]; then
              echo "Tag ${NEW_TAG} already points at ${FORK_SOURCE_REF}."
              exit 0
            fi
            echo "Tag ${NEW_TAG} already exists and does not point at ${FORK_SOURCE_REF}." >&2
            exit 1
          fi

          git push origin "${FORK_SOURCE_REF}:refs/tags/${NEW_TAG}"

      # target_commitish only on dry runs, which skip the tag; sending it on a
      # real run would re-arm the check above. Empty is unset.
      - id: draft_release
        name: Upload draft prerelease
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ inputs.dry_run == true && needs.prepare.outputs.ref || '' }}
          name: ${{ needs.prepare.outputs.release_name }}
          body_path: release-notes.md
          draft: true
          prerelease: true
          make_latest: false
          files: release-assets/*
          fail_on_unmatched_files: true
          token: ${{ github.token }}

      - name: Publish complete prerelease
        if: inputs.dry_run != true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.draft_release.outputs.id }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_ID"
          gh api --method PATCH \
            "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
            -F draft=false \
            -F prerelease=true \
            -f make_latest=false \
            >/dev/null

      # cancelled() can be true after the release went live, so the tag of a
      # published release is never deleted.
      - name: Discard tag from unfinished publish
        if: (failure() || cancelled()) && inputs.dry_run != true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          NEW_TAG: ${{ needs.prepare.outputs.tag }}
          FORK_SOURCE_REF: ${{ needs.prepare.outputs.ref }}
        run: |
          set -euo pipefail

          existing=$(
            git ls-remote origin "refs/tags/${NEW_TAG}" "refs/tags/${NEW_TAG}^{}" | cut -f1
          )
          if [[ $'\n'"$existing"$'\n' != *$'\n'"$FORK_SOURCE_REF"$'\n'* ]]; then
            echo "Tag ${NEW_TAG} is not at ${FORK_SOURCE_REF}; leaving it alone."
            exit 0
          fi

          # Listing includes drafts; the by-tag endpoint would not.
          draft=$(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              | jq -r --arg tag "$NEW_TAG" '.[] | select(.tag_name == $tag) | .draft'
          )
          if [[ "$draft" == "false" ]]; then
            echo "Release ${NEW_TAG} is published; keeping its tag."
            exit 0
          fi

          git push origin --delete "refs/tags/${NEW_TAG}"

      - name: Promote successful nightly source
        if: inputs.dry_run != true
        shell: bash
        run: |
          # A release-only retry must not overwrite a newer nightly source.
          git push origin HEAD:refs/heads/nightly

  notify_failure:
    name: Notify Discord of failure
    needs: [prepare, build_desktop_mac, build_desktop_linux, build_desktop_windows, release]
    if: >-
      ${{
        always() &&
        (
          needs.prepare.result == 'failure' ||
          needs.prepare.result == 'cancelled' ||
          needs.build_desktop_mac.result == 'failure' ||
          needs.build_desktop_mac.result == 'cancelled' ||
          needs.build_desktop_linux.result == 'failure' ||
          needs.build_desktop_linux.result == 'cancelled' ||
          needs.build_desktop_windows.result == 'failure' ||
          needs.build_desktop_windows.result == 'cancelled' ||
          needs.release.result == 'failure' ||
          needs.release.result == 'cancelled'
        )
      }}
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Post failure notification
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_CI }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          PREPARE_RESULT: ${{ needs.prepare.result }}
          DESKTOP_MAC_RESULT: ${{ needs.build_desktop_mac.result }}
          DESKTOP_LINUX_RESULT: ${{ needs.build_desktop_linux.result }}
          DESKTOP_WINDOWS_RESULT: ${{ needs.build_desktop_windows.result }}
          RELEASE_RESULT: ${{ needs.release.result }}
        shell: bash
        run: |
          # shellcheck disable=SC2016 # Markdown backticks must remain literal.
          description=$(printf '`%s` · `%s`\n\nPrepare: `%s`\nDesktop macOS: `%s`\nDesktop Linux: `%s`\nDesktop Windows: `%s`\nRelease: `%s`' \
            "$COMMIT_SHA" "$ACTOR" "$PREPARE_RESULT" "$DESKTOP_MAC_RESULT" "$DESKTOP_LINUX_RESULT" "$DESKTOP_WINDOWS_RESULT" "$RELEASE_RESULT")
          payload=$(jq -n \
            --arg title 'Fork Nightly failed' \
            --arg url "$RUN_URL" \
            --arg description "$description" \
            '{embeds: [{title: $title, url: $url, description: $description, color: 15158332}]}')
          curl --fail-with-body --retry 3 --retry-all-errors \
            --header 'Content-Type: application/json' \
            --data "$payload" \
            "$DISCORD_WEBHOOK_URL"
