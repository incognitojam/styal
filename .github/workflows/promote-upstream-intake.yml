name: Promote upstream intake

run-name: ${{ github.event_name == 'workflow_dispatch' && format('Dry run promotion from Fork CI {0}', inputs.ci_run_id) || format('Promote {0} at {1}', github.event.workflow_run.head_branch, github.event.workflow_run.head_sha) }}

# Starts when Fork CI passes on an intake branch. A workflow_run always runs
# main's copy of this file, so a candidate cannot change the checks that
# promote it. A candidate the audit marks eligible, whose native fingerprint inputs are
# unchanged, promotes through upstream-intake-automatic; every other candidate
# waits for approval on upstream-intake-manual. To retry, re-run Fork CI.
on:
  workflow_run:
    workflows: ["Fork CI"]
    types: [completed]
    branches: ["intake/**"]
  # Dispatch is always read-only; only workflow_run may enter the promotion environment.
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: Successful Fork CI intake push run to replay (latest attempt)
        required: true
        type: string
      base_sha:
        description: Full main SHA the candidate was based on (allows landed candidates)
        required: true
        type: string

permissions:
  actions: read
  contents: read

# A new push to the same intake branch replaces a promotion still waiting for
# approval. Promotions of different branches can run together: the push to
# main is a fast-forward, so only one of them can land.
concurrency:
  group: upstream-intake-${{ github.event_name == 'workflow_dispatch' && github.run_id || format('promotion-{0}', github.event.workflow_run.head_branch) }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate promotion candidate
    if: github.repository == 'incognitojam/styal' && (github.event_name == 'workflow_dispatch' || (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success'))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      base_sha: ${{ steps.candidate.outputs.base_sha }}
      candidate_branch: ${{ steps.candidate.outputs.candidate_branch }}
      candidate_sha: ${{ steps.candidate.outputs.candidate_sha }}
      ci_run_url: ${{ steps.evidence.outputs.ci_run_url }}
      source_prs: ${{ steps.audit.outputs.source_prs }}
      source_commits: ${{ steps.audit.outputs.source_commits }}
      native_fingerprint: ${{ steps.fingerprint.outputs.verdict }}
      lane: ${{ steps.lane.outputs.lane }}
    steps:
      - name: Checkout trusted promotion code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      # Sparse checkout implies --filter=blob:none, and the upstream scripts read file
      # contents across history. One refetch replaces hundreds of on-demand blob fetches.
      - name: Fetch full file contents
        run: |
          git config --unset remote.origin.promisor || true
          git config --unset remote.origin.partialclonefilter || true
          git fetch --refetch --no-tags origin

      - id: evidence
        name: Resolve Fork CI evidence
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN_ID: ${{ github.event.workflow_run.id || inputs.ci_run_id }}
          CI_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          node --input-type=module <<'JS'
          import { execFileSync } from 'node:child_process';
          import { appendFileSync } from 'node:fs';
          const id = process.env.CI_RUN_ID;
          const attempt = process.env.CI_RUN_ATTEMPT;
          if (!/^[0-9]+$/.test(id) || (attempt && !/^[0-9]+$/.test(attempt))) {
            throw new Error('Expected a numeric Fork CI run and attempt.');
          }
          const path = `repos/${process.env.GITHUB_REPOSITORY}/actions/runs/${id}${attempt ? `/attempts/${attempt}` : ''}`;
          const run = JSON.parse(execFileSync('gh', ['api', path], { encoding: 'utf8' }));
          if (run.event !== 'push' || run.path !== '.github/workflows/fork-ci.yml' ||
              run.conclusion !== 'success' || !run.head_branch?.startsWith('intake/') ||
              !/^[0-9a-f]{40}$/.test(run.head_sha)) {
            throw new Error('Expected a successful Fork CI push on an intake branch.');
          }
          for (const [key, value] of Object.entries({
            candidate_branch: run.head_branch, candidate_sha: run.head_sha,
            ci_run_url: run.html_url, ci_run_id: run.id, ci_run_attempt: run.run_attempt,
          })) appendFileSync(process.env.GITHUB_OUTPUT, `${key}=${value}\n`);
          JS

      - id: candidate
        name: Resolve candidate
        shell: bash
        env:
          CANDIDATE_BRANCH: ${{ steps.evidence.outputs.candidate_branch }}
          EXPECTED_CANDIDATE_SHA: ${{ steps.evidence.outputs.candidate_sha }}
          DRY_RUN_BASE_SHA: ${{ inputs.base_sha }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ ! "$DRY_RUN_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::Dry runs require a full historical main SHA."
              exit 1
            fi
            git fetch --no-tags origin \
              '+refs/heads/main:refs/remotes/origin/main' \
              "$DRY_RUN_BASE_SHA" "$EXPECTED_CANDIDATE_SHA"
            base_sha="$(git rev-parse --verify "${DRY_RUN_BASE_SHA}^{commit}")"
            candidate_sha="$(git rev-parse --verify "${EXPECTED_CANDIDATE_SHA}^{commit}")"
            if ! git merge-base --is-ancestor "$base_sha" refs/remotes/origin/main; then
              echo "::error::The dry-run base is not in main's history."
              exit 1
            fi
            echo "Dry run: historical base $base_sha; no environment, approval or push." >> "$GITHUB_STEP_SUMMARY"
          else
            git fetch --no-tags origin \
              '+refs/heads/main:refs/remotes/origin/main' \
              "+refs/heads/${CANDIDATE_BRANCH}:refs/remotes/origin/intake-candidate"
            trusted_sha="$(git rev-parse --verify 'HEAD^{commit}')"
            base_sha="$(git rev-parse --verify 'refs/remotes/origin/main^{commit}')"
            candidate_sha="$(git rev-parse --verify 'refs/remotes/origin/intake-candidate^{commit}')"
            if [[ "$trusted_sha" != "$base_sha" ]]; then
              echo "::error::main moved after Fork CI finished. Rebase the intake branch and push it."
              exit 1
            fi
          fi
          if [[ "$candidate_sha" != "$EXPECTED_CANDIDATE_SHA" ]]; then
            echo "::error::The intake branch moved after Fork CI tested it; its new push starts its own promotion."
            exit 1
          fi
          if ! git diff --quiet "$base_sha" "$candidate_sha" -- .github/workflows/fork-ci.yml .github/scripts/ci-changes.cjs; then
            echo "::error::Candidates that change Fork CI or its job selector must land through a pull request."
            exit 1
          fi
          {
            echo "base_sha=$base_sha"
            echo "candidate_branch=$CANDIDATE_BRANCH"
            echo "candidate_sha=$candidate_sha"
          } >> "$GITHUB_OUTPUT"

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: false
          run-install: |
            args:
              - --filter=@t3tools/scripts...

      # Saved from main's scope, so every intake branch's Fork CI audit can restore it.
      - id: intake_target
        name: Read the intake target
        run: echo "sha=$(git show "${{ steps.candidate.outputs.base_sha }}:.github/upstream-intake.json" | jq -r .target)" >> "$GITHUB_OUTPUT"

      - name: Restore upstream PR associations
        uses: actions/cache/restore@v6
        with:
          path: .scratch/upstream-queue-*-prs.json
          key: upstream-associations-${{ steps.intake_target.outputs.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            upstream-associations-${{ steps.intake_target.outputs.sha }}-
            upstream-associations-

      - id: audit
        name: Audit candidate with trusted main code
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_BRANCH: ${{ steps.candidate.outputs.candidate_branch }}
          CANDIDATE_SHA: ${{ steps.candidate.outputs.candidate_sha }}
          CI_RUN_URL: ${{ steps.evidence.outputs.ci_run_url }}
        run: |
          git fetch --no-tags https://github.com/pingdotgg/t3code.git '+refs/heads/main:refs/remotes/upstream/main'
          vp run --filter @t3tools/scripts intake:check -- \
            --base "${{ steps.candidate.outputs.base_sha }}" \
            --head "$CANDIDATE_SHA"
          compare_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/main...${GITHUB_REPOSITORY/\//:}:$CANDIDATE_BRANCH"
          {
            echo
            echo "## Promotion validation"
            echo
            echo "- Candidate: \`$CANDIDATE_BRANCH\` at \`$CANDIDATE_SHA\`"
            echo "- Compare: [\`main...$CANDIDATE_BRANCH\`]($compare_url)"
            echo "- Fork CI: $CI_RUN_URL"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Require executed Fork CI jobs from the triggering attempt
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN_ID: ${{ steps.evidence.outputs.ci_run_id }}
          CI_RUN_ATTEMPT: ${{ steps.evidence.outputs.ci_run_attempt }}
          CANDIDATE_SHA: ${{ steps.candidate.outputs.candidate_sha }}
        run: |
          node --input-type=module <<'JS'
          import { execFileSync } from 'node:child_process';
          import { requireIntakeJobs } from './scripts/upstream/lib/promotion-evidence.ts';
          const api = (path) => JSON.parse(execFileSync('gh', ['api', path], { encoding: 'utf8' }));
          const root = `repos/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.CI_RUN_ID}`;
          const run = api(`${root}/attempts/${process.env.CI_RUN_ATTEMPT}`);
          if (run.head_sha !== process.env.CANDIDATE_SHA || run.event !== 'push' ||
              run.path !== '.github/workflows/fork-ci.yml' || run.conclusion !== 'success') {
            throw new Error('Fork CI evidence does not identify the tested candidate and workflow.');
          }
          const pages = JSON.parse(execFileSync('gh', ['api', '--paginate', '--slurp',
            `${root}/attempts/${process.env.CI_RUN_ATTEMPT}/jobs?per_page=100`], { encoding: 'utf8' }));
          requireIntakeJobs(pages.flatMap((page) => page.jobs));
          JS

      - name: Save upstream PR associations
        if: hashFiles('.scratch/upstream-queue-*-prs.json') != ''
        uses: actions/cache/save@v6
        with:
          path: .scratch/upstream-queue-*-prs.json
          key: upstream-associations-${{ steps.intake_target.outputs.sha }}-${{ github.run_id }}-${{ github.run_attempt }}

      - id: fingerprint
        name: Determine native evidence from trusted policy
        env:
          BASE_SHA: ${{ steps.candidate.outputs.base_sha }}
          CANDIDATE_SHA: ${{ steps.candidate.outputs.candidate_sha }}
        run: |
          node --input-type=module <<'JS'
          import { execFileSync } from 'node:child_process';
          import { appendFileSync } from 'node:fs';
          import { touchesNativeFingerprint } from './scripts/upstream/intake-run.ts';
          const paths = execFileSync('git', ['diff', '--name-only', '--no-renames', '-z',
            process.env.BASE_SHA, process.env.CANDIDATE_SHA], { encoding: 'utf8', maxBuffer: 256 * 1024 * 1024 }).split('\0').filter(Boolean);
          const verdict = touchesNativeFingerprint(paths) ? 'unknown' : 'unchanged';
          appendFileSync(process.env.GITHUB_OUTPUT, `verdict=${verdict}\n`);
          appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            `\n## Native fingerprint\n\nTrusted input comparison: ${verdict}. This is a conservative path screen, including JS and tests, not a computed native fingerprint. Candidate artifacts are informational only; potential input changes require manual comparison.\n`);
          JS

      - id: lane
        name: Choose the promotion lane
        shell: bash
        env:
          AUTOMATIC_ELIGIBLE: ${{ steps.audit.outputs.automatic_eligible }}
          NATIVE_FINGERPRINT: ${{ steps.fingerprint.outputs.verdict }}
        run: |
          set -euo pipefail
          if [[ "$AUTOMATIC_ELIGIBLE" == "true" && "$NATIVE_FINGERPRINT" == "unchanged" ]]; then
            lane=automatic
            reason="The audit found nothing that needs a person and the native fingerprint is unchanged."
          elif [[ "$AUTOMATIC_ELIGIBLE" != "true" ]]; then
            lane=manual
            reason="The audit requires manual approval; see its reasons above."
          else
            lane=manual
            reason="The native fingerprint is $NATIVE_FINGERPRINT."
          fi
          echo "lane=$lane" >> "$GITHUB_OUTPUT"
          {
            echo
            echo "## Promotion lane"
            echo
            echo "**${lane}**: $reason"
          } >> "$GITHUB_STEP_SUMMARY"

      # Informational only: its own timeout keeps a slow report from cancelling the job.
      - name: Report projected upstream lag
        continue-on-error: true
        timeout-minutes: 4
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ steps.candidate.outputs.candidate_sha }}
        run: |
          git fetch --no-tags https://github.com/pingdotgg/t3code.git '+refs/heads/main:refs/remotes/upstream/main'
          node scripts/upstream/lag-report.ts --fork-ref "$CANDIDATE_SHA" >> "$GITHUB_STEP_SUMMARY"
          node scripts/upstream/tracked-prs-report.ts --fork-ref "$CANDIDATE_SHA" >> "$GITHUB_STEP_SUMMARY"
          node scripts/upstream/divergence-report.ts --base origin/main --head "$CANDIDATE_SHA" --heading "Projected upstream divergence" >> "$GITHUB_STEP_SUMMARY"

  required_checks:
    name: Wait for readiness and main's required checks
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 190
    permissions:
      actions: read
      checks: read
      statuses: read
      contents: read
    steps:
      # Removing credentials inside the checkout step runs `git submodule foreach`, which fails on
      # the .repos/ gitlinks that have no .gitmodules entry. The token is read-only here.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Wait for coordinator readiness
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ needs.validate.outputs.candidate_sha }}
          PROMOTION_LANE: ${{ needs.validate.outputs.lane }}
          READINESS_CHECKS: ${{ github.event_name == 'workflow_dispatch' && '1' || '301' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$PROMOTION_LANE" == "automatic" ]]; then
            echo "Automatic lane: coordinator readiness is not required." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "Waiting for Intake ready on $CANDIDATE_SHA before requesting approval." >> "$GITHUB_STEP_SUMMARY"
          for ((attempt=1; attempt<=READINESS_CHECKS; attempt++)); do
            if gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/commits/$CANDIDATE_SHA/status?per_page=100" |
              jq -e --arg sha "$CANDIDATE_SHA" 'any(.[]; .sha == $sha and any(.statuses[]; .context == "Intake ready" and .state == "success"))' > /dev/null; then
              echo "Coordinator ready: Intake ready succeeded on $CANDIDATE_SHA." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            if ((attempt < READINESS_CHECKS)); then sleep 30; fi
          done
          echo "No approval requested: Intake ready is missing or unsuccessful on $CANDIDATE_SHA. Post readiness after review, then rerun Fork CI if this wait expired. Dry runs check once." | tee -a "$GITHUB_STEP_SUMMARY"
          exit 1

      # Candidates receive a successful landing hold status; PRs receive pending.
      - name: Wait for main's required checks on the candidate
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ needs.validate.outputs.candidate_sha }}
        run: node scripts/upstream/wait-required-checks.ts

  promote:
    name: ${{ needs.validate.outputs.lane == 'automatic' && 'Promote eligible candidate' || 'Approve and promote candidate' }}${{ needs.validate.outputs.native_fingerprint != 'unchanged' && format(' (native fingerprint {0})', needs.validate.outputs.native_fingerprint) || '' }}
    needs: [validate, required_checks]
    if: github.event_name == 'workflow_run' && needs.validate.result == 'success' && needs.required_checks.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: ${{ needs.validate.outputs.lane == 'automatic' && 'upstream-intake-automatic' || 'upstream-intake-manual' }}
    permissions:
      actions: read
      checks: read
      statuses: read
      contents: read
    steps:
      - id: porter_token
        name: Mint Styal Porter token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.STYAL_INTAKE_APP_ID }}
          private-key: ${{ secrets.STYAL_INTAKE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      - name: Checkout current main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.porter_token.outputs.token }}
          persist-credentials: true
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Fast-forward main to the candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_BASE_SHA: ${{ needs.validate.outputs.base_sha }}
          CANDIDATE_BRANCH: ${{ needs.validate.outputs.candidate_branch }}
          CANDIDATE_SHA: ${{ needs.validate.outputs.candidate_sha }}
          CI_RUN_URL: ${{ needs.validate.outputs.ci_run_url }}
          SOURCE_PRS: ${{ needs.validate.outputs.source_prs }}
          SOURCE_COMMITS: ${{ needs.validate.outputs.source_commits }}
        run: |
          set -euo pipefail

          if [[ ! "$EXPECTED_BASE_SHA" =~ ^[0-9a-f]{40}$ ]] ||
            [[ ! "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          then
            echo "::error::Promotion received an invalid base or candidate SHA."
            exit 1
          fi

          git fetch --no-tags origin \
            '+refs/heads/main:refs/remotes/origin/main' \
            "+refs/heads/${CANDIDATE_BRANCH}:refs/remotes/origin/intake-candidate"

          current_main_sha="$(git rev-parse --verify 'refs/remotes/origin/main^{commit}')"
          current_candidate_sha="$(git rev-parse --verify 'refs/remotes/origin/intake-candidate^{commit}')"

          if [[ "$current_main_sha" != "$EXPECTED_BASE_SHA" ]]; then
            echo "::error::main moved after validation. Rebase the intake branch and dispatch again."
            exit 1
          fi
          if [[ "$current_candidate_sha" != "$CANDIDATE_SHA" ]]; then
            echo "::error::The intake branch moved after validation. Review and dispatch its new SHA."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$current_main_sha" "$CANDIDATE_SHA"; then
            echo "::error::The candidate is no longer a fast-forward of main."
            exit 1
          fi

          node scripts/upstream/wait-required-checks.ts --once

          git push origin "${CANDIDATE_SHA}:refs/heads/main"

          promoted_sha="$(git ls-remote --exit-code origin refs/heads/main | cut -f1)"
          if [[ "$promoted_sha" != "$CANDIDATE_SHA" ]]; then
            echo "::error::main does not point at the candidate after the push."
            exit 1
          fi

          {
            echo "## Promotion complete"
            echo
            echo "- Branch: \`$CANDIDATE_BRANCH\`"
            echo "- Promoted SHA: \`$CANDIDATE_SHA\`"
            echo "- Source PRs: \`$SOURCE_PRS\`"
            echo "- Source commits: \`$SOURCE_COMMITS\`"
            echo "- Verified Fork CI: $CI_RUN_URL"
            echo "- Push actor: \`${{ steps.porter_token.outputs.app-slug }}[bot]\`"
          } >> "$GITHUB_STEP_SUMMARY"
