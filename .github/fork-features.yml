  - id: workflow-approvals-same-repository
    title: Surface and approve GitHub workflow runs waiting on same-repository pull requests
    status: maintained
    prs: [986]
    invariants:
      - GitHub pull request detail and checks list Actions runs on the head that wait for approval (`action_required`) for same-repository pull requests as well as forks, as action-required checks with `workflowApprovalsRequired`.
      - Waiting runs are read from the head commit's check suites over GraphQL (`ACTION_REQUIRED` suites with a `pull_request` workflow run), because GitHub's REST run listing filtered by `head_sha`, `status`, `branch` or `check_suite_id` answers inconsistently. The checks revalidator no longer lists runs.
      - A same-repository head needs no check that it names one pull request, so its runs cost one GraphQL read. When that read fails, nothing is shown; a fork keeps its "Workflow approval status" unknown row.
      - Approving a same-repository run calls GitHub's approve endpoint and, when GitHub refuses it with 403 or 422, re-runs the run, after confirming the head has not moved.
      - A watched pull request wakes its agent once when workflow runs wait for approval, naming them apart from failed checks and telling the agent to leave approval to the user unless told otherwise.
      - Runs waiting for approval are listed before the other checks. The web Checks tab names them in a notice above the jobs, with the same Approve workflows to run button the Summary tab shows, instead of as job rows.
      - Each approval pressed in a client that reports its surface records one `workflow-approvals` feature.used event with its outcome and no repository, pull request or workflow names.
    rationale: GitHub creates runs for pull requests that a workflow's GITHUB_TOKEN opens or updates, such as Changesets release pull requests, in an approval-required state. Without this the panel reads "waiting" forever and watched agents never wake.
    implementation_paths:
      - apps/mobile/src/features/pull-requests/pullRequestStatus.ts
      - apps/server/src/orchestration-v2/pullRequestWatch.ts
      - apps/server/src/telemetry/ClientFeatureUsage.ts
