  - id: sidebar-project-thread-groups
    title: Group active sidebar threads under project headers
    status: maintained
    prs: [533, 546, 585, 745]
    invariants:
      - Settings → General → Organization → Group threads by project is off by default; when off, active threads stay one flat list.
      - On mobile, Settings → Organization → Group threads by project is a per-device preference, off by default. The phone list and the tablet sidebar group active and Working threads under headers with the project icon, name and a pin icon for pinned projects, using the same project order rules as web. Move up and Move down step past the neighbouring thread in the same project. Mobile headers are not interactive, and the Arrange threads sheet stays one list.
      - With grouping on, active threads sit under one header per logical project, so matching repositories across environments share a header. Cards under a header omit the project icon and name, while pinned, snoozed, and settled threads keep their existing layout.
      - With grouping and the Working section on, Working threads sit under non-draggable headers per logical project, ordered by the saved project order and then the project list, so sending work never reorders projects. Within a project they keep newest-send-first order.
      - On web and desktop, a project group whose threads in that section all lack branches uses 36px one-line rows; if any of them has a branch, every row in that group keeps the two-line layout. Active and Working groups decide this separately. Turning grouping off restores the flat list layout.
      - One-line grouped rows retain the title, pull request badge or terminal status, status/time and hover actions, and trailing machine/provider icons, using existing thread branch data without additional WebSocket payloads or git status lookups.
      - A dragged thread reorders only within its own project and never moves a project, including the first reorder that assigns manual thread keys and the optimistic placement while those writes arrive. Dragging a project header moves the whole project, and that order persists in the client's manual project order.
      - Projects without a saved position follow their newest created or reopened active thread independently of manual thread keys.
      - Pinned projects lead the grouped Active and Working lists in their shared pin order, ahead of the saved project order, and their headers show a pin icon. A zero-height divider follows the pinned projects' groups and shows a "Pinned projects above" label only while a header is dragged. Dropping a header above it pins the project at that slot, dropping it below unpins it, and moving it among pinned projects saves the pin order through the shared project write hook; pinned projects without active threads keep their place relative to the pinned projects around the drop. The new placement shows at once and holds until the projects match it or the write fails.
      - Group headers open project actions on right-click or the keyboard context-menu shortcut to start a thread in that project, toggle its filter, pin or unpin it, archive it, copy a checkout path, or open Project Settings. Pin and archive appear only when every machine with the project supports project organization. New threads preserve the current environment when it belongs to the group; grouped paths are selectable per checkout.
      - Header reorders, pins, unpins, pin reorders and archives emit bounded `sidebar-project-groups` client-usage events with the entry point (header drag or header menu) through the primary environment, after the write succeeds, never with project names or keys.
    rationale: With several projects active, a flat list makes the user read each card's project label to see which threads belong together. The fork retains thread details under opt-in project headers, omitting the empty branch line when an entire group is branchless, whereas upstream's closed proposal collapsed groups into title-only lists.
