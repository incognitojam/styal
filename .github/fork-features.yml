  - id: claude-stop-waits-for-cli-exit
    title: Stop a Claude session only once its CLI has exited
    status: maintained
    prs: [620, 621, 1128]
    invariants:
      - Stopping a Claude session waits for its CLI process to exit, up to a grace measured from the SDK close, then kills the process itself; the session's exit event follows the process, not the close call.
      - Every Claude CLI logs its pid at spawn and its exit code or signal at exit, with the end of its stderr when the exit was not clean.
      - When a Claude session fails to start, T3 Code closes the CLI and waits the same grace before killing it, so hooks the CLI started, which run in their own sessions, stop with it.
    rationale: A server update resumes a running session in a new server process as soon as the old server exits, and the SDK's close returns before the CLI does, so without the wait two CLIs can hold the same session and transcript.
    implementation_paths:
      - apps/server/src/orchestration-v2/Adapters/ClaudeAdapterV2.ts
      - apps/server/src/provider/ClaudeProcess.ts
    upstream_paths:
      - apps/server/src/orchestration-v2/Adapters/ClaudeAdapterV2.ts
    tests:
