      - apps/server/src/orchestration-v2/Adapters/ClaudeAgentSdkQueryRunner.test.ts
      - apps/server/src/provider/ClaudeProcess.test.ts
    upstream:
      status: partial
      tracking:
        - https://github.com/pingdotgg/t3code/pull/2829
      retire_when: Upstream's Claude adapter waits for the CLI process to exit before a stop completes and logs the process's spawn, exit and stderr.

