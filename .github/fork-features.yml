  - id: provider-auto-default
    title: Apply an Auto default only where the provider reviews actions
    status: maintained
    prs: [928, 930, 943]
    invariants:
      - The built-in default permission mode for new threads stays Full access, as upstream; Auto as the default is the user's choice.
      - With Auto as the default, a new thread on a provider whose snapshot does not report its own Auto reviewer (reviewsAutoMode) starts in Full access; Claude, Codex, Cursor, and Grok report one. An unloaded snapshot or an older server counts as no reviewer.
      - Web and mobile drafts follow their selected provider until the user picks a mode; the server's bootstrap thread uses the same resolution. Picking Auto for one thread keeps Auto on every provider.
      - The provider canary's auto scenario fails a release whose Auto turn asks for approval of a routine workspace write, or whose provider does not report applying Auto; providers without reviewsAutoMode skip it.
      - provider.turn.completed reports approvalRequests, the command, file, and permission approvals the turn raised, alongside its runtimeMode.
      - On Codex turns that ran in Auto, provider.turn.completed also reports autoReviewsApproved, autoReviewsDenied, autoReviewsTimedOut, and autoReviewsAborted, counted from the reviewer's item/autoApprovalReview/completed verdicts; turns in other modes leave them out.
    rationale: Auto is the safer default where a reviewer approves routine actions, but on a provider without one Auto asks about every action, which would stall threads nobody is watching. Making Auto the built-in default for everyone was withdrawn before release; approval counts from opted-in users are meant to inform that decision.
