[package]
name = "t3-dictation"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
serde_json = "1.0.150"
transcribe-cpp = { version = "0.1.3", default-features = false }

# Linux stays static CPU-only: headless servers rarely have usable Vulkan, CPU
# runs at 0.39 RTF (spike finding 17), and a single binary with no loadable
# modules keeps sidecar packaging trivial. Handy ships dynamic-backends+vulkan
# for desktop Linux; revisit only if a GPU server deployment materialises.
[target.'cfg(target_os = "macos")'.dependencies]
transcribe-cpp = { version = "0.1.3", default-features = false, features = ["metal"] }

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
