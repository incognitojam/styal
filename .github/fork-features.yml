      - apps/server/src/orchestration-v2/AttachmentClaims.test.ts
      - apps/server/src/orchestration-v2/CheckpointCaptureService.test.ts
      - apps/server/src/vcs/GitVcsDriver.test.ts
      - e2e/tests/chat-smoke.e2e.ts
    upstream:
      status: unassessed
      tracking: []
      retire_when: Upstream copies these files without `copyFile`, or OpenZFS stops waiting for a sync when cloning dirty blocks.

