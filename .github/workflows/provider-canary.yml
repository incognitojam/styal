name: Provider canary

# Verifies new provider CLI releases with real turns against the published
# stable and nightly styal builds, checked out from their release tags, and
# records each passing version in the model manifest's `autoUpdates` with the
# build it passed on. Servers fetch that manifest from main and automatically
# update only to a version verified on a build their code contains. Problems
# are kept in one "Provider canary status" issue.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      provider:
        description: "Only this provider (codex, claudeAgent, opencode)"
        required: false
        type: string
      force:
        description: "Verify even when the latest release is already recorded"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: provider-canary
  cancel-in-progress: false

env:
  CANARY_BRANCH: automation/provider-canary

jobs:
  plan:
    name: Plan
    if: github.repository == 'incognitojam/styal'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has_work: ${{ steps.plan.outputs.has_work }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: false
          run-install: |
            args:
              - --filter=@t3tools/scripts...

      # Versions an open canary pull request already records are not verified
      # again, and are carried into today's pull request.
      # The branch is one commit on main; its parent is the base that tells
      # the pull request's own additions apart from main's entries.
      - name: Read the open canary pull request
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p "$RUNNER_TEMP/plan"
          open="$(gh pr list --head "$CANARY_BRANCH" --base main --state open --json number --jq 'length')"
          if [[ "$open" != "0" ]] && git fetch --depth=2 origin "$CANARY_BRANCH"; then
            git show FETCH_HEAD:apps/server/src/provider/model-manifest.json \
              > "$RUNNER_TEMP/plan/pending-manifest.json"
            git show FETCH_HEAD^:apps/server/src/provider/model-manifest.json \
              > "$RUNNER_TEMP/plan/pending-base-manifest.json"
          fi

      - id: plan
        name: Find provider releases to verify
        env:
          PROVIDER: ${{ inputs.provider }}
          FORCE: ${{ inputs.force }}
        run: |
          args=(--json "$RUNNER_TEMP/plan/plan.json"
            --pending "$RUNNER_TEMP/plan/pending-manifest.json"
            --pending-base "$RUNNER_TEMP/plan/pending-base-manifest.json")
          if [[ -n "$PROVIDER" ]]; then args+=(--provider "$PROVIDER"); fi
          if [[ "$FORCE" == "true" ]]; then args+=(--force); fi
          node scripts/provider-canary.ts plan "${args[@]}"

      - name: Upload plan
        uses: actions/upload-artifact@v7
        with:
          name: canary-plan
          path: ${{ runner.temp }}/plan/
          retention-days: 7

  verify:
    name: Verify ${{ matrix.provider }} ${{ matrix.version }} on ${{ matrix.styal }}
    needs: plan
    if: needs.plan.outputs.has_work == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      API_KEY: ${{ secrets[matrix.secret] }}
    steps:
      - id: secret
        name: Check provider credentials
        env:
          PROVIDER: ${{ matrix.provider }}
          STYAL: ${{ matrix.styal }}
          PACKAGE: ${{ matrix.packageName }}
          VERSION: ${{ matrix.version }}
          SECRET_NAME: ${{ matrix.secret }}
        run: |
          outcome_file="$RUNNER_TEMP/canary-outcome/$PROVIDER-$STYAL.json"
          mkdir -p "$(dirname "$outcome_file")"
          if [[ -z "$API_KEY" ]]; then
            echo "::notice title=$PROVIDER not verified::The $SECRET_NAME secret is not set."
            jq -n --arg provider "$PROVIDER" --arg package "$PACKAGE" --arg version "$VERSION" --arg styal "$STYAL" \
              --arg detail "The $SECRET_NAME secret is not set." \
              '{provider: $provider, packageName: $package, version: $version, styal: $styal, outcome: "skipped", detail: $detail}' \
              > "$outcome_file"
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      # The build's own source, so the verified server is the published one.
      - name: Checkout styal ${{ matrix.styal }}
        if: steps.secret.outputs.present == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ matrix.ref }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup dependencies
        if: steps.secret.outputs.present == 'true'
        uses: ./.github/actions/setup-deps
        with:
          filters: |
            @styal/cli...

      # An isolated prefix keeps the verified release first on PATH and away
      # from any provider CLI preinstalled on the runner.
      - name: Install ${{ matrix.packageName }}@${{ matrix.version }}
        if: steps.secret.outputs.present == 'true'
        env:
          PACKAGE: ${{ matrix.packageName }}@${{ matrix.version }}
          BINARY: ${{ matrix.binary }}
        run: |
          prefix="$RUNNER_TEMP/provider-cli"
          npm install --global --prefix "$prefix" "$PACKAGE"
          echo "$prefix/bin" >> "$GITHUB_PATH"
          "$prefix/bin/$BINARY" --version

      # The styal server passes OPENAI_API_KEY and ANTHROPIC_API_KEY through to
      # provider processes. Codex keeps its login in CODEX_HOME instead.
      # A failed run is retried once: a model can skip a requested tool, and a
      # rate limit can stop a turn. A pass on the retry is reported in the
      # status issue but still recorded.
      - id: verify
        name: Run real provider turns
        if: steps.secret.outputs.present == 'true'
        env:
          PROVIDER: ${{ matrix.provider }}
          STYAL: ${{ matrix.styal }}
          PACKAGE: ${{ matrix.packageName }}
          MODEL: ${{ matrix.model }}
          VERSION: ${{ matrix.version }}
          SECRET_NAME: ${{ matrix.secret }}
          TMPDIR: ${{ runner.temp }}
        run: |
          export "$SECRET_NAME=$API_KEY"
          if [[ "$PROVIDER" == "codex" ]]; then
            printenv OPENAI_API_KEY | codex login --with-api-key
          fi
          run_verifier() {
            local log="$RUNNER_TEMP/verify-$1.log"
            node apps/server/scripts/verify-provider-live.ts \
              --provider "$PROVIDER" --model "$MODEL" --expect-version "$VERSION" \
              2>&1 | tee "$log"
            local status=${PIPESTATUS[0]}
            evidence="$(sed -n 's/^Evidence: //p' "$log" | head -n 1)"
            if [[ -n "$evidence" && -f "$evidence/result.json" ]]; then
              jq -r --arg attempt "$1" '"### \(.provider) \(.version) (\(.model)), attempt \($attempt)\n\n| Scenario | Status | Seconds | Detail |\n| --- | --- | --- | --- |", (.scenarios[] | "| \(.name) | \(.status) | \(.seconds // "") | \(.detail) |")' \
                "$evidence/result.json" >> "$GITHUB_STEP_SUMMARY"
              detail="$(jq -r '[.scenarios[] | select(.status == "failed") | "\(.name): \(.detail)"] | join("; ")' "$evidence/result.json" | cut -c1-500)"
            else
              detail="the verifier did not finish; see the evidence artifact"
            fi
            [[ -n "$detail" ]] || detail="the verifier exited with status $status"
            return "$status"
          }
          set +e
          run_verifier 1
          first=$?
          first_detail="$detail"
          outcome=passed
          if [[ "$first" != 0 ]]; then
            run_verifier 2
            if [[ $? == 0 ]]; then
              outcome=flaky
              detail="first attempt failed: $first_detail"
            else
              outcome=failed
            fi
          fi
          set -e
          [[ "$outcome" == passed ]] && detail=""
          echo "outcome=$outcome" >> "$GITHUB_OUTPUT"
          outcome_file="$RUNNER_TEMP/canary-outcome/$PROVIDER-$STYAL.json"
          jq -n --arg provider "$PROVIDER" --arg package "$PACKAGE" --arg version "$VERSION" --arg styal "$STYAL" \
            --arg outcome "$outcome" --arg detail "$detail" \
            '{provider: $provider, packageName: $package, version: $version, styal: $styal, outcome: $outcome, detail: $detail}' \
            > "$outcome_file"
          if [[ "$outcome" == failed ]]; then
            echo "::error title=$PROVIDER $VERSION failed verification::$detail"
            exit 1
          fi

      - name: Record an unfinished verification
        if: always() && steps.secret.outputs.present == 'true' && steps.verify.outputs.outcome == ''
        env:
          PROVIDER: ${{ matrix.provider }}
          STYAL: ${{ matrix.styal }}
          PACKAGE: ${{ matrix.packageName }}
          VERSION: ${{ matrix.version }}
        run: |
          outcome_file="$RUNNER_TEMP/canary-outcome/$PROVIDER-$STYAL.json"
          mkdir -p "$(dirname "$outcome_file")"
          jq -n --arg provider "$PROVIDER" --arg package "$PACKAGE" --arg version "$VERSION" --arg styal "$STYAL" \
            '{provider: $provider, packageName: $package, version: $version, styal: $styal, outcome: "failed", detail: "setup or install failed before the verifier ran; see the job log"}' \
            > "$outcome_file"

      - name: Upload outcome
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: canary-outcome-${{ matrix.provider }}-${{ matrix.styal }}
          path: ${{ runner.temp }}/canary-outcome/
          retention-days: 7

      # Evidence holds the server log, thread projections and events, not the
      # provider's own home directory or credentials. Both attempts are kept,
      # so a pass on the retry still shows why the first attempt failed.
      - name: Upload evidence
        if: always() && steps.secret.outputs.present == 'true' && steps.verify.outputs.outcome != 'passed'
        uses: actions/upload-artifact@v7
        with:
          name: canary-evidence-${{ matrix.provider }}-${{ matrix.version }}-${{ matrix.styal }}
          path: |
            ${{ runner.temp }}/styal-provider-live-*/*.json
            ${{ runner.temp }}/styal-provider-live-*/*.ndjson
            ${{ runner.temp }}/styal-provider-live-*/server.log
          retention-days: 14

  # Records every provider that passed, even when another failed verification.
  record:
    name: Record verified versions
    needs: [plan, verify]
    if: ${{ !cancelled() && needs.plan.outputs.has_work == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Download outcomes
        uses: actions/download-artifact@v8
        with:
          pattern: canary-outcome-*
          merge-multiple: true
          path: ${{ runner.temp }}/canary-outcomes

      - name: Download plan
        uses: actions/download-artifact@v8
        with:
          name: canary-plan
          path: ${{ runner.temp }}/plan

      - id: results
        name: Collect passing results
        run: |
          shopt -s nullglob
          files=("$RUNNER_TEMP"/canary-outcomes/*.json)
          jq -s '[.[] | select(.outcome == "passed" or .outcome == "flaky")]' "${files[@]}" /dev/null \
            > "$RUNNER_TEMP/canary-results.json"
          if [[ "$(jq length "$RUNNER_TEMP/canary-results.json")" == 0 ]]; then
            echo "No provider passed verification."
            echo "any=false" >> "$GITHUB_OUTPUT"
          else
            echo "any=true" >> "$GITHUB_OUTPUT"
          fi

      # Pull requests opened with GITHUB_TOKEN do not trigger Fork CI, so an
      # app token opens this one.
      - id: app_token
        name: Mint app token
        if: steps.results.outputs.any == 'true'
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.NIGHTLY_APP_CLIENT_ID }}
          private-key: ${{ secrets.NIGHTLY_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout main
        if: steps.results.outputs.any == 'true'
        uses: actions/checkout@v7
        with:
          ref: main
          token: ${{ steps.app_token.outputs.token }}
          persist-credentials: true
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup dependencies
        if: steps.results.outputs.any == 'true'
        uses: ./.github/actions/setup-deps
        with:
          filters: |
            @styal/cli...
            @t3tools/scripts...

      - id: record
        name: Record versions in the model manifest
        if: steps.results.outputs.any == 'true'
        run: |
          args=(--pending "$RUNNER_TEMP/plan/pending-manifest.json"
            --pending-base "$RUNNER_TEMP/plan/pending-base-manifest.json")
          while IFS=$'\t' read -r provider package version styal; do
            args+=(--provider "$provider" --package "$package" --version "$version" --styal "$styal")
          done < <(jq -r 'sort_by(.provider, .styal)[] | [.provider, .packageName, .version, .styal] | @tsv' "$RUNNER_TEMP/canary-results.json")
          node scripts/provider-canary.ts record "${args[@]}"
          if git diff --quiet -- apps/server/src/provider/model-manifest.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          # Importing the manifest module decodes the bundled file with the server's schema.
          node --input-type=module -e "await import('./apps/server/src/provider/ModelManifest.ts')"
          vp test run apps/server/src/provider/ModelManifest.test.ts
          summary="$(jq -r 'map("\(.packageName)@\(.version)") | unique | join(", ")' "$RUNNER_TEMP/canary-results.json")"
          builds="$(jq -r 'map(.styal) | unique | join(" and ")' "$RUNNER_TEMP/canary-results.json")"
          echo "builds=$builds" >> "$GITHUB_OUTPUT"
          echo "summary=$summary" >> "$GITHUB_OUTPUT"

      - name: Open or update the pull request
        if: steps.record.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          GH_REPO: incognitojam/styal
          SUMMARY: ${{ steps.record.outputs.summary }}
          BUILDS: ${{ steps.record.outputs.builds }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="chore(providers): verify $SUMMARY for automatic updates"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$CANARY_BRANCH"
          git add apps/server/src/provider/model-manifest.json
          git commit -m "$title"
          # Rebuilt from main on every run; entries the open pull request held
          # were carried over by the record step.
          git push --force origin "$CANARY_BRANCH"
          body="$(printf '%s\n\n%s\n\n%s\n' \
            "Real provider turns passed for $SUMMARY on styal $BUILDS: a tool turn, checkpoint, resume, interrupt, approval, rewind, native subagent, and follow-ups after a server restart." \
            "Merging this adds them to \`autoUpdates\` in the model manifest. Servers whose code contains those builds, with automatic provider updates on, then install them." \
            "Canary run: $RUN_URL")"
          number="$(gh pr list --head "$CANARY_BRANCH" --base main --state open --json number --jq '.[0].number // empty')"
          if [[ -n "$number" ]]; then
            gh pr edit "$number" --title "$title" --body "$body"
          else
            gh pr create --head "$CANARY_BRANCH" --base main --title "$title" --body "$body"
          fi

  # Keeps the "Provider canary status" issue in step with this run. It comments
  # only when a new problem appears or every problem clears.
  report:
    name: Report
    needs: [plan, verify, record]
    if: ${{ !cancelled() && github.repository == 'incognitojam/styal' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: false
          run-install: |
            args:
              - --filter=@t3tools/scripts...

      - name: Download plan
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: canary-plan
          path: ${{ runner.temp }}/plan

      - name: Download outcomes
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: canary-outcome-*
          merge-multiple: true
          path: ${{ runner.temp }}/canary-outcomes

      - name: Update the status issue
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PLAN_RESULT: ${{ needs.plan.result }}
          RECORD_RESULT: ${{ needs.record.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          args=(--run-url "$RUN_URL" --plan "$RUNNER_TEMP/plan/plan.json" --outcomes "$RUNNER_TEMP/canary-outcomes"
            --plan-result "$PLAN_RESULT" --record-result "$RECORD_RESULT")
          node scripts/provider-canary.ts report "${args[@]}"
