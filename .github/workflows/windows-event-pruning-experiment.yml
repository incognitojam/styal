name: Windows pruning startup diagnostics
on:
  push:
    branches: [ci-experiment/windows-pruning-diagnostics-20261119]
permissions:
  contents: read
concurrency:
  group: windows-pruning-diagnostics-20261119
  cancel-in-progress: true
jobs:
  diagnostics:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: false
          run-install: false
      - run: vp install
      - name: Isolated pruning off and on startup comparison
        shell: pwsh
        env:
          EVENT_PRUNING_DIAGNOSTICS_ROOT: ${{ runner.temp }}/windows-pruning-diagnostics
        run: node apps/server/scripts/windows-pruning-diagnostics.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-pruning-startup-diagnostics
          path: |
            ${{ runner.temp }}/windows-pruning-diagnostics/*.log
            ${{ runner.temp }}/windows-pruning-diagnostics/*.json
          if-no-files-found: ignore
