  - id: fork-distribution-identity
    title: Keep fork desktop builds distinctly identifiable
    status: maintained
    prs: [3, 27, 29, 49, 56, 235, 242, 243, 244]
    invariants:
      - Packaged builds ship as styal with their own application identifier, URL scheme, product name, and About-panel identity instead of presenting as upstream T3 Code.
      - Electron's application name is a stable identity slug rather than a display string, so OS credential storage keys stay in the same namespace as the user-data directory they protect.
      - styal owns its base directory, user-data directory, and URL scheme, so it installs and runs alongside upstream T3 Code without sharing state.
      - Windows fork packages install under their own package directory without colliding with upstream, while Alpha and Nightly builds remain visibly distinguishable.
      - Canonical brand asset paths and icon geometry stay shared across desktop, mobile configuration, web packaging, and export tooling so production and nightly artwork cannot silently diverge.
    implementation_paths:
      - apps/desktop/package.json
      - apps/desktop/resources/installer.nsh
      - apps/desktop/src/app/DesktopAssets.ts
      - apps/desktop/src/app/DesktopEnvironment.ts
      - apps/mobile/app.config.ts
      - apps/web/src/branding.logic.ts
      - apps/web/src/branding.ts
      - apps/web/src/components/settings/SettingsPanels.tsx
      - packages/shared/src/brandAssets.ts
      - scripts/build-desktop-artifact.ts
      - scripts/export-brand-icons.ts
      - scripts/lib/brand-assets.ts
      - scripts/lib/macos-icon-safe-area.ts
    upstream_paths:
      - apps/desktop/package.json
      - apps/desktop/src/app/DesktopAssets.ts
      - apps/desktop/src/app/DesktopEnvironment.ts
      - apps/mobile/app.config.ts
      - apps/web/src/branding.logic.ts
      - apps/web/src/branding.ts
