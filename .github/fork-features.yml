  - id: turn-token-usage
    title: Show the model, token usage, and estimated cost under each agent turn, and the thread's total
    status: review-needed
    prs: [735, 736, 737]
    invariants:
      - Completed or aborted provider turns retain reported token usage and model choices; turns with neither contribute no usage. Legacy threads preserve their recorded usage and exact cost as a frozen history baseline.
      - Every provider reports the model and reasoning-option id each turn starts with; the provider service copies them onto the turn's completion, replacing the model on a reroute, and clients name them as the composer does, falling back to the provider's ids.
      - Web and desktop show the turn's model and effort, then its total tokens, beside its timestamp, with input, cached share, output, reasoning, and cache writes on hover; mobile shows the same with details on tap.
      - Thread totals combine every persisted provider turn with the frozen legacy history baseline, so bounded client history windows do not undercount long threads. Multiple provider turns in one application run aggregate once for its turn label; breakdowns indicate partial usage and cost coverage.
      - Claude, Codex, and OpenCode turns record their subagents' usage separately from the main agent's; turn and thread figures include it, and the breakdown notes subagent usage only where a provider could not report it. Claude's share is the turn's growth in `modelUsage` less the main loop's usage; Codex and OpenCode subagent threads add their usage to every live turn above them while keeping their own figures, and usage after the calling turn ends stays on the subagent's thread only.
      - The server prices each turn when recording it, by model where the provider splits usage, preferring custom rates, then the provider's own cost (Claude modelUsage, OpenCode steps), then LiteLLM rates; a turn with any unpriced model records no cost. Breakdowns show the turn's and thread's estimated API cost, and say how many turns the thread's cost covers.
      - A client setting (device-local on mobile) makes the turn and thread figures lead with the estimated cost, falling back to tokens where there is none. Web and desktop show the thread's figure in the composer toolbar and roll its changed digits once when it changes within a thread, never on a thread switch and not under reduced motion; mobile shows it after the project and environment in the thread header subtitle, without the token unit, keeping the composer toolbar to message controls.
      - Compact thread shells carry the total across the complete retained provider-turn history and frozen legacy baseline; sidebar and subagent hover cards (timeline, Lineage, and workflow members) on web and desktop show tokens or estimated cost according to the same device setting. Subagent cards use their child thread's totals and omit the figure when usage is unavailable.
      - Claude, Codex, and OpenCode report partial usage while a turn runs; each update replaces that provider turn's prior snapshot, and its final result replaces live usage without double counting. Child provider turns contribute once, and rolled-back turns contribute nothing.
      - A client setting (device-local on mobile) hides the figures; usage metadata does not render as a work-log row.
    implementation_paths:
