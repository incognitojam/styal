[package]
name = "parakeet-sidecar"
version = "0.1.0"
edition = "2021"

[dependencies]
serde_json = "1"
transcribe-cpp = { version = "0.1.3", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
transcribe-cpp = { version = "0.1.3", default-features = false, features = ["metal"] }

[profile.release]
opt-level = 3
