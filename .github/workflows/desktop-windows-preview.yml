name: Desktop Windows Preview

on:
  pull_request:
    types: [labeled, unlabeled, synchronize, reopened, closed]

permissions:
  contents: read

# Build events and cleanup events use separate groups: a push must cancel a
# stale in-flight build, but must never cancel a cleanup run mid-delete. The
# publish job re-checks PR state before uploading to cover the reverse race.
concurrency:
  group: desktop-windows-preview-${{ github.event.pull_request.number }}-${{ contains(fromJSON('["closed", "unlabeled"]'), github.event.action) && 'cleanup' || 'build' }}
  # Only a run that builds cancels an in-flight build. Cleanup runs, unrelated
  # label events, and pushes made before the preview label was added skip the
  # build, so they queue behind it instead: a push followed quickly by adding
  # the label must not cancel the build the label started. Keep in sync with
  # the version job's condition.
  cancel-in-progress: >-
    ${{ github.event.action != 'closed' &&
    github.event.action != 'unlabeled' &&
    github.event.pull_request.head.repo.full_name == github.repository &&
    contains(github.event.pull_request.labels.*.name, 'preview:windows') &&
    (github.event.action != 'labeled' || github.event.label.name == 'preview:windows') }}

jobs:
  # The build jobs run PR code, so they get no secrets and a read-only token.
  # Publishing to the release happens in the publish job below, which never
  # checks out PR code.
  version:
    name: Set preview version
    if: >-
      github.event.action != 'closed' &&
      github.event.action != 'unlabeled' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'preview:windows') &&
      (github.event.action != 'labeled' || github.event.label.name == 'preview:windows')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          sparse-checkout: apps/desktop/package.json
          sparse-checkout-cone-mode: false

      - id: version
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          base_version="$(node -p "require('./apps/desktop/package.json').version")"
          echo "version=${base_version}-pr.${PR_NUMBER}.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

  bundle:
    name: Build JS bundle
    needs: version
    uses: ./.github/workflows/fork-js-bundle.yml
    with:
      ref: ${{ github.event.pull_request.head.sha }}
      version: ${{ needs.version.outputs.version }}

  # The release build workflow, so the preview bundles the WSL runtime too.
  build:
    name: Build Windows x64 preview
    needs: [version, bundle]
    uses: ./.github/workflows/fork-desktop-build.yml
    with:
      ref: ${{ github.event.pull_request.head.sha }}
      version: ${{ needs.version.outputs.version }}
      target: windows-x64
      retention_days: 7

  # Shares the rolling "desktop-preview" prerelease with the macOS preview.
  # Each workflow only touches its own file type there, so one platform's
  # rebuild or cleanup never removes the other's download. This job holds the
  # write token and only handles the artifact the build produced; it never
  # runs PR code.
  publish:
    name: Publish anonymous download
    needs: [version, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Download Windows installer
        uses: actions/download-artifact@v8
        with:
          name: desktop-win-x64
          path: release

      - id: upload
        name: Upload installer to the rolling preview release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          tag="desktop-preview"

          # True while the PR is open and still carries the preview label.
          preview_eligible() {
            [[ "$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
              --json state,labels \
              --jq '.state + " " + (.labels | map(.name) | contains(["preview:windows"]) | tostring)')" == "OPEN true" ]]
          }

          # The build ran for many minutes. If the PR closed or lost the label
          # meanwhile, cleanup already ran in its own concurrency group, so
          # publishing now would resurrect a deleted download.
          if ! preview_eligible; then
            echo "PR closed or preview label removed while building. Skipping publish."
            exit 0
          fi

          installer_path="$(find release -type f -name '*.exe' -print -quit)"
          if [[ -z "$installer_path" ]]; then
            echo "No installer found in the downloaded artifact." >&2
            exit 1
          fi

          # The filename comes out of the build, which runs PR code. Requiring
          # this PR's marker keeps a build from clobbering or deleting another
          # PR's asset, since those names carry a different -pr.N. marker.
          if [[ "$(basename "$installer_path")" != *"-pr.${PR_NUMBER}."* ]]; then
            echo "Installer name '$(basename "$installer_path")' does not carry this PR's -pr.${PR_NUMBER}. marker. Refusing to publish." >&2
            exit 1
          fi

          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # "|| true" tolerates a concurrent publish job creating the
            # release between the check and the create.
            gh release create "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$DEFAULT_BRANCH" \
              --prerelease \
              --title "Desktop preview builds" \
              --notes "Rolling unsigned desktop builds from pull requests with a preview label. Each download is removed when its pull request closes or loses the label. Install stable builds from the latest release instead." \
              || true
          fi

          # Keep one installer per PR: drop this PR's older builds first. The
          # trailing dot keeps -pr.12. from matching -pr.123. builds.
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' \
            | { grep -F -- "-pr.${PR_NUMBER}." || true; } \
            | { grep -E -- '\.exe$' || true; } \
            | while read -r asset; do
                gh release delete-asset "$tag" "$asset" --repo "$GITHUB_REPOSITORY" --yes \
                  || echo "Asset $asset was already removed by a concurrent run."
              done

          gh release upload "$tag" "$installer_path" --repo "$GITHUB_REPOSITORY" --clobber

          # Re-check after uploading. A cleanup run that started during the
          # upload listed assets before ours existed, so it cannot delete it.
          # Whichever writer acts last sees the final PR state; if the preview
          # became ineligible, delete what we just uploaded.
          if ! preview_eligible; then
            gh release delete-asset "$tag" "$(basename "$installer_path")" --repo "$GITHUB_REPOSITORY" --yes \
              || echo "Asset was already removed by a concurrent run."
            echo "PR closed or preview label removed during upload. Removed the download."
            exit 0
          fi

          echo "download_url=https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/$(basename "$installer_path")" >> "$GITHUB_OUTPUT"

      - name: Comment download link
        if: steps.upload.outputs.download_url != ''
        uses: actions/github-script@v9
        env:
          DOWNLOAD_URL: ${{ steps.upload.outputs.download_url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PREVIEW_VERSION: ${{ needs.version.outputs.version }}
        with:
          script: |
            const { data: pullRequest } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
            });
            if (
              pullRequest.head.sha !== process.env.HEAD_SHA ||
              pullRequest.state !== "open" ||
              !pullRequest.labels.some((label) => label.name === "preview:windows")
            ) {
              core.info("Skipping the outdated Windows preview comment.");
              return;
            }

            const marker = "<!-- desktop-windows-preview -->";
            const body = [
              marker,
              "### Windows preview",
              "",
              `[Download Windows x64 installer](${process.env.DOWNLOAD_URL})`,
              "",
              `Version: ${process.env.PREVIEW_VERSION}`,
              `Commit: ${process.env.HEAD_SHA.slice(0, 7)}`,
              "",
              "Unsigned build. If SmartScreen blocks the installer, choose **More info**, then **Run anyway**.",
              "",
              "No GitHub sign-in is needed. The download stays available until this PR closes or the preview label is removed.",
            ].join("\n");

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.body?.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body,
              });
            }

  # The way out: closing the PR or removing the label deletes its installer
  # from the rolling release and updates the PR comment to say so.
  cleanup:
    name: Remove preview download
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      ((github.event.action == 'closed' && contains(github.event.pull_request.labels.*.name, 'preview:windows')) ||
      (github.event.action == 'unlabeled' && github.event.label.name == 'preview:windows'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - id: delete
        name: Delete this PR's preview assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          tag="desktop-preview"

          # A stale cleanup must not delete a download that became valid
          # again. If the PR is open and labeled once more, the next publish
          # owns this PR's assets and replaces them itself.
          if [[ "$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --json state,labels \
            --jq '.state + " " + (.labels | map(.name) | contains(["preview:windows"]) | tostring)')" == "OPEN true" ]]; then
            echo "PR is open and labeled again. Skipping cleanup."
            echo "removed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "removed=true" >> "$GITHUB_OUTPUT"

          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "No preview release exists. Nothing to clean up."
            exit 0
          fi

          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' \
            | { grep -F -- "-pr.${PR_NUMBER}." || true; } \
            | { grep -E -- '\.exe$' || true; } \
            | while read -r asset; do
                gh release delete-asset "$tag" "$asset" --repo "$GITHUB_REPOSITORY" --yes \
                  || echo "Asset $asset was already removed by a concurrent run."
              done

      - name: Mark the preview comment as removed
        if: steps.delete.outputs.removed == 'true'
        uses: actions/github-script@v9
        with:
          script: |
            const marker = "<!-- desktop-windows-preview -->";
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.body?.includes(marker));
            if (!existing) {
              return;
            }

            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: existing.id,
              body: [
                marker,
                "### Windows preview",
                "",
                "The preview download was removed because this PR closed or the preview label was removed.",
              ].join("\n"),
            });
