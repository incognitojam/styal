  - id: slow-network-route-stability
    title: Keep slow networks from bouncing a connection between routes
    status: maintained
    prs: []
    invariants:
      - A route the client switched to from a better-route check, whose session then drops within five minutes, is skipped by better-route checks for five minutes, doubling on each repeat up to 30 minutes, and is tried last when reconnecting while it cools down.
      - A switched-to route whose session held for five minutes clears its cooldown history, so a later drop such as a server restart does not hold it back.
      - Once an attempted route fails transiently, routes that did not answer their reachability check are not given full attempts; the supervisor backs off and checks every route again. They are still tried when every attempted route was blocked or none was attempted.
      - A relay WebSocket that opened and later closed or stopped responding does not carry the DNS or firewall hint; a socket that never opened still does.
    rationale: On a train, a tailnet path through a distant DERP relay answers an occasional quick check but cannot hold a session. Upstream switched to it every few minutes and spent up to a minute per failed reconnect on routes that had not answered.
    implementation_paths:
      - packages/client-runtime/src/connection/driver.ts
      - packages/client-runtime/src/connection/supervisor.ts
      - packages/client-runtime/src/rpc/session.ts
    upstream_paths:
      - packages/client-runtime/src/connection/driver.ts
      - packages/client-runtime/src/connection/supervisor.ts
      - packages/client-runtime/src/rpc/session.ts
    tests:
      - packages/client-runtime/src/connection/supervisor.test.ts
      - packages/client-runtime/src/rpc/session.test.ts
    upstream:
      status: unassessed
      tracking: []
      retire_when: Upstream stops switching to a route that recently dropped after a switch, and stops giving full attempts to unanswered routes after a transient failure.

  - id: source-control-fork-remotes
    title: Configure fork remotes and default repositories
    status: maintained
    prs: [123]
    invariants:
      - Parent-remote wiring follows the successful clone transport, including HTTPS fallback with automatic protocol selection; background clones preserve explicit protocol requests.
      - Cloning a GitHub fork offers a default repository choice, keeps the fork as `origin`, and adds and fetches the parent as `upstream` without changing non-fork clone behavior, whether the clone blocks or runs in the background.
      - Adding an existing folder on web, desktop, or mobile asks for the default repository only when its remotes point at more than one distinct GitHub repository and no default is set, offers each repository once, and lets the user decide later without writing a default.
      - T3 Code and the GitHub CLI share the selected default through `remote.<name>.gh-resolved`, web and mobile allow that choice to be inspected, changed, or cleared after adding the project, and a change applies to the project's repository identity without waiting for the identity cache.
    rationale: Upstream has no default-repository choice and does not add a fork's parent remote. The fork asks when cloning a fork and when adding a checkout whose remotes name several GitHub repositories, and stores the answer where `gh repo set-default` does, so the app and agents running `gh` in the checkout pick the same repository. Two remotes for one repository, non-GitHub remotes, and an existing default have nothing to ask.
