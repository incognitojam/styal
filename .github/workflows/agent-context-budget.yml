name: Agent Context Budget

# Agent context is what styal sends into every user's agent session: the Claude system append, the
# Codex additional context, and the MCP tool list. This repository's AGENTS.md and docs are not part of it.
# Fails when a PR raises a value in agentContextBudget.json above its base branch's. AgentContextBudget.test.ts
# keeps that file equal to the measured context, so the context cannot grow by editing the file.
# To accept growth on purpose, a maintainer adds the agent-context-increase label.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: agent-context-budget-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  budget:
    name: Agent context budget
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      BASE_REF: ${{ github.base_ref }}
      BUDGET: apps/server/src/provider/agentContextBudget.json
      ALLOW_INCREASE: ${{ contains(github.event.pull_request.labels.*.name, 'agent-context-increase') }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          sparse-checkout: apps/server/src/provider/agentContextBudget.json
          sparse-checkout-cone-mode: false

      - name: Compare with the base branch
        run: |
          git fetch --quiet --depth=1 origin "refs/heads/$BASE_REF"
          if ! git cat-file -e "FETCH_HEAD:$BUDGET" 2>/dev/null; then
            echo "$BASE_REF has no agent context budget yet."
            exit 0
          fi
          git show "FETCH_HEAD:$BUDGET" > "$RUNNER_TEMP/base.json"
          grown=$(jq -r --slurpfile base "$RUNNER_TEMP/base.json" '
            to_entries[]
            | select($base[0][.key] != null and .value > $base[0][.key])
            | "\(.key): \($base[0][.key]) -> \(.value) (+\(.value - $base[0][.key]))"
          ' "$BUDGET")
          if [ -z "$grown" ]; then
            echo "Agent context is not larger than $BASE_REF."
            exit 0
          fi
          printf 'Agent context grew compared to %s:\n%s\n' "$BASE_REF" "$grown"
          if [ "$ALLOW_INCREASE" = "true" ]; then
            echo "Accepted by the agent-context-increase label."
            exit 0
          fi
          echo "::error file=$BUDGET::Agent context, the instructions and MCP tool list styal sends into every user's agent session, grew compared to $BASE_REF. Cut the added text and rerun the evals that cover it (evals/README.md), or report the growth and leave the agent-context-increase label to the maintainer."
          exit 1
