  - id: pull-request-required-checks
    title: Separate pull request checks and show merge readiness
    status: maintained
    prs: [138, 151, 159, 185, 209, 495, 984, 1088, 1089]
    invariants:
      - Pull request checks have a dedicated tab that distinguishes host-required checks from optional jobs and represents required checks that have not reported yet.
      - Check rows share one set of columns, so the Required badge, status and link mark line up whatever each row's status says or whether it has a link.
      - A watched pull request reports its required checks as passed only once each has finished green; a required check that has not reported yet holds the news back.
      - The summary and primary action lead with GitHub merge readiness, offering auto-merge when requirements block an otherwise mergeable pull request, including when its branch is behind the base, if GitHub permits it. Check health remains supporting context.
      - While GitHub has not computed merge readiness yet, pending or failing checks lead to auto-merge, as on hosts that report no readiness.
      - Merge now is offered beside auto-merge only when the host would accept it; a blocked pull request offers it only to a viewer GitHub lets bypass its rules.
      - Mobile applies the same rules for a pull request outside a stack, making Enable or Disable auto-merge the main button and listing merge methods only when the repository allows more than one.
      - When effective GitHub rules require a behind branch to be updated, the Checks tab explains that auto-merge will wait and offers the update methods the viewer may use; an unavailable policy read does not claim the update is optional.
      - Turning on auto-merge is offered to any viewer who may merge, and afterwards the server reads the pull request back as it does after a merge, because GitHub merges an already mergeable pull request at once; a resulting merge is published so linked threads settle.
