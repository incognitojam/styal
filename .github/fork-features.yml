  - id: settings-snapshot-telemetry
    title: Report server and device preference values to see which defaults people change
    status: maintained
    prs: [938, 1156]
    rationale: Maintainers decide which opinionated defaults to keep, change, or move into setup from how many installations change them.
    invariants:
      - Each server records one settings.snapshot event two minutes after startup and then daily, through the shared analytics identity, queue and telemetry opt-out, with settingsSnapshotUsageVersion marking reporting servers.
      - Every allowlisted key is sent on every report, at its default or not, as a boolean, enum literal, small integer or null. Paths, names, prefixes, instructions, model and instance ids, cost figures and record contents are never sent; record and free-text settings appear only as a count or a customized flag.
      - Every server setting is either reported or listed with a reason as deliberately left out, so new settings cannot be skipped silently.
      - Web and desktop clients report their device settings at most once a day through the primary environment, or the first paired environment on hosted web, as client.settings.snapshot with forkClientUsageVersion 7 or later. The day restarts only when a server accepts the report, and windows on one device share it. A window retries a report the server did not accept after a minute, doubling the wait after each failure up to an hour.
      - Clients send every reported setting, but a server accepts a snapshot from an older client that predates some settings and records it with those settings absent, never filled with a default.
      - The device report sends whether a manual project order is saved, never project keys, and every client setting is either reported or listed with a reason as deliberately left out.
      - Mobile reports its app preferences at most once a day through the first connected environment with forkClientUsageVersion 17 or later, as client.settings.snapshot with surface mobile, using the same accept-then-wait-a-day and retry schedule. Unset preferences are sent as the default the app applies; account ids, project keys, filters and microphone names are never sent, and every mobile preference is either reported or listed with a reason as deliberately left out. Servers record the mobile snapshot only from mobile clients and the web snapshot only from web and desktop.
