name: Remaining CI benchmark
'on':
  push:
    branches:
    - styal/remaining-ci-benchmark-65371a37
permissions:
  contents: read
jobs:
  server:
    name: Server shard ${{ matrix.shard }}/3
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard:
        - 1
    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        ref: ${{ github.sha }}
        sparse-checkout: '/*

          !/.repos/

          '
        sparse-checkout-cone-mode: false
    - name: Setup test dependencies
      uses: ./.github/actions/setup-deps
    - name: Test server
      run: vp run --filter ./apps/server test --fileParallelism --maxWorkers=3 --shard
        ${{ matrix.shard }}/3
