name: Intake landing hold

# Keeps fork pull requests from merging while an intake candidate runs Fork CI
# or waits for promotion, so main cannot move under it. The status this sets is
# one of main's required checks; auto-merge lands held pull requests once it
# turns green. Every run recomputes the hold from workflow runs, so a missed
# event is fixed by the next one or by dispatching this workflow.
on:
  pull_request_target:
    # Every base branch: the upper layers of a stack target another pull request's branch.
    types: [opened, reopened, synchronize]
  workflow_run:
    workflows: ["Fork CI", "Promote upstream intake"]
    types: [requested, completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # A pull request event only dispatches the hold run. Jobs from pull_request_target
  # show as checks on the pull request, and the queue below cancels runs a newer one
  # replaces, which agents watching the pull request would report as a failed check.
  # Until the dispatched run sets its status, the pull request cannot merge.
  request:
    name: Request intake landing hold
    if: github.repository == 'incognitojam/styal' && github.event_name == 'pull_request_target'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Dispatch the hold run
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: gh workflow run intake-landing-hold.yml --repo "$GITHUB_REPOSITORY" --ref "$DEFAULT_BRANCH"

  hold:
    name: Set intake landing hold
    if: >-
      github.repository == 'incognitojam/styal' &&
      github.event_name != 'pull_request_target' &&
      (github.event_name != 'workflow_run' ||
        github.event.workflow_run.path == '.github/workflows/promote-upstream-intake.yml' ||
        startsWith(github.event.workflow_run.head_branch, 'intake/'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # One queue for every event, at job level so skipped runs never take a slot. Each run
    # recomputes every pull request, so a newer run may replace one still waiting.
    concurrency:
      group: intake-landing-hold
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
      pull-requests: read
      statuses: write
    outputs:
      recheck_in_seconds: ${{ steps.statuses.outputs.recheck_in_seconds }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: |
            /scripts/upstream/
          sparse-checkout-cone-mode: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - id: statuses
        name: Set statuses
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: node scripts/upstream/landing-hold.ts | tee -a "$GITHUB_STEP_SUMMARY"

  # A hold that waits out a grace period ends with no event to recompute it, so
  # dispatch this workflow when it ends. A newer hold run replaces a waiting recheck.
  recheck:
    name: Recheck when the grace period ends
    needs: hold
    if: needs.hold.outputs.recheck_in_seconds != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: intake-landing-hold-recheck
      cancel-in-progress: true
    permissions:
      actions: write
    steps:
      - name: Wait, then recompute the hold
        env:
          GH_TOKEN: ${{ github.token }}
          RECHECK_IN_SECONDS: ${{ needs.hold.outputs.recheck_in_seconds }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          sleep "$((RECHECK_IN_SECONDS + 5))"
          gh workflow run intake-landing-hold.yml --repo "$GITHUB_REPOSITORY" --ref "$DEFAULT_BRANCH"
