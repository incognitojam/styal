<!doctype html>
<html>
  <head>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Browser viewport calibration</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      body {
        background: #e2e8f0;
        font: 20px system-ui;
      }
      .corner {
        position: fixed;
        width: 20%;
        height: 20%;
      }
      #tl {
        top: 0;
        left: 0;
        background: #e02040;
      }
      #tr {
        top: 0;
        right: 0;
        background: #20b060;
      }
      #bl {
        bottom: 0;
        left: 0;
        background: #3050e0;
      }
      #br {
        bottom: 0;
        right: 0;
        background: #e0b020;
      }
      main {
        position: fixed;
        inset: 25%;
        display: grid;
        place-content: center;
        text-align: center;
      }
      button {
        font: inherit;
        padding: 12px;
      }
    </style>
  </head>
  <body>
    <div class="corner" id="tl"></div>
    <div class="corner" id="tr"></div>
    <div class="corner" id="bl"></div>
    <div class="corner" id="br"></div>
    <main>
      <p>Browser viewport calibration</p>
      <button>Test input</button>
    </main>
    <script>
      window.clicks = [];
      document.querySelector("button").addEventListener("click", (event) => {
        window.clicks.push({ x: event.clientX, y: event.clientY });
      });
    </script>
  </body>
</html>
