name: Clean superseded dependency caches

on:
  workflow_run:
    workflows:
      - Fork CI
      - Fork macOS
      - Fork E2E (network)
      - Fork CLI Build
      - Fork CLI Archives
      - Fork Desktop Build
      - Fork JS Bundle
      - Fork Nightly
      - Mobile Android Build
      - Mobile iOS Build
    types: [completed]
    branches: [main]

permissions: {}

concurrency:
  group: dependency-cache-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      # Fetch main, never the triggering run's checkout, and without the token.
      # actions/checkout's credential cleanup runs `git submodule foreach`,
      # which fails on a gitlink under .repos/ that has no .gitmodules entry,
      # even when sparse checkout excludes it. The hashed files are outside it.
      - name: Fetch main
        run: |
          git init -q .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git fetch -q --depth 1 --no-tags origin main
          git checkout -q FETCH_HEAD
      - name: Resolve dependency hash
        id: dependency
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync } from 'node:fs';
          import { dependencyHash } from './.github/actions/setup-deps/dependency-hash.mjs';
          appendFileSync(process.env.GITHUB_OUTPUT, `hash=${dependencyHash()}\n`);
          JS
      - name: Delete superseded main dependency caches
        continue-on-error: true
        env:
          CURRENT_DEPENDENCY_HASH: ${{ steps.dependency.outputs.hash }}
          CURRENT_PNPM_HASH: ${{ hashFiles('pnpm-lock.yaml') }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          gh api --paginate --slurp "repos/$GH_REPO/actions/caches?ref=refs/heads/main&per_page=100" > caches.json
          jq -c --arg current "$CURRENT_DEPENDENCY_HASH" --arg current_pnpm "$CURRENT_PNPM_HASH" -f .github/scripts/superseded-dependency-caches.jq caches.json > victims.jsonl
          while IFS= read -r cache; do
            id=$(jq -r '.id' <<< "$cache")
            echo "Deleting superseded cache: $cache"
            gh api --method DELETE "repos/$GH_REPO/actions/caches/$id" || echo "::warning::Could not delete cache $id; continuing"
          done < victims.jsonl
