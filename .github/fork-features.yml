  - id: provider-server-settings-isolation
    title: Keep the server's own settings out of agent processes
    status: maintained
    prs: [365, 1094]
    invariants:
      - Agent processes and provider status probes do not inherit the server's settings, service launcher variables, or dev web build variables, so a styal server started by an agent does not use the running server's port, state directory, or Tailscale Serve mapping.
      - A provider process given a complete environment is spawned without re-extending it from the server's own environment.
      - Provider processes still receive per-session workspace ports, the provider instance's configured environment, and the Codex launch args override.
      - Terminals and provider processes use the same rule for which inherited variables are removed.
      - Provider update commands and the package-manager probes behind update checks are not covered; they still run with the server's full environment.
    implementation_paths:
      - apps/server/src/provider/CodexProvider.ts
      - apps/server/src/terminal/Manager.ts
      - packages/provider-acp-registry/src/server/AcpRegistrySupport.ts
      - packages/provider-acp/src/server/AcpSessionRuntime.ts
