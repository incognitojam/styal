  - id: fork-distribution-identity
    title: Keep fork builds distinctly identifiable
    status: maintained
    prs:
      [
        3,
        27,
        29,
        49,
        56,
        235,
        242,
        243,
        244,
        245,
        281,
        287,
        302,
        335,
        344,
        378,
        728,
        741,
        818,
        1155,
      ]
    invariants:
      - The default static worktree branch prefix is styal across clients; explicit environment and project prefixes, including an empty prefix, are preserved.
      - Packaged builds ship as styal with their own application identifier, URL scheme, product name, and About-panel identity instead of presenting as upstream T3 Code.
      - Scheme-only mobile wake links for production, development, and preview styal builds preserve the current route and unfinished authentication; path-bearing links, including auth callbacks and pairing links, are still passed to the app's link handling.
      - Electron's application name is a stable identity slug rather than a display string, so OS credential storage keys stay in the same namespace as the user-data directory they protect.
      - styal owns its base directory, user-data directory, and URL scheme, so it installs and runs alongside upstream T3 Code without sharing state; SSH device hosts keep their helpers under ~/.styal/device.
      - Linux desktop releases include AppImage and self-updating Debian packages with styal executable, protocol, and package metadata, collected by the fork desktop build workflow.
      - Windows fork packages use styal-specific package and uninstall identities, never block on a running T3 Code process, and remain visibly distinguishable across stable, nightly, and pull request preview builds.
      - Pull request preview builds install beside stable and nightly with their own app id, URL scheme, credential namespace, development artwork, and styal home, which the desktop passes to its local server and, as `~/.styal/preview`, to its WSL server, so testing a preview never opens or migrates the stable install's database; preview installers leave the stable install's legacy Windows registrations alone.
      - A `preview:mac` label on a pull request from a branch in this repository builds an unsigned Apple Silicon preview on every push without signing credentials; only releases are signed, through the fork's own desktop build workflow.
      - A `preview:windows` label on a pull request from a branch in this repository builds an unsigned Windows x64 preview, with the WSL runtime, through the fork's release desktop build workflow without secrets; it shares the `desktop-preview` prerelease with the macOS preview, and each preview workflow only replaces or deletes its own file type there.
      - A `preview:android` label on a pull request from a branch in this repository builds an arm64 `styal Preview` APK on every push with OTA updates disabled; the job that runs PR code holds no secrets, and a separate job re-signs the APK with a dedicated preview key and publishes it to the `mobile-preview` prerelease, whose tag stays outside the `android-` namespace that production releases and the in-app updater read.
      - Installed dependency generations hash Git index entries identically across runner operating systems. Main build completion prunes superseded installed dependency generations in host and install-filter slots and vite-plus pnpm store generations in OS and architecture slots only when each slot contains main's current hash for that cache family, preserving every current entry and other cache families without granting build jobs cache deletion permissions.
      - Android preview and production CI reuse input-validated Gradle task outputs, C++ compilations, and Metro transforms across clean builds; preview builds can populate output caches independently of main's dependency cache, and JavaScript-only pushes reuse the same snapshot. Main builds an unpublished preview when compiled-output or Metro cache inputs change, so a pull request's first preview restores warm outputs; those main builds never upload or publish an APK. Preview builds give Gradle a fixed version and let aapt2 write the real version code and name into the APK manifest, so a new preview version alone does not rerun R8.
      - Standalone CLI archives carry the styal executable, release artwork, license, and native resource monitor, and run with isolated styal state without requiring a host Node installation.
      - npm, service updates, SSH, and WSL select styal release archives and isolated styal homes; protocol 4 prevents older npm launchers from switching into the executable layout remotely.
      - The styal executables are hosted only as GitHub Release archives. npm carries only the dependency-free `@styal/cli` launcher, which downloads its exact version's archive from the styal GitHub Release into `<styal home>/runtime/styal-executable/versions/<version>`, runs it only after the download matches the release's SHA256SUMS, and keeps the legacy `dist/bin.mjs` entry for older service updaters.
      - The GitHub Release with desktop artifacts, CLI archives, and SHA256SUMS publishes after build verification without waiting for npm; the `@styal/cli` launcher publishes to its channel dist-tag only after that release succeeded and its SHA256SUMS is downloadable, so an npm failure never blocks or rolls back the release.
      - npm publication waits for the launcher to become readable with the uploaded integrity, and a retry accepts an existing version only when its registry integrity matches the exact tarball being released and its channel tag points to that version.
      - Stale release retries are rejected before npm publication or integrity acceptance when the launcher's channel tag is newer; nightly source promotion cannot move the branch backward.
      - Mobile environment checks and CLI channel updates read the compact @styal/cli npm dist-tags endpoint once, reject missing, malformed, or mismatched channel versions without fallback, offer a version only after its GitHub release checksums are downloadable, and retain downgrade protection; publication and runtime discovery share the release version parser.
      - Provider compatibility policies in the model manifest select styal release versions rather than T3 Code's, because every installed build fetches the manifest from fork main. Releases up to styal 0.1.0 keep the OpenCode 1 policy their V1 orchestrator needs, and the OpenCode 2 and Pi policies start at styal 0.1.1.
      - Successful Fork CI pushes to main request a nightly of the newest eligible green commit; rejected CI completions cannot replace a pending publisher, manual requests retain the same release gates, and there is no scheduled trigger.
      - Stable and nightly notes omit changes outside shipped code and version-only manifest edits, support explicit Release-Note skip/include commit trailers, and retain a full comparison link and omitted count; note visibility never changes release eligibility.
      - Fork release intermediate artifacts expire after three days; manual desktop deliverables remain downloadable for 90 days, and published GitHub release assets keep their own lifetimes.
      - CLI help and triage copy identify styal, and a bare CLI invocation shows command guidance while explicit `start` and `serve` commands own server startup.
      - The web and desktop setup wizard and sidebar share the outlined Zilla Slab styal wordmark.
      - Web, desktop, and mobile product tool icons and created-thread work-log rows use the canonical monochrome styal mark in their icon color, including historical calls using the `t3-code` namespace.
      - Android agent activity cards and status bar chips use the styal cotton reel, and shared client errors, accessibility labels, clipboard labels, and terminal previews identify styal.
      - Subscription usage widgets on iOS and Android name styal when they ask the user to open the app.
      - Server, client, and agent-facing messages about the relay name styal Link rather than T3 Connect, and messages about this app name styal; messages about importing from an upstream T3 Code install keep that name. Fork Lint and intake verification fail on T3 Code, T3 Connect, t3.codes or T3 used as a name in application and package strings outside tests and the listed exceptions.
      - Canonical brand asset paths and icon geometry stay shared across desktop, mobile configuration, web packaging, and export tooling so production and nightly artwork cannot silently diverge.
      - macOS desktop packages carry the channel's Icon Composer icon as a compiled asset catalog, so macOS 26 and later draw it without the legacy grey plate, and keep the safe-area `.icns` for earlier macOS releases.
      - The macOS installer backgrounds and the Dev and Nightly sidebar and send-button artwork use styal's channel grounds and sewing motifs (pinked linen, cutting mat, starry horizon) rather than upstream's T3 Code installer and stage artwork.
      - Linux desktop entries, SnapShot D-Bus names, the GNOME Shell extension, and the KDE and Hyprland capture helpers use styal identities (`build.styal.Styal`, `snap-shot@styal.build`, `styal-*-snap-shot`) so they cannot collide with an upstream T3 Code install.
      - Mobile production builds reconcile native fingerprints and committed versions automatically for both platforms, retaining nightly artwork and OTA-blocked reporting; upstream's separate fixed-version TestFlight release train does not replace the fork's version scheme.
      - Web and desktop mobile settings link to styal Android APK releases using the exact phrase "styal for Android" to exclude other releases that merely mention Android, and describe invite-only iOS TestFlight access, without directing users to upstream store apps.
      - Mobile production and preview profiles retain styal identity and fork Expo configuration; Android distribution uses installable APKs without store submission, while iOS submits to TestFlight.
      - Production Android APKs are built on GitHub Actions rather than EAS Build, signed with the EAS-managed production keystore, numbered after the newest `android-*` release, and released only when their embedded runtime version equals the fingerprint they were built for; the newest release stands for the latest Android build when deciding between an OTA update and a new build.
      - Production iOS apps are built on GitHub Actions with `eas build --local`, using the EAS-managed signing credentials and build number, submitted to TestFlight only after their runtime version, update channel, extension build numbers and signing team are checked, and recorded as annotated `ios-<version>-<build>` tags carrying the runtime version, which Mobile EAS Production reads alongside EAS's records of earlier builds.
      - Each production Android APK is published as a GitHub release tagged `android-<version>-<versionCode>`, created without claiming Latest from a stable `v` release, and only when its signing certificate matches the pinned production key; release notes contain installation guidance and APK checksums are attached as `SHA256SUMS`.
      - Production Android installs offer the newest GitHub release once per release, and keep its download directly below Version in About styal, only when its runtime version differs from the installed binary's, because over-the-air updates cannot reach that install.
      - Android APK updates download inside styal with progress, cancellation and retry; incomplete APKs are discarded, complete APKs remain available after installer dismissal, and installs require Android's source permission and system confirmation. Downloads finishing in the background wait for an explicit install action.
      - Mobile About styal identifies the installed binary by its native version and build number on Android and iOS, retaining non-production variant labels.
      - Settings that exist only in styal show the monochrome styal mark beside their title, limited to ledger features that are still maintained or under review; fork refinements of upstream settings stay unmarked.
      - The desktop app's CLI launcher and its Settings install are named `styal`, so they never take over or remove an upstream `t3` command.
      - styal releases only through its `fork-*` workflows. Upstream's `release.yml` and `release-desktop.yml`, and the scripts only they ran, stay deleted; intake removes upstream edits to them as fork deletions.
    implementation_paths:
      - .github/actions/cache-android-build/action.yml
      - .github/actions/setup-deps/dependency-hash.mjs
      - .github/scripts/publish-android-release.sh
      - .github/scripts/release-changelog.sh
