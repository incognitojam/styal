  - id: fork-feature-usage
    title: Measure anonymous adoption of maintained features
    status: maintained
    prs: [840, 859]
    rationale: Maintainers need observed feature adoption to evaluate the cost of retaining fork behavior.
    invariants:
      - Allowlisted client interactions share one reporting method, a negotiated vocabulary version, and an event-local instrumentation version, with socket-scoped attribution and the paired environment's telemetry opt-out; diff-order selections, opened time explanations, and web refresh requests are counted separately from visible update-notice exposure, with no content or identifiers.
      - Agent browser tools emit one structural feature.used event per public operation, including failures and cancellation, with action, outcome, and duration but no operation arguments or results.
      - Internal metadata reads do not inflate agent usage, and telemetry failures never change the operation's result.
      - Device panel operations and public agent device tools record bounded usage and outcomes without names, device identifiers, arguments, or images; discovery is distinct from adoption and environment forwarding is not counted again as a manual action.
      - Each available provider instance is reported after startup and daily with its driver, default or custom instance, install and health state, plain version, installer kind, automatic update eligibility, newer verified version, skips held back by threads using its CLI, and whether the provider's own updater is still active (true, false, or null when unknown); each started manual or background provider update, and each manual update refused by the install lock, records one result with versions, whether it was a takeover reinstall, outcome, a bounded failure category, and duration. Instance names, paths, commands, installer output, and error messages are never sent.
      - Events carry separate instrumentation versions and explicit build context; test and CI collection defaults off while the shared telemetry opt-out still disables all feature events.
      - Upstream's per-request feature counts record `thread.stop` as `run.interrupt`, so Stop stays counted when clients stop a thread without naming its run.
      - Upstream's per-request feature counts leave out actions the fork already reports under its own events (Device panel opens, workflow approvals, and thread settles and archives), and upstream's per-call `mcp.tool.invoked` events leave out the browser, device, hardware, and workflow run watch tools the fork reports as `feature.used`, so one action is reported once.
