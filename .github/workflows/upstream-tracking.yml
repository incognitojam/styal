name: Upstream tracking

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      since_days:
        description: "Upstream merge window for catch-up or recovery"
        required: false
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: upstream-tracking
  cancel-in-progress: false

jobs:
  track:
    name: Reconcile upstream intake
    if: github.repository == 'incognitojam/styal'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Fetch upstream
        run: git fetch --no-tags https://github.com/pingdotgg/t3code.git main:refs/remotes/upstream/main

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json

      - name: Reconcile tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          SINCE_DAYS: ${{ inputs.since_days || vars.UPSTREAM_TRACKING_WINDOW_DAYS || '14' }}
          UPSTREAM_TRACKING_ISSUE: ${{ vars.UPSTREAM_TRACKING_ISSUE }}
        run: |
          if [[ -z "$UPSTREAM_TRACKING_ISSUE" ]]; then
            echo "::error::Set the UPSTREAM_TRACKING_ISSUE repository variable to the tracking issue number."
            exit 1
          fi
          node scripts/upstream-tracking-issue.ts \
            --issue "$UPSTREAM_TRACKING_ISSUE" \
            --repo "$GITHUB_REPOSITORY" \
            --since-days "$SINCE_DAYS"
