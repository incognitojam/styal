      - Large review conversations remain pageable up to the maintained safety ceiling instead of being silently truncated to the cheap initial query.
    implementation_paths:
      - apps/server/src/pullRequest/GitHubPullRequestCli.ts
      - apps/server/src/pullRequest/gitHubPullRequestJson.ts
    upstream_paths:
      - apps/server/src/pullRequest/GitHubPullRequestCli.ts
