  - id: styal-project-file
    title: Read project configuration and shared actions from styal.json
    status: maintained
    prs: [1128]
    rationale: styal owns its checked-in project file so its schema can drop T3 Code fields the fork removed and add stable action ids, while repositories that only have a t3.json keep their settings.
    invariants:
      - styal.json at the project root is the project file; a t3.json is read only when there is no styal.json, including when styal.json is invalid.
      - A t3.json contributes its settings and icon but never runs or lists its scripts; they are only offered for import or migration.
      - File-backed settings resolve project override, environment setting, project file, then built-in, and report the file they came from.
      - Every styal.json action has an id; missing ids derive from the name and a later duplicate of an explicit id is dropped.
      - styal.json actions are read live from the registered project root, never a thread worktree, and listed after saved actions in every client's actions menu, shortcuts and project settings.
      - A saved action with a styal.json action's id overrides it; removing the override restores the file's action and keeps its shortcut, and a file-only action cannot be deleted in styal.
      - styal.json actions never run on worktree creation or settle until the user approves their exact command; any change to the command, or a newly declared role, voids the approval until approved again.
      - Approval stores the command the server reads from the project root, never one a client sends, and only user clients with settings access can approve or revoke; agent tools cannot.
      - Approvals are keyed by the repository (a fork's own remote first) plus the project's path inside it, falling back to the project without a known repository.
      - An unapproved automatic file action leaves a waiting work-log row that offers review, with no running indicator; approving from it runs the action in that worktree.
      - The approval review warns that it covers the command, not the files it runs, naming those files or package.json script when it can.
      - Running an action reports only whether it was saved, from styal.json, or an override.
      - The JSON schema that styal.json's $schema names is built from the contract into the hosted web app; https://styal.build/schema/* redirects to it.
      - Writing styal.json from a legacy t3.json carries its settings over and turns its scripts into actions with derived ids; the t3.json is left for the user to delete.
      - With several checkouts selected, project settings list each checkout's actions under its own environment row, from its saved list and its own styal.json, instead of hiding them; edits, approvals and styal.json writes in a group apply to that checkout only, and adding from the section header adds to every checkout.
