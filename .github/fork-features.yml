  - id: device-environment-hosts
    title: Share local devices between connected environments
    status: maintained
    prs: [746, 805, 1171]
    invariants:
      - New remote device setup in settings uses environment sharing. Web and desktop hide SSH host configuration unless their connected environment has saved hosts, which remain editable and removable in a collapsed section. Editing or removing saved hosts only changes matching entries on connected environments; settings do not offer adding SSH hosts.
      - Web, desktop, and mobile clients with settings:write on both environments can authorize an already connected environment as a device host without SSH configuration; devices:operate stays in the legacy wire vocabulary for older clients.
      - Device-only credentials are stored in the source server's secret store and remain usable after client disconnects or server restarts.
      - Peer access is limited to local devices and expires. Removing a host revokes access when the target is reachable; offline removal reports how to revoke the remaining grant. Ordinary client credentials cannot use peer endpoints.
      - Thread and driver sessions are distinct across environments, and agents see other environments' device reservations.
      - Agents get a separate credential that reaches only agent-device's remote routes, cannot issue peer commands, and stops working when agent access is turned off on either environment or the grant is revoked.
      - Requests to a connected environment do not hold the local device lifecycle lock, so an unreachable environment cannot block local devices.
      - Settings show one sharing switch per pair on the device environment, without an address field. Web and mobile send their own connection address, the LAN and tailnet addresses the device environment's server reports in `directEndpoints`, and a known styal Link address. For the desktop app's own server, web also sends the Network tab's default address before the reported ones, which only sets order, and every usable advertised desktop address after them. The agent server verifies both environment identities and stores the candidates with its device-only grant; legacy single-address shares remain readable.
      - When the selected address stops answering, the next request selects another saved address after checking both identities. Reads and cleanup retry once; other commands report the failure and are never replayed. New streams use the selected address; a running agent picks it up when agent access next starts.
      - Authenticated cleanup remains available when device access is disabled, and connected agent environments retain removal controls for offline or removed device environments.
      - Quit, restart, and update confirmations on the device environment count other environments with a device command or agent request in progress, or that used a device they still hold within five minutes. An idle shared session or a person only viewing a shared device does not ask for confirmation.
