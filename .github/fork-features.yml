  - id: arbitrary-file-attachments
    title: Attach arbitrary files to agent messages
    status: review-needed
    prs: [228, 391]
    invariants:
      - Web and mobile can attach generic files while supported images retain native provider handling, and every provider receives a safe persisted local path with MIME type and size.
      - Attachment count and aggregate-byte limits are enforced atomically, generic files render in message history, and legacy image attachments remain readable.
      - Web keeps send unavailable while attachment uploads are pending, exposes the recovery reason from the disabled send action, and retries failed image or generic-file uploads when sending.
      - Mobile retains local attachment bytes through draft, outbox, preview, upload, and signed-out account ownership; failed storage hydration or persistence must not authorize cleanup.
      - Dismissing an incoming-share task picker removes its durable inbox entry and releases attachments only after checking ownership by other inbox items, composer drafts, outbox messages, and previews.
      - The incoming-share picker offers recent threads as well as projects; choosing a thread merges the share into that thread's composer draft before consuming the inbox entry, without sending.
      - Web file drafts persist environment-scoped upload references; legacy local file bytes remain until a replacement reference is durable. Mobile drafts and queued messages retain owned file copies until delivery or removal.
      - Web and desktop stored HEIC images use the shared decoding fallback in file previews, queued messages, answered questions, and image attachment chips.
