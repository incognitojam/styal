  - id: workspace-thread-organization
    title: Default new threads to isolated worktrees
    status: maintained
    prs: [199, 271]
    invariants:
      - New-thread workspace mode resolves the project override, environment setting, and repository t3.json before the built-in worktree default in PROJECT_FILE_BACKED_SETTINGS.defaultThreadEnvMode.builtIn.
      - Web and mobile use the built-in worktree default only when the project is a Git repository with a commit; non-repository projects and repositories without a commit run in the current checkout while retaining the worktree default for after the first commit.
      - An explicit workspace selection takes precedence over the default; the server rejects an unresolvable requested worktree base with an actionable error instead of silently running in the current checkout.
    rationale: The decision recorded on 7 October 2026 makes worktree, when the project is a Git repository with a commit, and local otherwise the built-in last step of the settings order. Upstream still uses local at this tier as of a6ec88f7a716fc421bd22c2484881c44110f9375. Choosing New worktree means the agent works apart from the user's checkout, so the server refuses an unresolvable requested base rather than letting the agent edit the user's current branch unexpectedly.
