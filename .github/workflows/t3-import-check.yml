name: T3 Code import check

# Generates a data directory with upstream T3 Code's current server and imports
# it with styal, so a T3 Code release that styal cannot import shows up before
# users try it. See docs/operations/upstream-tracking.md.

on:
  schedule:
    - cron: "43 5 * * *"
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: Upstream branch, tag, or commit to generate from
        required: false
        default: main

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: t3-import-check
  cancel-in-progress: true

jobs:
  check:
    name: T3 Code import check
    if: github.repository == 'incognitojam/styal'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      failure_summary: ${{ steps.failure.outputs.summary }}
      upstream_sha: ${{ steps.upstream.outputs.sha }}
    env:
      UPSTREAM_REF: ${{ inputs.upstream_ref || 'main' }}
    steps:
      - name: Set paths
        id: paths
        run: |
          {
            echo "UPSTREAM_DIR=$RUNNER_TEMP/t3code"
            echo "FIXTURE_DIR=$RUNNER_TEMP/t3-import-fixture"
            echo "FIXTURE_ROOT=$RUNNER_TEMP/t3-import-root"
          } >> "$GITHUB_ENV"

      - name: Checkout
        id: checkout
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        id: setup
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Check out upstream T3 Code
        id: upstream
        run: |
          git init --quiet "$UPSTREAM_DIR"
          git -C "$UPSTREAM_DIR" fetch --quiet --depth 1 --no-tags https://github.com/pingdotgg/t3code.git "$UPSTREAM_REF"
          git -C "$UPSTREAM_DIR" checkout --quiet --detach FETCH_HEAD
          sha=$(git -C "$UPSTREAM_DIR" rev-parse HEAD)
          echo "UPSTREAM_SHA=$sha" >> "$GITHUB_ENV"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Install upstream dependencies
        id: install
        working-directory: ${{ env.UPSTREAM_DIR }}
        run: vp install 2>&1 | tee "$RUNNER_TEMP/check-install.log"

      - name: Generate T3 Code data
        id: generate
        run: |
          node apps/server/scripts/generate-t3-import-fixture.ts \
          --server "$UPSTREAM_DIR" \
          --out "$FIXTURE_DIR" \
          --root "$FIXTURE_ROOT" 2>&1 | tee "$RUNNER_TEMP/check-generate.log"

      - name: Import into styal
        id: import
        working-directory: apps/server
        env:
          STYAL_T3_IMPORT_FIXTURE: ${{ env.FIXTURE_DIR }}
        run: vp test run src/dataImport/LegacyImport.fixture.test.ts 2>&1 | tee "$RUNNER_TEMP/check-import.log"

      - name: Capture failure summary
        id: failure
        if: failure()
        env:
          CHECK_STEPS: ${{ toJSON(steps) }}
          CHECK_STEP_NAMES: >-
            {
              "paths": "Set paths",
              "checkout": "Checkout",
              "setup": "Setup Vite+",
              "upstream": "Check out upstream T3 Code",
              "install": "Install upstream dependencies",
              "generate": "Generate T3 Code data",
              "import": "Import into styal"
            }
        run: node .github/actions/notify-scheduled-check/summarize.mjs

      - name: Save failure summary for the next scheduled run
        if: failure() && steps.failure.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: scheduled-check-summary
          path: ${{ runner.temp }}/scheduled-check-summary/summary.txt
          retention-days: 90

      - name: Summarize
        if: always()
        run: |
          {
            echo "## T3 Code import check"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Upstream ref | \`$UPSTREAM_REF\` |"
            echo "| Upstream commit | \`${UPSTREAM_SHA:-not fetched}\` |"
            echo "| Result | ${{ job.status }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload generated data
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: t3-import-check-${{ github.run_id }}
          path: |
            ${{ env.FIXTURE_DIR }}
            ${{ env.FIXTURE_ROOT }}/server.log
          if-no-files-found: ignore
          retention-days: 14

  notify:
    name: Notify Discord when the result changes
    needs: check
    # Manual dispatches are watched by whoever started them.
    if: >-
      ${{
        always() &&
        github.event_name == 'schedule' &&
        (needs.check.result == 'success' || needs.check.result == 'failure')
      }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/actions/notify-scheduled-check
      - uses: ./.github/actions/notify-scheduled-check
        with:
          workflow: t3-import-check.yml
          check-job: T3 Code import check
          result: ${{ needs.check.result }}
          failure-summary: ${{ needs.check.outputs.failure_summary }}
          failure-title: T3 Code import check failed
          recovery-title: T3 Code import check passes again
          failure-message: Data generated by upstream T3 Code no longer imports into styal. The run has the generated data and server log.
          recovery-message: Data generated by upstream T3 Code imports into styal again.
          context: >-
            Upstream commit: `${{ needs.check.outputs.upstream_sha || 'unknown' }}`
          webhook-url: ${{ secrets.DISCORD_WEBHOOK_CI }}
        env:
          GH_TOKEN: ${{ github.token }}
