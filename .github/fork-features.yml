  - id: physical-android-device-hold
    title: Keep physical Android phones awake, and optionally dark, while a thread holds them
    status: maintained
    prs: [1130]
    invariants:
      - While device support is on, every local physical Android device with at least one styal device session (opened from the Device panel or by an agent; closing a panel tab does not end it) is held by a control-only scrcpy server with `stay_awake` set, so it does not sleep. With `keepPhysicalAndroidScreensOff`, the server also powers the display off. Mirroring and input continue either way.
      - When the device has no session left, or device support turns off, the scrcpy server exits and scrcpy's cleanup restores the previous stay-awake value and turns the display back on. The same cleanup runs if styal exits, because the control socket closes. Changing `keepPhysicalAndroidScreensOff` restarts the hold with the new option.
      - A hold that ends while the device is still held, such as on a replug, is retried every 15 seconds. Emulators, SSH hosts, and connected-environment devices are never held; a shared device is held by the environment that owns it.
      - The scrcpy-server jar and its version come from the installed device hub, so no second copy is downloaded.
      - "`keepPhysicalAndroidScreensOff` defaults to true; web and mobile settings edit it per environment. Keeping held phones awake has no setting."
    rationale: A held phone that sleeps streams a black screen and ignores input, and a phone lit for as long as an agent holds it wears the screen and battery. expo-device-hub mirrors physical devices with scrcpy but never asks them to stay awake or uses scrcpy's display power control, and it is installed from npm at runtime, so styal runs its own control-only scrcpy session beside the hub's instead of patching it.
    implementation_paths:
      - apps/mobile/src/features/settings/SettingsDevicesRouteScreen.tsx
      - apps/server/src/device/PhysicalAndroidHold.ts
      - apps/web/src/components/settings/PhysicalScreenOffSetting.tsx
    upstream_paths:
      - apps/server/src/device/DeviceHost.ts
      - apps/server/src/device/DeviceService.ts
      - apps/server/src/device/LocalDeviceHost.ts
      - apps/web/src/components/settings/IntegrationsSettings.tsx
      - packages/contracts/src/settings.ts
    tests:
      - apps/server/src/device/PhysicalAndroidHold.test.ts
    upstream:
      status: unassessed
      tracking: []
      retire_when: Upstream or expo-device-hub keeps held physical Android devices awake and can turn their displays off while mirroring them.

  - id: pinned-thread-auto-settlement
    title: Keep pinned threads active until unpinned or manually settled
    status: retiring
    prs: [719]
    invariants:
      - Sidebar pins block automatic settlement from inactivity and merged or closed pull requests, including a pin racing an in-flight settlement lookup.
      - Unpinning immediately queues a settlement check for that thread without resetting its activity timestamps; pending work, explicit Un-settle, and per-thread auto-settle opt-outs still prevent settlement.
      - Pinning settled work clears settlement without creating a separate keep-active override, while an existing explicit Un-settle override is preserved.
      - Manual settlement still removes the pin, and web, desktop, and mobile share the same server behavior and optimistic pin state.
    rationale: Upstream Orchestration V2 protects pinned threads. Keep only the fork refinements that immediately check settlement after unpinning and avoid creating a permanent keep-active override when pinning settled work; retire the V1 policy, decider, and reactor implementation.
    implementation_paths:
      - apps/server/src/orchestration-v2/Orchestrator.ts
      - apps/server/src/orchestration-v2/ThreadSettlementService.ts
      - packages/client-runtime/src/state/threadCommands.ts
    upstream_paths:
      - apps/server/src/orchestration-v2/Orchestrator.ts
      - apps/server/src/orchestration-v2/ThreadSettlementService.ts
      - packages/client-runtime/src/state/threadCommands.ts
    tests:
      - apps/server/src/orchestration-v2/Orchestrator.control-reads.test.ts
      - apps/server/src/orchestration-v2/ThreadSettlementService.test.ts
      - packages/client-runtime/src/state/threadCommands.test.ts
    upstream:
      status: partial
      tracking:
        - https://github.com/pingdotgg/t3code/pull/2829
      retire_when: Take upstream's pinned-thread protection during orchestration V2 intake and remove the V1 policy, decider, and reactor adaptations. Preserve an immediate check on unpin and the pin/unpin lifecycle if upstream still lacks them; remove this entry once upstream replaces the remaining fork-owned behavior.

