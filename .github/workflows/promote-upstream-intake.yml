name: Promote upstream intake

run-name: Promote ${{ github.event.workflow_run.head_branch }} at ${{ github.event.workflow_run.head_sha }}

# Starts when Fork CI passes on an intake branch. A workflow_run always runs
# main's copy of this file, so a candidate cannot change the checks that
# promote it. A candidate the audit marks eligible, whose native fingerprint is
# unchanged, promotes through upstream-intake-automatic; every other candidate
# waits for approval on upstream-intake-manual. To retry, re-run Fork CI.
on:
  workflow_run:
    workflows: ["Fork CI"]
    types: [completed]
    branches: ["intake/**"]

permissions:
  actions: read
  contents: read

# A new push to the same intake branch replaces a promotion still waiting for
# approval. Promotions of different branches can run together: the push to
# main is a fast-forward, so only one of them can land.
concurrency:
  group: upstream-intake-promotion-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate promotion candidate
    if: github.repository == 'incognitojam/styal' && github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      base_sha: ${{ steps.candidate.outputs.base_sha }}
      candidate_branch: ${{ steps.candidate.outputs.candidate_branch }}
      candidate_sha: ${{ steps.candidate.outputs.candidate_sha }}
      ci_run_url: ${{ github.event.workflow_run.html_url }}
      source_prs: ${{ steps.audit.outputs.source_prs }}
      source_commits: ${{ steps.audit.outputs.source_commits }}
      native_fingerprint: ${{ steps.fingerprint.outputs.verdict }}
      lane: ${{ steps.lane.outputs.lane }}
    steps:
      - name: Checkout trusted promotion code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      # The Fork CI run that started this workflow tested the candidate SHA. A
      # candidate cannot change fork-ci.yml, so that run used main's jobs.
      - id: candidate
        name: Resolve candidate
        shell: bash
        env:
          CANDIDATE_BRANCH: ${{ github.event.workflow_run.head_branch }}
          EXPECTED_CANDIDATE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          git fetch --no-tags origin \
            '+refs/heads/main:refs/remotes/origin/main' \
            "+refs/heads/${CANDIDATE_BRANCH}:refs/remotes/origin/intake-candidate"

          trusted_sha="$(git rev-parse --verify 'HEAD^{commit}')"
          base_sha="$(git rev-parse --verify 'refs/remotes/origin/main^{commit}')"
          candidate_sha="$(git rev-parse --verify 'refs/remotes/origin/intake-candidate^{commit}')"

          if [[ "$trusted_sha" != "$base_sha" ]]; then
            echo "::error::main moved after Fork CI finished. Rebase the intake branch and push it."
            exit 1
          fi
          if [[ "$candidate_sha" != "$EXPECTED_CANDIDATE_SHA" ]]; then
            echo "::error::The intake branch moved after Fork CI tested it; its new push starts its own promotion."
            exit 1
          fi
          if ! git diff --quiet "$base_sha" "$candidate_sha" -- .github/workflows/fork-ci.yml; then
            echo "::error::Candidates that change Fork CI must land through a pull request."
            exit 1
          fi

          {
            echo "base_sha=$base_sha"
            echo "candidate_branch=$CANDIDATE_BRANCH"
            echo "candidate_sha=$candidate_sha"
          } >> "$GITHUB_OUTPUT"

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: false
          run-install: |
            args:
              - --filter=@t3tools/scripts...

      - id: audit
        name: Audit candidate with trusted main code
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_BRANCH: ${{ steps.candidate.outputs.candidate_branch }}
          CANDIDATE_SHA: ${{ steps.candidate.outputs.candidate_sha }}
          CI_RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          git fetch --no-tags https://github.com/pingdotgg/t3code.git '+refs/heads/main:refs/remotes/upstream/main'
          vp run --filter @t3tools/scripts intake:check -- \
            --base "${{ steps.candidate.outputs.base_sha }}" \
            --head "$CANDIDATE_SHA"
          compare_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/main...${GITHUB_REPOSITORY/\//:}:$CANDIDATE_BRANCH"
          {
            echo
            echo "## Promotion validation"
            echo
            echo "- Candidate: \`$CANDIDATE_BRANCH\` at \`$CANDIDATE_SHA\`"
            echo "- Compare: [\`main...$CANDIDATE_BRANCH\`]($compare_url)"
            echo "- Fork CI: $CI_RUN_URL"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Download the native fingerprint verdict
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: intake-native-fingerprint
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/fingerprint

      - id: fingerprint
        name: Read the native fingerprint verdict
        shell: bash
        env:
          CANDIDATE_SHA: ${{ steps.candidate.outputs.candidate_sha }}
        run: |
          set -euo pipefail
          file="$RUNNER_TEMP/fingerprint/intake-native-fingerprint.json"
          verdict=unknown
          report="Native fingerprint: Fork CI did not report it. Compare it by hand before relying on an OTA update."
          if [[ -f "$file" ]] && [[ "$(jq -r .sha "$file")" == "$CANDIDATE_SHA" ]]; then
            verdict="$(jq -r .verdict "$file")"
            report="$(jq -r .report "$file")"
          fi
          case "$verdict" in
            unchanged | moved | unknown) ;;
            *) verdict=unknown ;;
          esac
          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"
          {
            echo
            echo "## Native fingerprint"
            echo
            echo "$report"
          } >> "$GITHUB_STEP_SUMMARY"

      - id: lane
        name: Choose the promotion lane
        shell: bash
        env:
          AUTOMATIC_ELIGIBLE: ${{ steps.audit.outputs.automatic_eligible }}
          NATIVE_FINGERPRINT: ${{ steps.fingerprint.outputs.verdict }}
        run: |
          set -euo pipefail
          if [[ "$AUTOMATIC_ELIGIBLE" == "true" && "$NATIVE_FINGERPRINT" == "unchanged" ]]; then
            lane=automatic
            reason="The audit found nothing that needs a person and the native fingerprint is unchanged."
          elif [[ "$AUTOMATIC_ELIGIBLE" != "true" ]]; then
            lane=manual
            reason="The audit requires manual approval; see its reasons above."
          else
            lane=manual
            reason="The native fingerprint is $NATIVE_FINGERPRINT."
          fi
          echo "lane=$lane" >> "$GITHUB_OUTPUT"
          {
            echo
            echo "## Promotion lane"
            echo
            echo "**${lane}**: $reason"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report projected upstream lag
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ steps.candidate.outputs.candidate_sha }}
        run: |
          git fetch --no-tags https://github.com/pingdotgg/t3code.git '+refs/heads/main:refs/remotes/upstream/main'
          node scripts/upstream/lag-report.ts --fork-ref "$CANDIDATE_SHA" >> "$GITHUB_STEP_SUMMARY"
          node scripts/upstream/tracked-prs-report.ts --fork-ref "$CANDIDATE_SHA" >> "$GITHUB_STEP_SUMMARY"
          node scripts/upstream/divergence-report.ts --base origin/main --head "$CANDIDATE_SHA" --heading "Projected upstream divergence" >> "$GITHUB_STEP_SUMMARY"

  promote:
    name: ${{ needs.validate.outputs.lane == 'automatic' && 'Promote eligible candidate' || 'Approve and promote candidate' }}${{ needs.validate.outputs.native_fingerprint != 'unchanged' && format(' (native fingerprint {0})', needs.validate.outputs.native_fingerprint) || '' }}
    needs: validate
    if: needs.validate.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: ${{ needs.validate.outputs.lane == 'automatic' && 'upstream-intake-automatic' || 'upstream-intake-manual' }}
    permissions:
      actions: read
      contents: read
    steps:
      - id: porter_token
        name: Mint Styal Porter token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.STYAL_INTAKE_APP_ID }}
          private-key: ${{ secrets.STYAL_INTAKE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      - name: Checkout current main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.porter_token.outputs.token }}
          persist-credentials: true
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Fast-forward main to the candidate
        shell: bash
        env:
          EXPECTED_BASE_SHA: ${{ needs.validate.outputs.base_sha }}
          CANDIDATE_BRANCH: ${{ needs.validate.outputs.candidate_branch }}
          CANDIDATE_SHA: ${{ needs.validate.outputs.candidate_sha }}
          CI_RUN_URL: ${{ needs.validate.outputs.ci_run_url }}
          SOURCE_PRS: ${{ needs.validate.outputs.source_prs }}
          SOURCE_COMMITS: ${{ needs.validate.outputs.source_commits }}
        run: |
          set -euo pipefail

          if [[ ! "$EXPECTED_BASE_SHA" =~ ^[0-9a-f]{40}$ ]] ||
            [[ ! "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          then
            echo "::error::Promotion received an invalid base or candidate SHA."
            exit 1
          fi

          git fetch --no-tags origin \
            '+refs/heads/main:refs/remotes/origin/main' \
            "+refs/heads/${CANDIDATE_BRANCH}:refs/remotes/origin/intake-candidate"

          current_main_sha="$(git rev-parse --verify 'refs/remotes/origin/main^{commit}')"
          current_candidate_sha="$(git rev-parse --verify 'refs/remotes/origin/intake-candidate^{commit}')"

          if [[ "$current_main_sha" != "$EXPECTED_BASE_SHA" ]]; then
            echo "::error::main moved after validation. Rebase the intake branch and dispatch again."
            exit 1
          fi
          if [[ "$current_candidate_sha" != "$CANDIDATE_SHA" ]]; then
            echo "::error::The intake branch moved after validation. Review and dispatch its new SHA."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$current_main_sha" "$CANDIDATE_SHA"; then
            echo "::error::The candidate is no longer a fast-forward of main."
            exit 1
          fi

          git push origin "${CANDIDATE_SHA}:refs/heads/main"

          promoted_sha="$(git ls-remote --exit-code origin refs/heads/main | cut -f1)"
          if [[ "$promoted_sha" != "$CANDIDATE_SHA" ]]; then
            echo "::error::main does not point at the candidate after the push."
            exit 1
          fi

          {
            echo "## Promotion complete"
            echo
            echo "- Branch: \`$CANDIDATE_BRANCH\`"
            echo "- Promoted SHA: \`$CANDIDATE_SHA\`"
            echo "- Source PRs: \`$SOURCE_PRS\`"
            echo "- Source commits: \`$SOURCE_COMMITS\`"
            echo "- Verified Fork CI: $CI_RUN_URL"
            echo "- Push actor: \`${{ steps.porter_token.outputs.app-slug }}[bot]\`"
          } >> "$GITHUB_STEP_SUMMARY"
