name: Route new issues

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  route:
    runs-on: ubuntu-24.04
    steps:
      - name: Label and announce issue
        uses: actions/github-script@v9
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_CI }}
        with:
          script: |
            // issues events use the default branch SHA, never a ref supplied by the reporter.
            const source = await fetch(
              `https://raw.githubusercontent.com/${context.repo.owner}/${context.repo.repo}/${context.sha}/scripts/issue-routing.ts`
            );
            if (!source.ok) throw new Error(`Cannot load routing script: ${source.status}`);
            const { stripTypeScriptTypes } = require('node:module');
            const javascript = stripTypeScriptTypes(await source.text());
            const { classifyReport, issueLabels, routingLabels, discordPayload } =
              await import(`data:text/javascript;base64,${Buffer.from(javascript).toString('base64')}`);
            const issue = context.payload.issue;
            const kind = classifyReport(issue.body);
            const labels = issueLabels(kind);
            for (const name of labels) {
              try {
                await github.rest.issues.getLabel({ ...context.repo, name });
              } catch (error) {
                if (error.status !== 404) throw error;
                const definition = routingLabels.find(label => label.name === name);
                try {
                  await github.rest.issues.createLabel({ ...context.repo, ...definition });
                } catch (creationError) {
                  // Another opened issue or the label sync can create it concurrently.
                  if (creationError.status !== 422) throw creationError;
                  await github.rest.issues.getLabel({ ...context.repo, name });
                }
              }
            }
            await github.rest.issues.addLabels({ ...context.repo, issue_number: issue.number, labels });

            const webhook = process.env.DISCORD_WEBHOOK_URL;
            if (!webhook) return;
            const response = await fetch(webhook, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(discordPayload(issue, kind)),
            });
            if (!response.ok) throw new Error(`Discord alert failed: ${response.status}`);
