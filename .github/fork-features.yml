      - Test and generated tiers remain visible, generated files start collapsed, and explicit reader fold choices take precedence over automatic classification.
      - One persisted web preference switches the diff panel and pull request Code tab between relevance and alphabetical order; one persisted mobile preference does the same for the review sheet and pull request file list, Changed files sheet, and file diff, and the Changed files sheet groups by directory only in alphabetical order.
