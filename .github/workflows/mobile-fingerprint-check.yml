name: Mobile Fingerprint Check

# Detects whether a PR changes the native fingerprint — i.e. whether merging
# it would leave main un-OTA-able until a new store build ships. Native-change
# PRs get the "📱 Native Change" label (applied by mobile-fingerprint-label.yml,
# which runs from main so fork PRs get it too) so they can be held and merged as a
# batch right before the next store submission, keeping main OTA-able for
# everything else in between. (Once one native PR merges, every later merge
# inherits the drifted fingerprint and loses OTA reach too — that is why the
# signal has to fire before merge, not after.)
#
# Android fingerprint changes also run a release build. Both fingerprints
# are computed in one job with the same OS and pinned pnpm; no EXPO_TOKEN needed.
on:
  pull_request:
    # Run even when a rebase or base change removes every native input from the
    # diff, so the label can be cleared without installing Expo dependencies.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: ["intake/**"]

concurrency:
  # A title or body edit gets its own group, so it cannot cancel the PR's real
  # run and leave a cancelled check on the head commit.
  group: mobile-fingerprint-check-${{ github.event_name }}-${{ github.event.action == 'edited' && !github.event.changes.base && format('edit-{0}', github.run_id) || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fingerprint:
    name: Native fingerprint diff
    if: github.event.action != 'edited' || github.event.changes.base
    runs-on: ubuntu-24.04
    outputs:
      native_inputs: ${{ steps.changes.outputs.relevant }}
      android_changed: ${{ steps.changes.outputs.relevant == 'false' && 'false' || steps.compare.outputs.android_changed }}
      android_fingerprint: ${{ steps.compare.outputs.android_fingerprint }}
    permissions:
      contents: read
    env:
      APP_VARIANT: production
      EXPO_OWNER: ${{ vars.EXPO_OWNER }}
      EXPO_PROJECT_ID: ${{ vars.EXPO_PROJECT_ID }}
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Pin the event SHA; intake comparisons need the whole candidate ancestry.
          ref: ${{ github.sha }}
          fetch-depth: ${{ github.event_name == 'push' && '0' || '2' }}

      - id: changes
        name: Detect native fingerprint inputs
        run: |
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
            base_sha=$(git rev-parse refs/remotes/origin/main)
            if ! git merge-base --is-ancestor "$base_sha" HEAD; then
              echo "::error::The intake candidate does not include current main. Rebase it and push again."
              exit 1
            fi
          else
            base_sha=$(git rev-parse HEAD^1)
          fi
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
          echo "Comparing $base_sha..$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          paths=$(git diff --no-renames --name-only "$base_sha" HEAD -- \
            apps/mobile/ packages/client-runtime/ packages/contracts/ packages/shared/ \
            assets/ scripts/ patches/ package.json pnpm-lock.yaml pnpm-workspace.yaml \
            .easignore .github/workflows/mobile-fingerprint-check.yml)
          if [[ -n "$paths" ]]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
            echo "No native fingerprint inputs changed; clearing any stale native change label." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Setup Vite+
        if: steps.changes.outputs.relevant == 'true'
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1.15.0
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/mobile...

      - name: Expose pnpm
        if: steps.changes.outputs.relevant == 'true'
        run: |
          pnpm_version="$(node --print "require('./package.json').packageManager.split('@').pop()")"
          vp_pnpm_bin="$HOME/.vite-plus/package_manager/pnpm/$pnpm_version/pnpm/bin"
          echo "$vp_pnpm_bin" >> "$GITHUB_PATH"
          "$vp_pnpm_bin/pnpm" --version

      - name: Fingerprint candidate
        if: steps.changes.outputs.relevant == 'true'
        working-directory: apps/mobile
        run: |
          mkdir -p "$RUNNER_TEMP/fp/head" "$RUNNER_TEMP/fp/base"
          for platform in ios android; do
            npx expo-updates fingerprint:generate --platform "$platform" > "$RUNNER_TEMP/fp/head/$platform.json"
          done

      - name: Fingerprint base
        if: steps.changes.outputs.relevant == 'true'
        env:
          BASE_SHA: ${{ steps.changes.outputs.base_sha }}
        run: |
          git checkout --quiet "$BASE_SHA"
          # Re-sync node_modules to the base commit's lockfile before
          # fingerprinting — a dep-changing PR must not fingerprint the base
          # against head's installed packages.
          pnpm install --filter=@t3tools/mobile...
          cd apps/mobile
          for platform in ios android; do
            npx expo-updates fingerprint:generate --platform "$platform" > "$RUNNER_TEMP/fp/base/$platform.json"
          done

      - id: compare
        name: Compare fingerprints
        if: steps.changes.outputs.relevant == 'true'
        run: |
          changed=""
          {
            echo "## Native fingerprint diff"
            echo
            for platform in ios android; do
              head_hash="$(jq -er '.hash | select(test("^[0-9a-f]{40}$"))' "$RUNNER_TEMP/fp/head/$platform.json")"
              base_hash="$(jq -er '.hash | select(test("^[0-9a-f]{40}$"))' "$RUNNER_TEMP/fp/base/$platform.json")"
              if [ "$platform" = android ]; then
                echo "android_fingerprint=$head_hash" >> "$GITHUB_OUTPUT"
                if [ "$head_hash" = "$base_hash" ]; then
                  echo "android_changed=false" >> "$GITHUB_OUTPUT"
                else
                  echo "android_changed=true" >> "$GITHUB_OUTPUT"
                fi
              fi
              if [ "$head_hash" = "$base_hash" ]; then
                echo "- ✅ **$platform**: unchanged (\`$head_hash\`) — OTA-compatible"
                continue
              fi
              changed="$changed $platform"
              echo "- 📱 **$platform**: \`$base_hash\` → \`$head_hash\` — merging requires a new native build before OTAs work again"
              jq -r -n \
                --slurpfile h "$RUNNER_TEMP/fp/head/$platform.json" \
                --slurpfile b "$RUNNER_TEMP/fp/base/$platform.json" '
                  ($b[0].sources | map({ (.filePath // .id): .hash }) | add // {}) as $bm
                  | $h[0].sources[]
                  | select($bm[(.filePath // .id)] != .hash)
                  | "  - \(.type): `\(.filePath // .id)`"'
            done
          } >> "$GITHUB_STEP_SUMMARY"
          echo "changed_platforms=${changed# }" >> "$GITHUB_OUTPUT"

      # mobile-fingerprint-label.yml reads this from main with a write token
      # and syncs the label; this job's token is read-only for fork PRs.
      - name: Record changed platforms
        env:
          CHANGED_PLATFORMS: ${{ steps.compare.outputs.changed_platforms }}
        run: |
          mkdir -p "$RUNNER_TEMP/fingerprint-result"
          printf '%s\n' "$CHANGED_PLATFORMS" > "$RUNNER_TEMP/fingerprint-result/changed-platforms"

      - name: Upload changed platforms
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fingerprint-result
          path: ${{ runner.temp }}/fingerprint-result
          if-no-files-found: error
          retention-days: 1

  android_release:
    # A skipped metadata job must not satisfy the real build's required check.
    name: ${{ github.event.action == 'edited' && !github.event.changes.base && 'Android release build (metadata edit)' || 'Android release build' }}
    needs: fingerprint
    if: ${{ always() && (github.event.action != 'edited' || github.event.changes.base) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      APP_VARIANT: production
      EXPO_OWNER: ${{ vars.EXPO_OWNER }}
      EXPO_PROJECT_ID: ${{ vars.EXPO_PROJECT_ID }}
      T3CODE_RELAY_URL: ${{ vars.RELAY_URL }}
      NODE_OPTIONS: --max-old-space-size=8192
      EXPO_NO_GIT_STATUS: "1"
      EXPO_UPDATES_FINGERPRINT_OVERRIDE: ${{ needs.fingerprint.outputs.android_fingerprint }}
      EXPO_UPDATES_WORKFLOW_OVERRIDE: managed
    steps:
      - name: Require a successful fingerprint comparison
        env:
          RESULT: ${{ needs.fingerprint.result }}
          NATIVE_INPUTS: ${{ needs.fingerprint.outputs.native_inputs }}
          ANDROID_CHANGED: ${{ needs.fingerprint.outputs.android_changed }}
          ANDROID_FINGERPRINT: ${{ needs.fingerprint.outputs.android_fingerprint }}
        run: |
          echo "Fingerprint comparison: $RESULT; Android changed: $ANDROID_CHANGED"
          [[ "$RESULT" == success && ("$ANDROID_CHANGED" == true || "$ANDROID_CHANGED" == false) ]]
          if [[ "$NATIVE_INPUTS" == true ]]; then
            [[ "$ANDROID_FINGERPRINT" =~ ^[0-9a-f]{40}$ ]]
          else
            [[ "$NATIVE_INPUTS" == false && "$ANDROID_CHANGED" == false ]]
          fi

      - name: Android fingerprint unchanged
        if: needs.fingerprint.outputs.android_changed == 'false'
        run: echo "Android fingerprint unchanged; no release build needed." >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout
        if: needs.fingerprint.outputs.android_changed == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        if: needs.fingerprint.outputs.android_changed == 'true'
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/mobile...

      - name: Setup Java
        if: needs.fingerprint.outputs.android_changed == 'true'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Restore Gradle cache
        if: needs.fingerprint.outputs.android_changed == 'true'
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.gradle/caches/*
            ~/.gradle/wrapper
            !~/.gradle/caches/build-cache-1
          key: gradle-android-deps-v2-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: gradle-android-deps-v2-

      - name: Cache Android build outputs
        if: needs.fingerprint.outputs.android_changed == 'true'
        uses: ./.github/actions/cache-android-build
        with:
          variant: production

      - name: Generate the native project
        if: needs.fingerprint.outputs.android_changed == 'true'
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build the release APK
        if: needs.fingerprint.outputs.android_changed == 'true'
        working-directory: apps/mobile/android
        env:
          TMPDIR: ${{ runner.temp }}/metro
        run: |
          mkdir -p "$TMPDIR"
          ./gradlew :app:assembleRelease --build-cache --profile \
            -PreactNativeArchitectures=arm64-v8a \
            -Pexpo.useLegacyPackaging=true
