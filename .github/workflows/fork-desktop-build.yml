name: Fork Desktop Build

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to build
        required: true
        type: string
      version:
        description: Version to write into the desktop packages
        required: true
        type: string
      target:
        description: Desktop target to build
        required: false
        default: all
        type: string
      sign_macos:
        description: Sign and notarize the macOS artifact
        required: false
        default: false
        type: boolean
      check_notarization:
        description: Fail before building if the nightly notarization queue is active
        required: false
        default: false
        type: boolean
      force_notarization:
        description: Ignore an active nightly notarization submission
        required: false
        default: false
        type: boolean
    secrets:
      APPLE_API_KEY:
        required: false
      APPLE_API_KEY_ID:
        required: false
      APPLE_API_ISSUER:
        required: false
      CSC_KEY_PASSWORD:
        required: false
      CSC_LINK:
        required: false
      MACOS_PROVISIONING_PROFILE:
        required: false

permissions:
  contents: read
  id-token: none

jobs:
  configure:
    name: Configure build matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - id: matrix
        name: Select targets
        shell: bash
        env:
          SELECTED_TARGET: ${{ inputs.target }}
        run: |
          node <<'NODE' >> "$GITHUB_OUTPUT"
          const targets = [
            {
              id: "macos-arm64",
              label: "macOS arm64",
              runner: "blacksmith-6vcpu-macos-15",
              platform: "mac",
              target: "dmg",
              arch: "arm64",
              rust_target: "aarch64-apple-darwin",
              artifact: "desktop-mac-arm64",
            },
            {
              id: "linux-x64",
              label: "Linux x64",
              runner: "blacksmith-8vcpu-ubuntu-2404",
              platform: "linux",
              target: "AppImage",
              arch: "x64",
              rust_target: "x86_64-unknown-linux-gnu",
              artifact: "desktop-linux-x64",
            },
            {
              id: "windows-x64",
              label: "Windows x64",
              runner: "blacksmith-16vcpu-windows-2025",
              platform: "win",
              target: "nsis",
              arch: "x64",
              rust_target: "x86_64-pc-windows-msvc",
              artifact: "desktop-win-x64",
            },
          ];

          const selected = process.env.SELECTED_TARGET === "all"
            ? targets
            : targets.filter(({ id }) => id === process.env.SELECTED_TARGET);
          if (selected.length === 0) {
            throw new Error(`Unknown desktop build target: ${process.env.SELECTED_TARGET}`);
          }

          process.stdout.write(`matrix=${JSON.stringify({ include: selected })}\n`);
          NODE

  # node-pty publishes no Linux prebuilt and the WSL backend runs under the
  # distro's own (Linux) Node. Build it on Linux for the Windows package so WSL
  # works without a first-launch compiler, node-gyp, or network connection.
  build_wsl_node_pty:
    name: Build WSL node-pty x64
    needs: configure
    if: inputs.target == 'all' || inputs.target == 'windows-x64'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=t3...

      - name: Build node-pty linux-x64 prebuild
        shell: bash
        run: |
          set -euo pipefail
          pty_pkg="$(node -e "console.log(require.resolve('node-pty/package.json', { paths: ['$GITHUB_WORKSPACE/apps/server'] }))")"
          pty_dir="$(dirname "$pty_pkg")"
          ( cd "$pty_dir" && npx --yes node-gyp rebuild )
          mkdir -p wsl-prebuild
          cp "$pty_dir/build/Release/pty.node" wsl-prebuild/pty.node
          file wsl-prebuild/pty.node

      - name: Upload node-pty linux-x64 prebuild
        uses: actions/upload-artifact@v7
        with:
          name: wsl-node-pty-x64
          path: wsl-prebuild/pty.node
          if-no-files-found: error

  build:
    name: Build ${{ matrix.label }}
    needs: [configure, build_wsl_node_pty]
    # A failed WSL prebuild should fail the Windows matrix entry at its download
    # step without preventing independent macOS and Linux entries from running.
    if: ${{ !cancelled() && needs.configure.result == 'success' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.configure.outputs.matrix) }}
    steps:
      - name: Check Apple notarization queue
        if: >-
          matrix.platform == 'mac' &&
          inputs.sign_macos &&
          inputs.check_notarization &&
          !inputs.force_notarization
        shell: bash
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          umask 077

          required=(APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER)
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required Apple notarization configuration: $name" >&2
              exit 1
            fi
          done

          key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY" > "$key_path"
          history_json=$(xcrun notarytool history \
            --key "$key_path" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER" \
            --output-format json)

          active_submission=$(jq -r '
            .history
            | map(select(
                .name == "T3 Code (yngatech Nightly).zip" and
                .status == "In Progress"
              ))
            | sort_by(.createdDate)
            | last
            | if . == null then empty else [.id, .createdDate] | @tsv end
          ' <<< "$history_json")

          if [[ -n "$active_submission" ]]; then
            IFS=$'\t' read -r submission_id created_date <<< "$active_submission"
            echo "::error title=Apple notarization already in progress::Submission $submission_id from $created_date is still in progress. Wait for Apple to finish, or dispatch Fork Nightly with force_notarization enabled."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/desktop...
              - --filter=t3...
              - --filter=@t3tools/scripts...

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Align package versions
        run: node scripts/update-release-package-versions.ts "${{ inputs.version }}"

      - name: Download WSL node-pty prebuild
        if: matrix.platform == 'win'
        uses: actions/download-artifact@v8
        with:
          name: wsl-node-pty-x64
          path: wsl-prebuild

      - name: Install Spectre-mitigated MSVC libs
        if: matrix.platform == 'win'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installPath = & $vswhere -products * -latest -property installationPath
          $setupExe = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"
          $proc = Start-Process -FilePath $setupExe `
            -ArgumentList "modify", "--installPath", "`"$installPath`"", "--add", `
            "Microsoft.VisualStudio.Component.VC.Tools.x86.x64.Spectre", "--quiet", "--norestart" `
            -Wait -PassThru -NoNewWindow
          if ($null -eq $proc -or $proc.ExitCode -ne 0) {
            $code = if ($null -ne $proc) { $proc.ExitCode } else { 1 }
            Write-Error "Visual Studio Installer failed with exit code $code"
            exit $code
          }

      - name: Install ImageMagick
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          if ! command -v magick >/dev/null 2>&1 && ! command -v convert >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y imagemagick
          fi

          if command -v magick >/dev/null 2>&1; then
            magick -version
          else
            convert -version
          fi

      - name: Build desktop artifact
        timeout-minutes: 90
        shell: bash
        env:
          T3CODE_DESKTOP_UPDATE_REPOSITORY: ${{ github.repository }}
          SIGN_MACOS: ${{ inputs.sign_macos }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          MACOS_PROVISIONING_PROFILE: ${{ secrets.MACOS_PROVISIONING_PROFILE }}
          T3CODE_CLERK_PASSKEY_RP_DOMAINS: ${{ vars.CLERK_PASSKEY_RP_DOMAINS }}
        run: |
          set -euo pipefail

          args=(
            --platform "${{ matrix.platform }}"
            --target "${{ matrix.target }}"
            --arch "${{ matrix.arch }}"
            --build-version "${{ inputs.version }}"
            --verbose
          )

          if [[ "${{ matrix.platform }}" == "mac" && "$SIGN_MACOS" == "true" ]]; then
            required=(
              CSC_LINK
              CSC_KEY_PASSWORD
              APPLE_API_KEY
              APPLE_API_KEY_ID
              APPLE_API_ISSUER
              APPLE_TEAM_ID
              MACOS_PROVISIONING_PROFILE
              T3CODE_CLERK_PASSKEY_RP_DOMAINS
            )
            for name in "${required[@]}"; do
              if [[ -z "${!name:-}" ]]; then
                echo "Missing required Apple signing configuration: $name" >&2
                exit 1
              fi
            done

            key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
            printf '%s' "$APPLE_API_KEY" > "$key_path"
            export APPLE_API_KEY="$key_path"

            profile_path="$RUNNER_TEMP/t3code.provisionprofile"
            profile_plist="$RUNNER_TEMP/t3code-profile.plist"
            printf '%s' "$MACOS_PROVISIONING_PROFILE" | base64 -D > "$profile_path"
            security cms -D -i "$profile_path" > "$profile_plist"

            expected_app_id="$APPLE_TEAM_ID.dev.incognitojam.t3code"
            profile_app_id=$(/usr/libexec/PlistBuddy \
              -c 'Print :Entitlements:com.apple.application-identifier' \
              "$profile_plist")
            if [[ "$profile_app_id" != "$expected_app_id" ]]; then
              echo "Provisioning profile app ID is '$profile_app_id'; expected '$expected_app_id'." >&2
              exit 1
            fi

            if ! /usr/libexec/PlistBuddy \
              -c 'Print :Entitlements:com.apple.developer.associated-domains' \
              "$profile_plist" >/dev/null; then
              echo "Provisioning profile does not enable Associated Domains." >&2
              exit 1
            fi

            export T3CODE_APPLE_TEAM_ID="$APPLE_TEAM_ID"
            export T3CODE_MACOS_PROVISIONING_PROFILE="$profile_path"
            args+=(--signed)
          elif [[ "${{ matrix.platform }}" == "win" ]]; then
            args+=(--wsl-prebuild "$GITHUB_WORKSPACE/wsl-prebuild/pty.node")
          fi

          vp run dist:desktop:artifact "${args[@]}"

      - name: Collect release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-publish

          shopt -s nullglob
          for pattern in \
            "release/*.dmg" \
            "release/*.zip" \
            "release/*.AppImage" \
            "release/*.exe" \
            "release/*.blockmap" \
            "release/*.yml"; do
            for file in $pattern; do
              [[ "$(basename "$file")" == "builder-debug.yml" ]] && continue
              cp "$file" release-publish/
            done
          done

          test -n "$(find release-publish -maxdepth 1 -type f -print -quit)"

      - name: Upload release assets
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: release-publish/*
          if-no-files-found: error
