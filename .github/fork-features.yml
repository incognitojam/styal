  - id: device-stream-stats
    title: Stream stats for device viewers
    status: maintained
    prs: []
    invariants:
      - Web, desktop and mobile device viewers offer **Show stream stats**, which shows the stream's frame rate, received data rate, delay growth behind the device, decoder resets, reconnects and pauses, refreshed once a second only while shown.
      - Delay growth is measured from Android frame capture timestamps against the smallest lag seen since the stream or encoder session started, using the least-delayed frame of each second with at least five frames, so a still screen reports no delay; iOS streams report no delay or pauses because a still iOS screen sends no video.
