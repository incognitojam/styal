      - packages/contracts/src/rpc.ts
    tests:
      - apps/mobile/src/state/use-composer-drafts.test.ts
      - apps/server/src/persistence/ComposerDrafts.test.ts
      - apps/server/src/persistence/ForkMigrations.test.ts
      - apps/web/src/composerDraftStore.test.ts
    upstream:
      status: unassessed
      tracking: []
      retire_when: Upstream synchronizes equivalent composer draft state across clients and safely migrates installations carrying the fork schema.

  - id: desktop-graceful-shutdown
    title: Bounded graceful desktop shutdown
    status: maintained
    prs: [203]
    invariants:
      - Quitting flushes settings and gracefully closes the main window before destroying remaining windows and terminating the backend.
      - Cleanup is bounded and observable so a stuck close, telemetry flush, or backend request cannot indefinitely delay process exit.
    implementation_paths:
      - apps/desktop/src/app/DesktopLifecycle.ts
      - apps/desktop/src/app/DesktopObservability.ts
      - apps/desktop/src/window/DesktopWindow.ts
    upstream_paths:
      - apps/desktop/src/app/DesktopLifecycle.ts
      - apps/desktop/src/backend/DesktopBackendManager.ts
      - apps/desktop/src/electron/ElectronWindow.ts
      - apps/desktop/src/window/DesktopWindow.ts
    tests:
      - apps/desktop/src/app/DesktopLifecycle.test.ts
      - apps/desktop/src/app/DesktopObservability.test.ts
      - apps/desktop/src/window/DesktopWindow.test.ts
    upstream:
      status: partial
      tracking:
        - https://github.com/pingdotgg/t3code/pull/6562
      retire_when: Upstream performs the same ordered, bounded, and observable graceful shutdown before destroying windows and terminating the backend.

