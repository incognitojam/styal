  - id: workflow-run-watch
    title: Wake agents when a watched CI workflow run completes
    status: maintained
    prs: [896]
    invariants:
      - watch_workflow_run reads the GitHub Actions run first; a run that already completed is reported to the agent instead of watched, and an unreadable run is an error.
      - The server reads each watched run every 30 seconds, respecting host quota pauses, and wakes the agent once when it completes, naming its conclusion and the jobs of the latest attempt that did not pass, then ends the watch in the same step.
      - A watched run keeps the thread in the Working list as a monitor background task until the watch ends.
      - Forks and subagent child threads start without workflow run watches; the parent's watches remain unchanged.
      - Settling, archiving, or stopping the thread ends its workflow run watches, and a finish read before that changes nothing and wakes no one. Subagents and settled or archived threads cannot start one.
      - Eight failed reads in a row end the watch with a wake saying so; a host rate limit only pauses it.
      - Workflow run and pending-deployment reads revalidate independently with ETags under the same pinned credential. An unchanged run still refreshes deployment approval permissions; only complete, valid responses are cached in a bounded, credential-scoped cache, and a successful review clears both validators before the immediate refresh. Hosts without ETags keep using unconditional reads, and failed jobs still come from the latest attempt.
      - A watched run that waits on deployment environments the viewer may approve records them on the watch, which marks the thread as needing approval on every client and in push notifications until the run stops waiting. The user approves or rejects them from the thread, with an optional comment, and the server reads the run again at once; the agent has no tool to review them.
      - Compact workflow labels shorten full commit hashes to eight characters while retaining the complete name in accessible descriptions or tooltips. A sole watched run with a deployment review shares one panel with its Stop action; unrelated or multiple background tasks keep their own monitor row on web, desktop, and mobile.
      - Mobile can stop a workflow watch after the agent becomes idle; Stop checks thread operation permission, prevents duplicate submissions, and stays disabled while the request is pending.
      - Each tool call, each deployment review and each watch end the server sees records one feature.used event with fixed categories (call result or failure reason; review state; end reason, conclusion category and watched minutes), never run IDs, repositories, URLs, environments, comments, or workflow and job names.
    rationale: Agents waiting on CI outside a pull request (after a merge, deploys, releases, dispatched workflows) otherwise poll or hold a `gh run watch` process, which only some providers can wait on and which a server restart kills.
    implementation_paths:
      - apps/mobile/src/features/threads/ThreadDetailScreen.tsx
