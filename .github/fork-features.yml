  - id: inspectable-tool-activity
    title: Keep tool activity concise and inspectable
    status: maintained
    prs: [4, 11, 36, 58, 60, 66, 117, 139, 158, 168, 190, 204, 230, 238, 278, 282, 301, 582]
    invariants:
      - Web and mobile name supported tool calls by their action with a concise useful argument, while agent panels and approval rows use the same vocabulary instead of raw provider names or serialized input.
      - Clarifying-question calls name what was asked and expand into those questions with their options, rather than restating the provider's serialized input.
      - Completed web command rows reveal the full raw command and retrieve persisted output only after expansion, keeping routine timeline activity payloads bounded.
      - Migrated commands resolve by canonical item ID or original activity ID using only V2 projections, preserving retained stdout, stderr, and exit codes when canonical output omits them.
      - Collapsed web tool groups expand into their individual named calls, with failure, exit-code, diff, and disclosure signals remaining independently visible.
      - Meaningful running-command interactions are shown with fixed sanitized summaries while empty polls and raw terminal input remain hidden.
      - Claude, Codex, and OpenCode file edits retain structured paths, line statistics, lifecycle state, and provider-independent presentation without eagerly sending full diffs to clients.
      - Folded completed turns summarize the categories of tools used with recognizable icons; reasoning stays inspectable without counting as a tool call, and web and desktop keep the activity counts and disclosure chevron aligned to the end of the row.
      - Folded turn rows show no hover timestamp of their own, since the user message that starts the turn already reveals the same time.
      - Claude project memory writes and index updates form a distinct work-log category on web and mobile, read as "Updated memory" rows, and count separately in group and folded-turn summaries, including projected file changes that name no tool; reads of those files are titled "Read memory" with the memory name but still count as file reads; similarly named repository files remain ordinary edits and reads.
      - Page fetches read as "Fetched page" with their URL for Claude and ACP providers, and ACP workspace searches read and count as code searches rather than web lookups, including in historical threads.
    rationale: Upstream V2 owns native item vocabulary, provider-attempt folds, read-path punctuation, and standalone compaction rows; the obsolete V1 aliases and activity inference are retired. The fork retains shared action labels, structured edit counts, findings cards, group summaries, approval details, and on-demand raw command output. Historical provider payloads remain frozen on V2 items so output lookup preserves imported details without reading the retired V1 activity projection.
