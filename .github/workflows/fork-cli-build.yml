name: Fork CLI Build

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      version:
        required: true
        type: string
      operation:
        description: Build and verify packages, or publish previously built packages
        required: true
        type: string
      dist_tag:
        default: latest
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Pack and verify CLI
    if: inputs.operation == 'build'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      T3CODE_CLERK_PUBLISHABLE_KEY: ${{ vars.CLERK_PUBLISHABLE_KEY }}
      T3CODE_CLERK_JWT_TEMPLATE: ${{ vars.CLERK_JWT_TEMPLATE }}
      T3CODE_CLERK_CLI_OAUTH_CLIENT_ID: ${{ vars.CLERK_CLI_OAUTH_CLIENT_ID }}
      T3CODE_RELAY_URL: ${{ vars.RELAY_URL }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@styal/cli...
              - --filter=@t3tools/scripts...
      - name: Align release versions
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: node scripts/update-release-package-versions.ts "$RELEASE_VERSION"
      - name: Download verified release archives
        uses: actions/download-artifact@v8
        with:
          pattern: cli-archive-*
          merge-multiple: true
          path: cli-archives
      - name: Verify release bytes
        run: cd cli-archives && sha256sum --check SHA256SUMS
      - name: Build platform packages and npm launcher
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: node scripts/build-npm-platform-packages.ts --archives-dir cli-archives --version "$RELEASE_VERSION" --output-dir cli-release
      - name: Verify npm install and legacy preflight in a clean container
        run: |
          docker run --rm -v "$PWD/cli-release/@styal:/artifacts:ro" -v "$PWD/scripts/verify-cli-package.mjs:/verify.mjs:ro" node:26-bookworm node /verify.mjs /artifacts /verification
      - name: Upload npm packages
        uses: actions/upload-artifact@v7
        with:
          name: cli-package
          path: cli-release/@styal/*.tgz
          if-no-files-found: error

  publish:
    name: Publish CLI to npm
    if: inputs.operation == 'publish'
    # npm OIDC publishing requires a GitHub-hosted runner.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      # Use the workflow revision, not an older release candidate's scripts.
      - uses: actions/checkout@v6
        with:
          sparse-checkout: scripts/check-cli-release-freshness.ts
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v8
        with:
          name: cli-package
          path: cli-release
      - name: Publish verified archive
        env:
          DIST_TAG: ${{ inputs.dist_tag }}
          RELEASE_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          node scripts/check-cli-release-freshness.ts

          publish_or_verify() {
            local package_name="$1"
            local archive="$2"
            local package_spec="${package_name}@${RELEASE_VERSION}"
            local local_integrity
            local published_integrity
            local published_tag
            local view_output
            local view_status

            local_integrity="sha512-$(openssl dgst -sha512 -binary "$archive" | openssl base64 -A)"

            set +e
            view_output=$(npm view "$package_spec" dist.integrity --json 2>&1)
            view_status=$?
            set -e

            if (( view_status == 0 )); then
              published_integrity=$(jq -er 'select(type == "string" and length > 0)' <<<"$view_output")
              if [[ "$published_integrity" != "$local_integrity" ]]; then
                echo "Published $package_spec does not match $archive." >&2
                echo "Published integrity: $published_integrity" >&2
                echo "Expected integrity:  $local_integrity" >&2
                return 1
              fi
              published_tag=$(npm view "$package_name" dist-tags --json | jq -r --arg tag "$DIST_TAG" '.[$tag] // empty')
              if [[ "$published_tag" != "$RELEASE_VERSION" ]]; then
                echo "Published $package_spec has matching bytes, but $package_name@$DIST_TAG points at ${published_tag:-<missing>}. Repair the channel tag before retrying." >&2
                return 1
              fi
              echo "$package_spec is already published with the verified bytes and channel tag."
              return 0
            fi

            if ! grep -q 'E404' <<<"$view_output"; then
              printf '%s\n' "$view_output" >&2
              return "$view_status"
            fi

            npm publish "$archive" --access public --tag "$DIST_TAG" --provenance
          }

          # Publish all five exact-version dependencies before their launcher.
          for key in darwin-arm64 linux-x64 linux-arm64 win32-x64 win32-arm64; do
            publish_or_verify "@styal/cli-$key" "./cli-release/cli-$key.tgz"
          done
          publish_or_verify "@styal/cli" ./cli-release/cli.tgz
