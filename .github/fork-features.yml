  - id: desktop-background-updates
    title: Download desktop updates in the background and install on quit
    status: maintained
    prs: [110, 128, 358, 390, 754, 758, 851]
    invariants:
      - Nightly release previews retain curated highlights and footer filtering while showing newest entries with counts and links to styal releases.
      - Desktop activity authentication remains available for the host process lifetime, including the first quit after days of uptime and renewal after bearer expiry. Signing in for an activity check never revokes the desktop window's session.
      - In-app shutdown dialogs appear only for active or unknown work and list affected thread titles under their project icons/names and host labels with each environment's chosen machine icon, with threads that continue after the restart in their own section. Which threads continue comes from the server's activity report, which applies each project's setting and excludes runs the user asked to stop, native maintenance commands, and threads at the limit of automatic continuations in a row, as delivery after the restart does; desktop quits say they continue when styal next starts, and desktop relaunches that turn off or replace a backend report every thread as interrupted. Each thread has a badge per turn, input, approval, or background-work reason from the same snapshot as the counts; older servers retain counts and explicitly report unavailable details, and a reason the client does not recognize is dropped rather than failing the check. Terminal activity is counted and inspection warnings appear only for activity that could not be checked.
      - Local desktop restarts skip confirmation only when every owned backend check succeeds and no work would be interrupted; resumable turns are allowed, while running or unknown terminal activity, waiting requests, non-continuable turns, provider installs and shared devices require confirmation. Quit still confirms active or resumable work because continuation waits until the next launch. Cancellation preserves windows and downloaded updates.
      - Shutdown confirmation has one renderer-wide host, including on recovery screens; cancelling an update restart dismisses the request without reopening it. Failed presentation alone arms a subsequent Quit override that preserves cleanup, cannot be consumed by restart actions, and clears when the renderer recovers or displays a dialog.
      - Available desktop updates download automatically while preserving accurate available, downloading, downloaded, install, and retry state across updater events and pre-install refreshes.
      - Downloaded updates install on normal app quit; the sidebar offers a plain restart arrow without a completion checkmark, using the theme update surface and foreground once an installer is ready, while Settings presents automatic checks and downloads as status and reserves download actions for failure retries.
      - An install on quit records its target version like an in-app install, so a restart on the old version reports that the update did not apply, and quitting never retries a version whose install did not apply.
      - The sidebar update pass checks affected remote servers and every backend hosted by this app before deciding whether confirmation is needed, while the sidebar update control shows a spinner. Safe results proceed directly; otherwise one dialog lists thread names by environment/project with continuation outcomes and remaining interruption warnings. Explicit consent covers the matching downloaded local version; without consent, remote activity is checked again after provider installations and local activity before handoff. Later checks stay silent unless they find work requiring consent. Remote handoffs run in parallel and the local restart follows immediately, without a countdown.
      - Combined update confirmations record one exposure and at most one explicit decision after inspection requires confirmation through a compatible paired environment, without thread, environment, version or project content. Loading checks and automatic safe updates emit no confirmation events.
      - A downloaded update remains visible in the sidebar during rechecks, with restart temporarily disabled and release notes retained until the check settles.
      - A late native window-close event cannot bypass cleanup and the selected-channel installer handoff after scoped lifecycle listeners are removed.
      - Changing update channels clears installation eligibility; only a ready download from the selected channel may install on quit.
      - On macOS a selected-channel download is staged with Squirrel.Mac once, right after it downloads, when the app can be replaced without administrator rights; checks continue while it waits, and a newer selected-channel release discards it before downloading and staging the newer one, keeping it if its ShipIt job cannot be removed; quit installs a staged update only if it is still the selected-channel download. A failed background staging, or an app that needs administrator rights, stages at quit or restart as before, and a restart whose staging fails or finds no update recovers instead of waiting. Every channel change waits for staging, removes any user ShipIt job, including one left by an earlier process, and clears the download, and fails without changing channels if the job cannot be removed; after that, an update installs only once a new download stages.
      - Remote desktop updates reuse the automatic-download reservation and recover failed installations without bypassing local manual-restart confirmation or install-on-quit behavior. Web and mobile inspect every backend owned by the target desktop app, including sibling WSL environments. Only completely checked idle or resumable pools skip confirmation. Pool reports require maintenance permission and expose anonymous interruption counts. Selected-environment thread details come from its authorized activity request and replace exactly one identified primary pool entry; missing or ambiguous coverage retains readable details and requires confirmation. Unconfirmed desktop and service updates recheck before handoff, refusing new blockers while retaining the download for an explicitly confirmed retry; omitted consent never permits interruptions.
      - On macOS, while a background-staged selected-channel update waits, the app checks every 30 seconds whether an idle restart could install it - system idle for five minutes or screen locked, no update action or quit under way, and every owned backend checked with no waiting approval or question, running turn that thread continuation will not resume, provider install, or other environment using its devices; resumable turns and terminal commands do not hold it back. It is measure-only - it never installs or shows anything - and reports once per staged version the delay since staging (under 1, 1-8, 8-24 or over 24 hours) at the first such moment, "installed_first" when a quit or the restart button installed it before one, or "never" when a channel change or a newer release discards it or the app quits without installing it; the quit cases are reported on the next launch.
      - Each desktop launch reports, once its main window first shows, the time from the process start to the local backend being ready and to the window showing. After an update restart, the launch of the installed version adds how long the old process took to stop its backends before the installer handoff, the time from that handoff to the new process starting, and on macOS whether the update was staged in the background; a launch that comes back on the old version reports as a normal launch.
      - Update summaries retain skipped environment reasons, including late skips and across desktop relaunch.
