  - id: provider-stall-detection
    title: Record and surface suspected provider stalls
    status: maintained
    prs: []
    invariants:
      - A server-owned monitor records prolonged startup and provider silence once per attempt and inactivity episode, independently of provider streams, clients, and blocked effect lanes.
      - Known tools, child agents, pending requests, background work, and retry waits suppress warnings; streamed text and reasoning refresh activity without hiding a later freeze, and diagnostic notices never refresh provider activity.
      - Detection commits only while the same run attempt, phase, and activity observation remain current; queued time and superseded attempt activity do not count toward startup or progress.
      - Durable notices reach web, desktop, mobile, and agent thread reads, clear on activity or known work or run termination, and retain incident history without automatically interrupting or replaying provider work.
      - Telemetry records detection and clearance outcomes with provider type, phase, and durations, without thread identifiers, prompts, output, commands, paths, or configured provider names, and honors the existing telemetry opt-out.
    rationale: Silent provider stalls may never emit a terminal event, so completion analytics alone omit them. Local incident evidence and a shared warning make these failures visible while preserving long-running tools and avoiding duplicate external actions from automatic retries.
