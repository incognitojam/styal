name: Fork CI

# The inherited CI workflow (ci.yml) targets upstream-owned Blacksmith runners
# and stays disabled in this fork. This fork-owned copy exists so runner choice
# is ours to make per job: the repository is public, so GitHub-hosted runners
# are free, so this fork uses GitHub-hosted runners throughout.
on:
  pull_request:
  push:
    branches:
      - main
      - "intake/**"

permissions:
  contents: read

concurrency:
  group: fork-ci-${{ startsWith(github.ref, 'refs/heads/intake/') && github.ref || github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/intake/') }}

jobs:
  changes:
    name: Fork Changes
    if: github.repository == 'incognitojam/t3code' || github.repository == 'incognitojam/styal'
    runs-on: ubuntu-24.04
    outputs:
      run_ci: ${{ steps.filter.outputs.run_ci }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect non-documentation changes
        id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ "$GITHUB_REF" == refs/heads/intake/* ]]; then
            git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
            BASE_SHA=refs/remotes/origin/main
          fi

          run_ci=true
          changed_files="$RUNNER_TEMP/fork-ci-changed-files.txt"

          if git rev-parse --verify "$BASE_SHA^{commit}" >/dev/null 2>&1 &&
            git rev-parse --verify "$HEAD_SHA^{commit}" >/dev/null 2>&1 &&
            git diff --name-only "$BASE_SHA...$HEAD_SHA" > "$changed_files"
          then
            run_ci=false
            while IFS= read -r changed_file; do
              case "$changed_file" in
                *.md | docs/*) ;;
                *) run_ci=true; break ;;
              esac
            done < "$changed_files"
          else
            echo "Could not classify changed files; running full CI."
          fi

          echo "run_ci=$run_ci" >> "$GITHUB_OUTPUT"

  intake:
    name: Fork Intake Audit
    if: (github.repository == 'incognitojam/t3code' || github.repository == 'incognitojam/styal') && startsWith(github.ref, 'refs/heads/intake/')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Fetch main and upstream
        run: |
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          git fetch --no-tags https://github.com/pingdotgg/t3code.git '+refs/heads/main:refs/remotes/upstream/main'

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: false
          run-install: |
            args:
              - --filter=@t3tools/scripts...

      - name: Audit upstream intake candidate
        id: audit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          vp run --filter @t3tools/scripts intake:check -- \
            --base refs/remotes/origin/main \
            --head "$GITHUB_SHA"

  check:
    name: Fork Check
    needs: changes
    if: needs.changes.outputs.run_ci == 'true'
    # This job normally finishes before the server and workspace test suites,
    # so the public repository's free GitHub-hosted capacity keeps the overall
    # CI critical path unchanged.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # github.sha is the synthetic merge commit for pull_request runs.
          ref: ${{ github.sha }}
          fetch-depth: 0
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup cached dependencies
        uses: ./.github/actions/setup-deps

      - name: Review pull request overlap with fork features
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail

          changed_paths="$RUNNER_TEMP/pull-request-changed-paths.txt"
          git diff --name-only --no-renames \
            "$BASE_SHA...HEAD" > "$changed_paths"
          vp run --filter @t3tools/scripts ledger:check -- --changed-paths "$changed_paths"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Ensure Electron runtime is installed
        run: vp run --filter @t3tools/desktop ensure:electron

      - name: Install browser secret helper build libraries
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev pkg-config

      # Files/dependencies are repo-wide; export checks cover clean workspaces only.
      - name: Check unused code
        run: vp run knip:check

      - name: Check
        run: vp check

      - name: Test nightly release checks
        run: node --test .github/scripts/check-nightly-release.test.cjs

      - name: Check fork feature ledger
        run: vp run --filter @t3tools/scripts ledger:check

      - name: Check upstream migration history
        run: |
          git fetch --no-tags https://github.com/pingdotgg/t3code.git '+refs/heads/main:refs/remotes/upstream/main'
          vp run --filter @t3tools/scripts migrations:check

      - name: Typecheck
        run: vpr typecheck

      - name: Check Rust formatting
        run: |
          for crate in resource-monitor kde-snap-shot hyprland-snap-shot; do
            cargo fmt --manifest-path "native/$crate/Cargo.toml" -- --check
          done

      - name: Build desktop pipeline
        run: vp run build:desktop

      - name: Verify preload bundle output
        run: node apps/desktop/scripts/verify-preload-bundle.mjs

  test_server:
    name: Fork Test (Server ${{ matrix.shard }}/${{ strategy.job-total }})
    needs: changes
    if: needs.changes.outputs.run_ci == 'true'
    # Bound file parallelism to leave a core for Vite and subprocesses. Keep
    # isolated fork workers: the native server dependencies cannot use threads.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup test dependencies
        uses: ./.github/actions/setup-deps

      - name: Test server
        env:
          T3CODE_TRANSFER_BUDGET_REPORT_PATH: ${{ runner.temp }}/styal-transfer-budget.md
          T3CODE_TRANSFER_BUDGET_RESULT_PATH: ${{ runner.temp }}/thread-transfer-result.json
        run: vp run --filter ./apps/server test --fileParallelism --maxWorkers=3 --shard ${{ matrix.shard }}/${{ strategy.job-total }}

      # src/server.test.ts writes the budget report, so exactly one shard
      # produces these files. Gating the upload on their presence keeps a
      # single `thread-transfer-results` artifact per run, which is the name
      # thread-transfer-report.yml resolves.
      - name: Detect transfer budget report
        id: transfer_budget
        if: always()
        run: |
          if test -f "${{ runner.temp }}/thread-transfer-result.json"; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish transfer budget report
        if: always() && steps.transfer_budget.outputs.present == 'true'
        run: |
          if test -f "${{ runner.temp }}/styal-transfer-budget.md"; then
            tee -a "$GITHUB_STEP_SUMMARY" < "${{ runner.temp }}/styal-transfer-budget.md"
          else
            echo "Transfer budget report was not produced." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload thread transfer result
        if: always() && steps.transfer_budget.outputs.present == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: thread-transfer-results
          path: ${{ runner.temp }}/thread-transfer-result.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Fetch previous fork nightly
        if: matrix.shard == 1
        run: git fetch --no-tags origin '+refs/heads/nightly:refs/remotes/origin/nightly'

      - name: Test previous nightly schema upgrade
        if: matrix.shard == 1
        run: vp run --filter ./apps/server test:nightly-upgrade -- origin/nightly

  test_server_required:
    name: Fork Test (Server)
    needs: [changes, test_server]
    if: ${{ !cancelled() && needs.changes.outputs.run_ci == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Require every server shard to pass
        run: test '${{ needs.test_server.result }}' = success

  test_workspace:
    name: Fork Test (Workspace ${{ matrix.suite }})
    needs: changes
    if: needs.changes.outputs.run_ci == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: Web 1/2
            shard: 1/2
            # Use spare web-shard capacity instead of adding more runners.
            filters: --filter './packages/client-runtime'
          - suite: Web 2/2
            shard: 2/2
            native: true
          - suite: Clients
            filters: --filter './apps/desktop' --filter './apps/mobile'
          - suite: Other
            # Keep the remainder open-ended so new workspaces are tested too.
            filters: >-
              --filter './apps/*'
              --filter './infra/*'
              --filter './packages/*'
              --filter './oxlint-plugin-t3code'
              --filter './scripts'
              --filter '!./apps/server'
              --filter '!./apps/web'
              --filter '!./apps/desktop'
              --filter '!./apps/mobile'
              --filter '!./packages/client-runtime'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup test dependencies
        uses: ./.github/actions/setup-deps

      - name: Setup Rust
        if: matrix.native
        uses: dtolnay/rust-toolchain@stable

      - name: Ensure Electron runtime is installed
        if: matrix.suite == 'Clients'
        run: vp run --filter @t3tools/desktop ensure:electron

      - name: Install browser secret helper build libraries
        if: matrix.suite == 'Clients'
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev pkg-config

      - name: Test web shard
        if: matrix.shard
        run: |
          vp run --filter @t3tools/web test \
            --exclude '**/imageCompression.test.ts' \
            --pool=threads --maxWorkers=3 \
            --shard ${{ matrix.shard }} \
            --reporter=default \
            --reporter="$GITHUB_WORKSPACE/scripts/vitest-ci-exit-reporter.ts"

      - name: Test workspace packages
        if: matrix.filters
        run: |
          # At most two packages with two workers each on a four-core runner.
          vp run \
            --parallel --concurrency-limit 2 \
            ${{ matrix.filters }} \
            test \
            --pool=threads --maxWorkers=2 \
            --reporter=default \
            --reporter="$GITHUB_WORKSPACE/scripts/vitest-ci-exit-reporter.ts"

      - name: Test image compression
        if: matrix.native
        run: |
          vp run --filter @t3tools/web test src/lib/imageCompression.test.ts \
            --no-file-parallelism \
            --maxWorkers=1 \
            --reporter=default \
            --reporter="$GITHUB_WORKSPACE/scripts/vitest-ci-exit-reporter.ts"

      - name: Test Rust crates
        if: matrix.native
        run: |
          for crate in resource-monitor kde-snap-shot hyprland-snap-shot; do
            cargo test --locked --manifest-path "native/$crate/Cargo.toml"
          done

  test_workspace_required:
    name: Fork Test (Workspace)
    needs: [changes, test_workspace]
    if: ${{ !cancelled() && needs.changes.outputs.run_ci == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Require every workspace shard to pass
        run: test '${{ needs.test_workspace.result }}' = success

  # The static analysis below needs a macOS runner, which GitHub allows only a
  # few of at once, so gate it on the native sources it actually lints instead
  # of running it on every push. Detection is API-only (no checkout) and fails open: if
  # the diff cannot be resolved, the lint runs.
  mobile_native_changes:
    name: Fork Mobile Native Changes
    if: github.repository == 'incognitojam/t3code' || github.repository == 'incognitojam/styal'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      changed: ${{ steps.detect.outputs.changed }}
    steps:
      - name: Detect mobile native changes
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -uo pipefail

          fail_open() {
            echo "$* Running native static analysis."
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          }

          count_rows() {
            printf '%s\n' "$1" | grep -c . || true
          }

          # One row per changed file, holding the new path and, for a rename,
          # the path it replaced: renaming a matched file out of the matched
          # paths removes a lint input just like editing it.
          row='[.filename, (.previous_filename // empty)] | @tsv'

          if [[ -n "${PR_NUMBER}" ]]; then
            # The PR files endpoint stops at 3000 files and pagination cannot
            # extend it, so cross-check against the count the PR itself reports.
            expected=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.changed_files') \
              || fail_open "Could not read the pull request."
            rows=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" --paginate --jq ".[] | ${row}") \
              || fail_open "Could not resolve changed files."

            listed=$(count_rows "$rows")
            if [[ "$listed" -lt "$expected" ]]; then
              fail_open "GitHub listed only ${listed} of ${expected} changed files."
            fi
          else
            rows=$(gh api "repos/${GITHUB_REPOSITORY}/compare/${BEFORE_SHA}...${GITHUB_SHA}" --jq ".files[]? | ${row}") \
              || fail_open "Could not resolve changed files."

            # The compare endpoint reports at most 300 files and pagination does
            # not extend that list, so a full list may be hiding native changes.
            listed=$(count_rows "$rows")
            if [[ "$listed" -ge 300 ]]; then
              fail_open "GitHub listed ${listed} changed files, the compare endpoint maximum."
            fi
          fi

          paths=$(tr '\t' '\n' <<< "$rows")

          # Sources scripts/mobile-native-static-check.ts lints, plus the tool
          # and rule configuration that decides how it lints them, plus the
          # root package.json that defines the lint:mobile command.
          pattern='^apps/mobile/.*\.(swift|kt|kts)$|^apps/mobile/(\.swiftlint\.yml|detekt\.yml|\.editorconfig|Brewfile)$|^scripts/mobile-native-static-check\.ts$|^package\.json$|^\.github/workflows/fork-ci\.yml$'

          if grep -qE "$pattern" <<< "$paths"; then
            echo "Native sources or lint configuration changed:"
            grep -E "$pattern" <<< "$paths"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No mobile native sources or lint configuration changed."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  mobile_native_static_analysis:
    name: Fork Mobile Native Static Analysis
    needs: mobile_native_changes
    # Skip only on an explicit "no": a gate job that failed or errored leaves the
    # output empty, and that must run the lint rather than silently skip it. A
    # skipped gate (outside this repository) skips the lint too.
    if: ${{ !cancelled() && needs.mobile_native_changes.result != 'skipped' && needs.mobile_native_changes.outputs.changed != 'false' }}
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: false
          run-install: |
            args:
              - --filter=@t3tools/scripts...

      - name: Install mobile native static analysis tools
        run: brew bundle install --file apps/mobile/Brewfile

      - name: Lint mobile native sources
        run: vp run lint:mobile

  release_smoke:
    name: Fork Release Smoke
    needs: changes
    if: needs.changes.outputs.run_ci == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: false
          run-install: |
            args:
              - --filter=@t3tools/scripts...

      - name: Exercise release-only workflow steps
        run: node scripts/release-smoke.ts
