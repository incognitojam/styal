  - id: device-idle-shutdown
    title: Hand devices back on demand and shut down unused simulators
    status: maintained
    prs: [832, 887]
    invariants:
      - device_close releases every agent-device session device_open handed the thread for that device, recorded when each was handed out (so an Android AVD that boots under a new id still releases), and leaves the device booted. Unconfirmed releases are retried per session name on the next hand-over or power-off without blocking cleanup of other names; a missing session after failed cleanup remains uncertain across reopen until a successful release or stopped daemon confirms it.
      - When an agent opens a device nobody is watching, other local threads' holds on it are released if their thread is not working. Connected environments' holds are not reclaimed. device_open prefers a free device and takes an idle-held one only when none is free. An agent open of a device that a working thread holds, someone watches, or another environment holds fails with DeviceHeldError naming those threads unless it passes takeOver, which releases every local holder's hold and shares the device with connected environments' holders. Opening a device from the Device panel never takes it from an agent or is refused, and holds are never released on a timer.
      - The sweep closes sessions of archived threads, and agent holds of deleted threads. A Device panel session from a thread the projections do not know stays, since it may be a draft's.
      - A session handed back or over is refused by the agent-device launcher, with a message to call device_open, until device_open hands it out again; agent-device itself does not stop a released session driving the device by its selector.
      - Lifecycle work on one device is serialized, an Android device by AVD name across its boot, so a reopen waits for a hand-over or release in progress. Hand-over happens within an environment, not across connected environments.
      - Powering a device off, by close, shutdown, or the sweep, first releases every agent's claim on it, including connected environments' claims named from the peer environment id, and forgets the device's boot record. Revoking a peer's grant on the device environment closes that peer's sessions.
      - Only devices this environment booted are shut down, only once no working thread holds them and nobody has streamed them for the configured idle period, and that record survives server restarts. A device shut down or replaced outside styal is forgotten when its host is next listed.
      - The sweep starts the local hub when needed, so devices left running across a restart still stop, but acts on SSH hosts only while they are connected and leaves devices from a connected environment to that environment.
      - "`deviceIdleShutdownMinutes` defaults to 10 and `null` turns shutdown off; web and mobile settings edit it per environment. Hand-back has no setting."
    rationale: Agents sharing a machine's devices rarely release them, and the daemon owning their claims never exits while the server runs, so claims never go stale and unused simulators hold memory. Hand-back is on demand rather than timed because agent-device lets a released agent keep driving a device by its selector, which a timer cannot track, and it avoids re-setting up devices nobody else needs. The feature wraps `DeviceService` from its own layer and reaches upstream files only through small hooks.
    implementation_paths:
      - .agents/skills/test-styal-mobile/SKILL.md
      - apps/mobile/src/features/settings/SettingsDevicesRouteScreen.tsx
      - apps/server/src/device/AgentDeviceShim.ts
      - apps/server/src/device/DeviceIdle.ts
      - apps/server/src/device/DeviceSharing.ts
      - apps/server/src/device/DeviceSharingHttp.ts
      - apps/web/src/components/settings/DeviceIdleShutdownSetting.tsx
      - packages/contracts/src/deviceIdleShutdown.ts
    upstream_paths:
