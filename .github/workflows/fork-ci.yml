name: Fork CI

# The inherited CI workflow uses upstream-owned Blacksmith runners and remains
# disabled in this fork. Keep this fork-owned copy on GitHub-hosted runners.
on:
  pull_request:
  merge_group:
    types:
      - checks_requested
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: fork-ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Fork Changes
    if: github.repository == 'yngatech/t3code'
    runs-on: ubuntu-24.04
    outputs:
      run_ci: ${{ steps.filter.outputs.run_ci }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect non-documentation changes
        id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
        run: |
          run_ci=true
          changed_files="$RUNNER_TEMP/fork-ci-changed-files.txt"

          if git rev-parse --verify "$BASE_SHA^{commit}" >/dev/null 2>&1 &&
            git rev-parse --verify "$HEAD_SHA^{commit}" >/dev/null 2>&1 &&
            git diff --name-only "$BASE_SHA...$HEAD_SHA" > "$changed_files"
          then
            run_ci=false
            while IFS= read -r changed_file; do
              case "$changed_file" in
                *.md | docs/*) ;;
                *) run_ci=true; break ;;
              esac
            done < "$changed_files"
          else
            echo "Could not classify changed files; running full CI."
          fi

          echo "run_ci=$run_ci" >> "$GITHUB_OUTPUT"

  upstream_rebase:
    name: Fork Upstream Rebase
    # Every commit here joins the patch stack that Fork Nightly rebases onto
    # upstream before each release, so fail fast when the stack no longer
    # applies cleanly. Runs even for docs-only changes; those rebase too.
    if: github.repository == 'yngatech/t3code'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # github.sha is the synthetic merge commit for pull_request runs.
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Rebase patch stack onto upstream
        run: source .github/scripts/rebase-onto-upstream.sh

  check:
    name: Fork Check
    needs: changes
    if: needs.changes.outputs.run_ci == 'true'
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # github.sha is the synthetic merge commit for pull_request runs.
          ref: ${{ github.sha }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Ensure Electron runtime is installed
        run: vp run --filter @t3tools/desktop ensure:electron

      - name: Check
        run: vp check

      - name: Typecheck
        run: vpr typecheck

      - name: Check resource monitor formatting
        run: cargo fmt --manifest-path native/resource-monitor/Cargo.toml -- --check

      - name: Build desktop pipeline
        run: vp run build:desktop

      - name: Verify preload bundle output
        run: |
          test -f apps/desktop/dist-electron/preload.cjs
          grep -nE "desktopBridge|getLocalEnvironmentBootstrap|PICK_FOLDER_CHANNEL|wsUrl" apps/desktop/dist-electron/preload.cjs
          grep -n "__clerk_internal_electron_passkeys" apps/desktop/dist-electron/preload.cjs

  test:
    name: Fork Test
    needs: changes
    if: needs.changes.outputs.run_ci == 'true'
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Ensure Electron runtime is installed
        run: vp run --filter @t3tools/desktop ensure:electron

      - name: Test
        run: |
          vp run -r test --exclude '**/imageCompression.test.ts'
          vp run --filter @t3tools/web test src/lib/imageCompression.test.ts \
            --no-file-parallelism \
            --maxWorkers=1

      - name: Test resource monitor
        run: cargo test --locked --manifest-path native/resource-monitor/Cargo.toml

  release_smoke:
    name: Fork Release Smoke
    needs: changes
    if: needs.changes.outputs.run_ci == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/scripts...

      - name: Exercise release-only workflow steps
        run: node scripts/release-smoke.ts

  required:
    name: Fork CI Required
    needs:
      - changes
      - upstream_rebase
      - check
      - test
      - release_smoke
    if: always() && github.repository == 'yngatech/t3code'
    runs-on: ubuntu-24.04
    steps:
      - name: Verify required jobs
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          UPSTREAM_REBASE_RESULT: ${{ needs.upstream_rebase.result }}
          CHECK_RESULT: ${{ needs.check.result }}
          TEST_RESULT: ${{ needs.test.result }}
          RELEASE_SMOKE_RESULT: ${{ needs.release_smoke.result }}
        run: |
          test "$CHANGES_RESULT" = success
          test "$UPSTREAM_REBASE_RESULT" = success
          test "$CHECK_RESULT" = success -o "$CHECK_RESULT" = skipped
          test "$TEST_RESULT" = success -o "$TEST_RESULT" = skipped
          test "$RELEASE_SMOKE_RESULT" = success -o "$RELEASE_SMOKE_RESULT" = skipped
