  - id: server-update-guidance
    title: Match server update instructions to the advertised capability
    status: maintained
    prs: [351, 623]
    invariants:
      - Normal managed services retain the direct in-app Update action in chat and Connections settings.
      - Manual update instructions reserve service update for detected legacy services; absent update capability is treated as an unknown installation, with serve qualified for terminal launches and service or container users directed to their existing deployment method.
      - Foreground start commands are labeled as starts and preserve guidance to reuse the existing data directory and startup options rather than implying that launching another process updates a running server.
      - A foreground server that proves it runs from a global npm install of `@styal/cli` (the prefix's `bin/styal` resolves to the running launcher, and the platform executable matches the launcher version) advertises that prefix, and its instructions copy `npm install --global --prefix '<prefix>' @styal/cli@<version>`; servers started by npx, pnpm dlx, or bunx get `serve` through the same runner, and unproven installs, including Windows, keep the npx `serve` start command. The service migration command does not change with the installation.
      - In-app server updates check host activity while the Update control shows a spinner and stays disabled; a dialog opens only when confirmation is needed. Idle servers and servers whose running threads will all resume update without a dialog, while waiting threads, turns that cannot resume, running terminal commands, or a failed check require confirmation; cancelling leaves the server running.
      - Mobile environment updates check host activity while the Update row shows progress, then confirm in a sheet that lists the affected threads by project only when confirmation is needed; dismissing the sheet cancels the update.
      - Activity checks skip detailed continuation recovery reads for idle or waiting threads and projects with continuation disabled, respecting project overrides before loading thread recovery state while retaining settled threads with live background work.
      - Overlapping host activity checks within a client share the in-flight request per environment, including retries after cancelling an update dialog; completion or failure clears the shared request so later checks read fresh activity.
      - When thread continuation is requested, the confirmation says a thread will continue only if the same selection the continuation step uses includes it; every other active thread is described as interrupted.
      - A turn the restart cut short is recorded as interrupted before its continuation turn starts, rather than closed as completed when the resumed session reports ready.
    rationale: The fork confirms in-app server updates against host activity, so an update never interrupts running work without asking, and its manual instructions match how the server was actually installed. Waking settled threads whose monitors, subagents, or background tasks a restart stopped is now upstream's behaviour, including leaving background shells for the next user message.
    implementation_paths:
