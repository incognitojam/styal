  - id: data-import-from-t3-code
    title: T3 Code migration in setup and Settings
    status: review-needed
    prs: [294, 297, 298, 300, 306, 347, 349, 379, 478, 842]
    rationale: Upstream V2 supplies canonical orchestration and messages-only automatic V1 migration, but the maintained T3 import flow must retain full recorded history and costs. The batch explicitly preserves these values, converts V1 history at the boundary, imports native V2 projections through inert canonical events, and materializes unavailable fork ancestors.
    invariants:
      - Import previews on web and desktop keep last-active ages counting while the same projects remain displayed.
      - A selected styal environment can preview and import projects, missing threads, attachments, provider continuations, and supported server preferences from a live T3 Code database, including older fork databases, without modifying the source.
      - Existing styal project configuration wins while each imported thread and its verified attachments commit atomically, so interrupted or repeated imports resume without duplication.
      - Credentials, connections, provider sign-ins, active sessions, and client-local preferences remain isolated, while affected earlier imports can restore provider context only after their loaded sessions stop.
      - Discovered computers connect only after explicit selection; discovery refreshes preserve deselection, and incompatible computers cannot be selected.
      - Setup offers T3 Code migration or CLI history as separate choices; Settings exposes only T3 Code migration and never starts CLI history scans. T3 migration shares components and commands between both entry points.
      - Automatic hosted setup waits for live workspace state and does not offer agent or import steps for selected computers that already contain projects or threads; explicit /welcome visits retain the complete flow.
      - Projects and optional Preferences are top-level setup steps with stable dimensions; Preferences is discovered on selected computers during Agents and omitted when no values differ, independently of the project source. Settings keeps one import page; switching steps or computers preserves selections, setup stays scoped to selected computers, and differing preferences start selected with an opt-out per computer. Setup imports each step as it is left, so projects land before Preferences opens and either step can be skipped without discarding the other. In-progress imports show remaining work and confirmed completion per computer; CLI history shows queued, importing, completed, and failed projects.
      - Imported user prompts stay linked to their root provider turns through derived thread.turn-prompt-linked events, so live, coalesced, replayed, and windowed thread-detail reads keep showing them; already-imported projects without those events reappear as repairable.
      - Partial imports keep failed work selected for retry and clear completed selections; pending imports remain locked across Settings remounts, and leaving the page prevents subsequent requests in the batch.
      - V1 and native V2 source imports retain complete messages, structured tool and plan history, checkpoint metadata and associations, and recorded token and cost history without repricing; projection compaction and rebuild preserve the imported result.
      - V1 runtime bookkeeping that the V1 work log never displayed (context window, turn usage, plan, checkpoint, task lifecycle, setup-script start, subagent progress, and bare tool-start activity) does not become turn items; informational activity imports as neutral notifications with its recorded summary, compactions as compaction items, and only warnings and errors as system notices; a tool's status comes from its completion rather than a later in-progress update; imported history is ordered by time between the thread's messages rather than after them. Converted items keep their recorded content, including complete command output and exit codes, in canonical fields and only a reference to each V1 activity; the V1 source keeps the payloads. Fork migrations 7 and 9 bring earlier imports in line, a one-time pass after startup slims items imported before references, and each moves the history rewrite fence so cached clients refresh.
      - Startup history repairs index their temporary event lookups so upgrading large imported histories does not repeatedly scan every repair for each event.
      - Legacy history metadata rewrites preserve JSON byte alignment where possible, avoiding writes of unchanged SQLite overflow pages; ordering updates preserve each historical event's own payload. Ordering and slimming restrict lookups to the requested threads and V2 events, and ordering writes bounded pages of payload edits together.
      - Imported native V2 sessions remain stopped while durable native conversation references remain resumable; process sessions, pending effects, and runtime requests never migrate.
      - Resuming imported V1 history records a context handoff on its receiving run, including the selected target model and available source metadata, even before any V2 run has completed. Web, desktop, and mobile silently restore completed imported context when no provider change is known; provider and account switches, including those on the first restored turn, and unsuccessful restoration remain visible.
      - Fork imports retain history through the chosen source run even when ancestors are deleted, excluded, not yet imported, or fail during the batch. Materialized history keeps original fork lineage and never duplicates when an ancestor is imported later.
    implementation_paths:
      - apps/server/src/dataImport/LegacyHistoryWriter.ts
      - apps/server/src/dataImport/LegacyImport.ts
      - apps/server/src/dataImport/LegacyImportPreferences.ts
      - apps/server/src/dataImport/LegacyImportPreview.ts
      - apps/server/src/dataImport/LegacyImportTurnPromptLinks.ts
