name: Set up test dependencies
description: Restore installed dependencies so test runners avoid repeating pnpm linking and lifecycle scripts.
runs:
  using: composite
  steps:
    - uses: voidzero-dev/setup-vp@v1
      with:
        node-version-file: package.json
        cache: false
        run-install: false

    - name: Resolve dependency cache key
      id: key
      shell: bash
      env:
        DEPENDENCY_HASH: ${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', '.npmrc', 'package.json', 'apps/*/package.json', 'packages/*/package.json', 'infra/*/package.json', 'scripts/package.json', 'oxlint-plugin-t3code/package.json', 'patches/**', 'scripts/clean-tsgo-backups.mjs', '.github/actions/setup-test-deps/action.yml') }}
      # Compute once before restore. Re-evaluating a recursive manifest glob in
      # the cache post-step traverses node_modules and costs tens of seconds.
      run: echo "value=test-deps-v1-${{ runner.os }}-${{ runner.arch }}-node-$(node -p 'process.versions.node')-$DEPENDENCY_HASH" >> "$GITHUB_OUTPUT"

    - name: Restore installed dependencies
      id: dependencies
      uses: actions/cache@v6
      with:
        path: |
          node_modules
          apps/*/node_modules
          packages/*/node_modules
          infra/*/node_modules
          scripts/node_modules
          oxlint-plugin-t3code/node_modules
        # Native dependencies and the patched tsgo binary must match this host
        # and the complete dependency/patch graph. Only exact hits skip install.
        key: ${{ steps.key.outputs.value }}

    - name: Install dependencies
      if: steps.dependencies.outputs.cache-hit != 'true'
      shell: bash
      run: vp install --frozen-lockfile
