      - Device instructions use the session's MCP namespace and only appear with device access, while provider subprocesses retain their per-session environment overrides.
      - Every provider's orchestration instructions, including Claude's system prompt and Pi's bridge, name the session's MCP namespace and call the product styal; advertised MCP tool descriptions, MCP error messages, preview browser install errors and the context handoff preface say styal instead of T3 Code or T3, while tool names and identifiers keep their upstream `t3_` form.
