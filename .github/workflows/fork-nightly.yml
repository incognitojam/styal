name: Fork Nightly

on:
  pull_request:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:
    inputs:
      force_notarization:
        description: Ignore an active Apple notarization submission
        required: false
        type: boolean
        default: false
      dry_run:
        description: >-
          Run the full pipeline even without new changes, but leave the
          release as an unpublished draft and skip nightly promotion
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  id-token: none

concurrency:
  group: fork-nightly-${{ github.event.pull_request.number || 'publish' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  prepare:
    name: Upstream compatibility
    if: github.repository == 'yngatech/t3code'
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 40
    outputs:
      has_changes: ${{ steps.candidate.outputs.has_changes }}
      ref: ${{ steps.candidate.outputs.ref }}
      fork_ref: ${{ steps.candidate.outputs.fork_ref }}
      upstream_ref: ${{ steps.candidate.outputs.upstream_ref }}
      version: ${{ steps.release_meta.outputs.version }}
      tag: ${{ steps.release_meta.outputs.tag }}
      release_name: ${{ steps.release_meta.outputs.name }}
      previous_tag: ${{ steps.previous_tag.outputs.previous_tag }}
    steps:
      - name: Checkout fork patch stack
        uses: actions/checkout@v6
        with:
          token: ${{ github.event_name == 'pull_request' && github.token || secrets.FORK_RELEASE_TOKEN }}
          ref: ${{ github.event_name == 'pull_request' && github.sha || 'main' }}
          fetch-depth: 0
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - id: candidate
        name: Rebase candidate onto upstream
        shell: bash
        env:
          DRY_RUN: ${{ inputs.dry_run == true }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/pingdotgg/t3code.git
          fork_ref=$(git rev-parse HEAD)
          git fetch --no-tags upstream main
          upstream_ref=$(git rev-parse FETCH_HEAD)
          git fetch origin '+refs/heads/nightly:refs/remotes/origin/nightly' || true
          git fetch origin \
            '+refs/heads/nightly-candidate:refs/remotes/origin/nightly-candidate' || true

          git switch -C nightly-candidate HEAD
          git rebase "$upstream_ref"

          candidate_ref=$(git rev-parse HEAD)
          has_changes=true
          if [[ "$GITHUB_EVENT_NAME" != "pull_request" ]] && \
            [[ "$DRY_RUN" != "true" ]] && \
            git rev-parse --verify refs/remotes/origin/nightly >/dev/null 2>&1 && \
            git diff --quiet origin/nightly HEAD --; then
            has_changes=false
          fi

          {
            echo "has_changes=$has_changes"
            echo "ref=$candidate_ref"
            echo "fork_ref=$fork_ref"
            echo "upstream_ref=$upstream_ref"
          } >> "$GITHUB_OUTPUT"

      - name: Setup Vite+
        if: steps.candidate.outputs.has_changes == 'true'
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Ensure Electron runtime is installed
        if: steps.candidate.outputs.has_changes == 'true'
        run: vp run --filter @t3tools/desktop ensure:electron

      - name: Setup Rust
        if: steps.candidate.outputs.has_changes == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Check
        if: steps.candidate.outputs.has_changes == 'true'
        run: vp check

      - name: Typecheck
        if: steps.candidate.outputs.has_changes == 'true'
        run: vp run typecheck

      - name: Build desktop pipeline
        if: steps.candidate.outputs.has_changes == 'true'
        run: vp run build:desktop

      - name: Verify preload bundle output
        if: steps.candidate.outputs.has_changes == 'true'
        run: |
          test -f apps/desktop/dist-electron/preload.cjs
          grep -nE "desktopBridge|getLocalEnvironmentBootstrap|PICK_FOLDER_CHANNEL|wsUrl" apps/desktop/dist-electron/preload.cjs
          grep -n "__clerk_internal_electron_passkeys" apps/desktop/dist-electron/preload.cjs

      - name: Test
        if: steps.candidate.outputs.has_changes == 'true'
        run: |
          vp run -r test --exclude '**/imageCompression.test.ts'
          vp run --filter @t3tools/web test src/lib/imageCompression.test.ts \
            --no-file-parallelism \
            --maxWorkers=1

      - name: Test resource monitor
        if: steps.candidate.outputs.has_changes == 'true'
        run: cargo test --locked --manifest-path native/resource-monitor/Cargo.toml

      - id: release_meta
        name: Resolve nightly version
        if: >-
          github.event_name != 'pull_request' &&
          steps.candidate.outputs.has_changes == 'true'
        shell: bash
        env:
          CANDIDATE_REF: ${{ steps.candidate.outputs.ref }}
          NIGHTLY_RUN_NUMBER: ${{ github.run_number }}
        run: |
          nightly_date=$(date -u +%Y%m%d)
          node scripts/resolve-nightly-release.ts \
            --date "$nightly_date" \
            --run-number "$NIGHTLY_RUN_NUMBER" \
            --sha "$CANDIDATE_REF" \
            --github-output

      - id: previous_tag
        name: Resolve previous fork nightly
        if: >-
          github.event_name != 'pull_request' &&
          steps.candidate.outputs.has_changes == 'true'
        run: |
          node scripts/resolve-previous-release-tag.ts \
            --channel nightly \
            --current-tag "${{ steps.release_meta.outputs.tag }}" \
            --github-output

      - name: Publish verified candidate
        if: >-
          github.event_name != 'pull_request' &&
          steps.candidate.outputs.has_changes == 'true'
        run: git push --force-with-lease origin HEAD:refs/heads/nightly-candidate

  build_macos:
    name: Build macOS arm64
    needs: prepare
    if: >-
      github.event_name != 'pull_request' &&
      needs.prepare.outputs.has_changes == 'true'
    runs-on: macos-15
    timeout-minutes: 100
    steps:
      - name: Check Apple notarization queue
        if: >-
          github.event_name != 'workflow_dispatch' ||
          inputs.force_notarization != true
        shell: bash
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          umask 077

          required=(APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER)
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required Apple notarization configuration: $name" >&2
              exit 1
            fi
          done

          key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY" > "$key_path"
          history_json=$(xcrun notarytool history \
            --key "$key_path" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER" \
            --output-format json)

          active_submission=$(jq -r '
            .history
            | map(select(
                .name == "T3 Code (yngatech Nightly).zip" and
                .status == "In Progress"
              ))
            | sort_by(.createdDate)
            | last
            | if . == null then empty else [.id, .createdDate] | @tsv end
          ' <<< "$history_json")

          if [[ -n "$active_submission" ]]; then
            IFS=$'\t' read -r submission_id created_date <<< "$active_submission"
            echo "::error title=Apple notarization already in progress::Submission $submission_id from $created_date is still in progress. Wait for Apple to finish, or manually dispatch with force_notarization enabled."
            exit 1
          fi

      - name: Checkout verified candidate
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          fetch-depth: 0
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/desktop...
              - --filter=t3...
              - --filter=@t3tools/scripts...

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Align package versions
        run: node scripts/update-release-package-versions.ts "${{ needs.prepare.outputs.version }}"

      - name: Build signed desktop artifact
        timeout-minutes: 90
        shell: bash
        env:
          T3CODE_DESKTOP_UPDATE_REPOSITORY: ${{ github.repository }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          MACOS_PROVISIONING_PROFILE: ${{ secrets.MACOS_PROVISIONING_PROFILE }}
          T3CODE_CLERK_PASSKEY_RP_DOMAINS: ${{ vars.CLERK_PASSKEY_RP_DOMAINS }}
        run: |
          set -euo pipefail

          required=(
            CSC_LINK
            CSC_KEY_PASSWORD
            APPLE_API_KEY
            APPLE_API_KEY_ID
            APPLE_API_ISSUER
            APPLE_TEAM_ID
            MACOS_PROVISIONING_PROFILE
            T3CODE_CLERK_PASSKEY_RP_DOMAINS
          )
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required Apple signing configuration: $name" >&2
              exit 1
            fi
          done

          key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY" > "$key_path"
          export APPLE_API_KEY="$key_path"

          profile_path="$RUNNER_TEMP/t3code.provisionprofile"
          profile_plist="$RUNNER_TEMP/t3code-profile.plist"
          printf '%s' "$MACOS_PROVISIONING_PROFILE" | base64 -D > "$profile_path"
          security cms -D -i "$profile_path" > "$profile_plist"

          expected_app_id="$APPLE_TEAM_ID.dev.incognitojam.t3code"
          profile_app_id=$(/usr/libexec/PlistBuddy \
            -c 'Print :Entitlements:com.apple.application-identifier' \
            "$profile_plist")
          if [[ "$profile_app_id" != "$expected_app_id" ]]; then
            echo "Provisioning profile app ID is '$profile_app_id'; expected '$expected_app_id'." >&2
            exit 1
          fi

          if ! /usr/libexec/PlistBuddy \
            -c 'Print :Entitlements:com.apple.developer.associated-domains' \
            "$profile_plist" >/dev/null; then
            echo "Provisioning profile does not enable Associated Domains." >&2
            exit 1
          fi

          export T3CODE_APPLE_TEAM_ID="$APPLE_TEAM_ID"
          export T3CODE_MACOS_PROVISIONING_PROFILE="$profile_path"

          vp run dist:desktop:artifact \
            --platform mac \
            --target dmg \
            --arch arm64 \
            --build-version "${{ needs.prepare.outputs.version }}" \
            --signed \
            --verbose

      - name: Collect release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-publish

          shopt -s nullglob
          for pattern in \
            "release/*.dmg" \
            "release/*.zip" \
            "release/*.blockmap" \
            "release/*.yml"; do
            for file in $pattern; do
              cp "$file" release-publish/
            done
          done

          test -n "$(find release-publish -maxdepth 1 -type f -print -quit)"

      - name: Upload release assets
        uses: actions/upload-artifact@v7
        with:
          name: desktop-mac-arm64
          path: release-publish/*
          if-no-files-found: error

  # node-pty publishes no Linux prebuilt and the WSL backend runs under the
  # distro's own (Linux) Node, which can't load the Windows/Electron binary. We
  # build the Linux pty.node here, on Linux, and hand it to the Windows packaging
  # job — the Windows artifact then ships a ready WSL backend binary with no
  # cross-compiling and no first-launch compiler/node-gyp/network on the user's
  # machine. node-pty is N-API, so one binary works across all WSL Node versions.
  build_wsl_node_pty:
    name: Build WSL node-pty (linux-x64)
    needs: prepare
    if: >-
      github.event_name != 'pull_request' &&
      needs.prepare.outputs.has_changes == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout verified candidate
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=t3...

      - name: Build node-pty linux-x64 prebuild
        shell: bash
        run: |
          set -euo pipefail
          # Resolve node-pty from apps/server (where it's a dependency) and build
          # its native binary from source for Linux. node-addon-api resolves from
          # node-pty's own dependency tree, so node-gyp has everything it needs.
          pty_pkg="$(node -e "console.log(require.resolve('node-pty/package.json', { paths: ['$GITHUB_WORKSPACE/apps/server'] }))")"
          pty_dir="$(dirname "$pty_pkg")"
          ( cd "$pty_dir" && npx --yes node-gyp rebuild )
          mkdir -p wsl-prebuild
          cp "$pty_dir/build/Release/pty.node" wsl-prebuild/pty.node
          file wsl-prebuild/pty.node

      - name: Upload node-pty linux-x64 prebuild
        uses: actions/upload-artifact@v7
        with:
          name: wsl-node-pty-x64
          path: wsl-prebuild/pty.node
          if-no-files-found: error

  build_windows:
    name: Build Windows x64
    needs: [prepare, build_wsl_node_pty]
    if: >-
      github.event_name != 'pull_request' &&
      needs.prepare.outputs.has_changes == 'true'
    runs-on: windows-2025
    timeout-minutes: 100
    steps:
      - name: Checkout verified candidate
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          fetch-depth: 0
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/desktop...
              - --filter=t3...
              - --filter=@t3tools/scripts...

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Align package versions
        run: node scripts/update-release-package-versions.ts "${{ needs.prepare.outputs.version }}"

      - name: Download WSL node-pty prebuild
        uses: actions/download-artifact@v8
        with:
          name: wsl-node-pty-x64
          path: wsl-prebuild

      - name: Install Spectre-mitigated MSVC libs
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installPath = & $vswhere -products * -latest -property installationPath
          $setupExe = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"
          $proc = Start-Process -FilePath $setupExe `
            -ArgumentList "modify", "--installPath", "`"$installPath`"", "--add", `
            "Microsoft.VisualStudio.Component.VC.Tools.x86.x64.Spectre", "--quiet", "--norestart" `
            -Wait -PassThru -NoNewWindow
          if ($null -eq $proc -or $proc.ExitCode -ne 0) {
            $code = if ($null -ne $proc) { $proc.ExitCode } else { 1 }
            Write-Error "Visual Studio Installer failed with exit code $code"
            exit $code
          }

      # Unsigned: the fork has no Windows signing certificate or Azure Trusted
      # Signing account. Users see a one-time SmartScreen warning on install.
      - name: Build unsigned desktop artifact
        timeout-minutes: 90
        shell: bash
        env:
          T3CODE_DESKTOP_UPDATE_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          vp run dist:desktop:artifact \
            --platform win \
            --target nsis \
            --arch x64 \
            --build-version "${{ needs.prepare.outputs.version }}" \
            --wsl-prebuild "$GITHUB_WORKSPACE/wsl-prebuild/pty.node" \
            --verbose

      - name: Collect release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-publish

          shopt -s nullglob
          for pattern in \
            "release/*.exe" \
            "release/*.blockmap" \
            "release/*.yml"; do
            for file in $pattern; do
              cp "$file" release-publish/
            done
          done

          test -n "$(find release-publish -maxdepth 1 -type f -print -quit)"

      - name: Upload release assets
        uses: actions/upload-artifact@v7
        with:
          name: desktop-win-x64
          path: release-publish/*
          if-no-files-found: error

  release:
    name: Publish GitHub prerelease
    needs: [prepare, build_macos, build_windows]
    if: >-
      github.event_name != 'pull_request' &&
      needs.prepare.outputs.has_changes == 'true' &&
      needs.build_macos.result == 'success' &&
      needs.build_windows.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout released source
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.FORK_RELEASE_TOKEN }}
          ref: ${{ needs.prepare.outputs.ref }}
          fetch-depth: 0
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Download release assets
        uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          merge-multiple: true
          path: release-assets

      - name: Generate prerelease notes
        shell: bash
        env:
          FORK_SOURCE_REF: ${{ needs.prepare.outputs.fork_ref }}
          PREVIOUS_TAG: ${{ needs.prepare.outputs.previous_tag }}
          UPSTREAM_REF: ${{ needs.prepare.outputs.upstream_ref }}
        run: |
          set -euo pipefail

          git fetch --no-tags origin "$FORK_SOURCE_REF"
          git rev-parse --verify "${FORK_SOURCE_REF}^{commit}" >/dev/null
          git rev-parse --verify "${UPSTREAM_REF}^{commit}" >/dev/null

          append_changes() {
            local repository="$1"
            shift

            if (( $# == 0 )); then
              return
            fi

            local sha short_sha subject title pull_number
            for sha in "$@"; do
              short_sha="${sha:0:7}"
              subject=$(git show -s --format=%s "$sha")
              if [[ "$subject" =~ ^(.+)\ \(#([0-9]+)\)$ ]]; then
                title="${BASH_REMATCH[1]}"
                pull_number="${BASH_REMATCH[2]}"
                printf -- '- %s ([%s#%s](https://github.com/%s/pull/%s))\n' \
                  "$title" "$repository" "$pull_number" "$repository" "$pull_number"
              else
                # shellcheck disable=SC2016 # Markdown backticks must remain literal.
                printf -- '- %s ([`%s`](https://github.com/%s/commit/%s))\n' \
                  "$subject" "$short_sha" "$repository" "$sha"
              fi
            done
          }

          if [[ -n "$PREVIOUS_TAG" ]]; then
            git rev-parse --verify "${PREVIOUS_TAG}^{commit}" >/dev/null
            previous_upstream_ref=$(git merge-base "$PREVIOUS_TAG" "$UPSTREAM_REF")
          else
            previous_upstream_ref=$(git merge-base "$FORK_SOURCE_REF" "$UPSTREAM_REF")
          fi

          upstream_changes=()
          while IFS= read -r sha; do
            upstream_changes+=("$sha")
          done < <(git rev-list --reverse "${previous_upstream_ref}..${UPSTREAM_REF}")

          fork_changes=()
          if [[ -n "$PREVIOUS_TAG" ]]; then
            while IFS= read -r sha; do
              fork_changes+=("$sha")
            done < <(
              git rev-list --reverse --cherry-pick --right-only \
                "${PREVIOUS_TAG}...${FORK_SOURCE_REF}"
            )
          else
            while IFS= read -r sha; do
              fork_changes+=("$sha")
            done < <(git rev-list --reverse "${previous_upstream_ref}..${FORK_SOURCE_REF}")
          fi

          {
            printf "## What's Changed\n\n"
            if (( ${#fork_changes[@]} > 0 )); then
              append_changes "$GITHUB_REPOSITORY" "${fork_changes[@]}"
            fi
            if (( ${#upstream_changes[@]} > 0 )); then
              append_changes pingdotgg/t3code "${upstream_changes[@]}"
            fi
            printf '\n**Full Changelog**: https://github.com/pingdotgg/t3code/compare/%s...%s\n' \
              "$previous_upstream_ref" "$UPSTREAM_REF"
          } > release-notes.md

      - id: draft_release
        name: Upload draft prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ needs.prepare.outputs.ref }}
          name: ${{ needs.prepare.outputs.release_name }}
          body_path: release-notes.md
          draft: true
          prerelease: true
          make_latest: false
          files: release-assets/*
          fail_on_unmatched_files: true
          token: ${{ github.token }}

      - name: Publish complete prerelease
        if: inputs.dry_run != true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.draft_release.outputs.id }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_ID"
          gh api --method PATCH \
            "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
            -F draft=false \
            -F prerelease=true \
            -f make_latest=false \
            >/dev/null

      - name: Promote successful nightly source
        if: inputs.dry_run != true
        shell: bash
        run: |
          git fetch origin '+refs/heads/nightly:refs/remotes/origin/nightly' || true
          git push --force-with-lease origin HEAD:refs/heads/nightly

  notify_failure:
    name: Notify Discord
    needs: [prepare, build_wsl_node_pty, build_macos, build_windows, release]
    if: >-
      ${{
        github.event_name != 'pull_request' &&
        always() &&
        (
          needs.prepare.result == 'failure' ||
          needs.prepare.result == 'cancelled' ||
          needs.build_wsl_node_pty.result == 'failure' ||
          needs.build_wsl_node_pty.result == 'cancelled' ||
          needs.build_macos.result == 'failure' ||
          needs.build_macos.result == 'cancelled' ||
          needs.build_windows.result == 'failure' ||
          needs.build_windows.result == 'cancelled' ||
          needs.release.result == 'failure' ||
          needs.release.result == 'cancelled'
        )
      }}
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - uses: tsickert/discord-webhook@b217a69502f52803de774ded2b1ab7c282e99645 # v7.0.0
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK_CI }}
          embed-title: Fork Nightly failed
          embed-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          embed-description: |
            `${{ github.sha }}` · `${{ github.actor }}`

            Prepare: `${{ needs.prepare.result }}`
            WSL node-pty build: `${{ needs.build_wsl_node_pty.result }}`
            macOS build: `${{ needs.build_macos.result }}`
            Windows build: `${{ needs.build_windows.result }}`
            Release: `${{ needs.release.result }}`
          embed-color: 15158332
