    status: maintained
    prs: [1003]
    invariants:
      - Each successful provider prompt submission or steering delivery records provider.turn.sent after acceptance, including server-originated scheduled messages, restart continuations, and delegated results; rejected and interrupted sends, native compaction, and unsolicited provider turns do not record sends.
      - Send properties contain the provider, known model and modes, managed Codex subscription-sharing flag, attachment count, and presence of input, without prompts, attachment names, or conversation identifiers. Steering attribution stays scoped to its live provider thread and run in shared sessions.
      - Delivery uses the existing telemetry identity, queue, opt-out, and retry deduplication; analytics failures never fail a successful send, and interruption during telemetry does not clear an accepted turn's busy state or attribution. All events carry providerSendUsageVersion so rollout coverage is measurable without treating old servers as inactive.
    rationale: The V2 migration deleted the legacy send emitter while retaining completion telemetry, leaving existing provider and model send charts empty. Completion counts include autonomous provider turns and cannot replace sends without changing the metric.
