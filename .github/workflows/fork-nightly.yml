name: Fork Nightly

on:
  schedule:
    - cron: "23 8,11,14,17,20 * * *"
  workflow_dispatch:
    inputs:
      force_notarization:
        description: Ignore an active Apple notarization submission
        required: false
        type: boolean
        default: false
      dry_run:
        description: >-
          Run the full pipeline even without new changes, but leave the
          release as an unpublished draft and skip nightly promotion
        required: false
        type: boolean
        default: false
      source_ref:
        description: >-
          Publish this ref's patch stack instead of main's. A branch or SHA on
          origin holding a conflict-resolved stack; it is rebased, verified,
          released, and promoted to main like any other candidate
        required: false
        type: string
        default: ""
      waived_main_patches:
        description: >-
          Commits from main (space or comma separated SHAs) reviewed as
          intentionally reshaped by conflict resolution and expected to be
          missing from source_ref; any other missing patch still fails
        required: false
        type: string
        default: ""

permissions:
  contents: write
  id-token: none

concurrency:
  group: fork-nightly-publish

jobs:
  prepare:
    name: Prepare and verify candidate
    if: github.repository == 'yngatech/t3code'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    outputs:
      has_changes: ${{ steps.candidate.outputs.has_changes }}
      ref: ${{ steps.candidate.outputs.ref }}
      # The patch stack this run publishes, before the rebase: main's tip, or
      # source_ref's commit. Release notes enumerate this stack's commits.
      fork_ref: ${{ steps.candidate.outputs.fork_ref }}
      # main's tip when the run started, which promotion backs up and replaces.
      # Same commit as fork_ref unless source_ref was given.
      main_ref: ${{ steps.candidate.outputs.main_ref }}
      upstream_ref: ${{ steps.candidate.outputs.upstream_ref }}
      version: ${{ steps.release_meta.outputs.version }}
      tag: ${{ steps.release_meta.outputs.tag }}
      release_name: ${{ steps.release_meta.outputs.name }}
      previous_tag: ${{ steps.previous_tag.outputs.previous_tag }}
    steps:
      - name: Validate source ref
        if: inputs.source_ref != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail

          # Checking before checkout turns a typo or an unpushed branch into a
          # readable first-step failure instead of a checkout error.
          if ! gh api "repos/${GITHUB_REPOSITORY}/commits/${SOURCE_REF}" \
            --jq .sha; then
            echo "source_ref '${SOURCE_REF}' does not resolve to a commit in ${GITHUB_REPOSITORY}; push the stack to origin first." >&2
            exit 1
          fi

      - id: app_token
        name: Mint yngatech-nightly app token
        # The yngatech-nightly GitHub App is the bypass actor on main's
        # ruleset, so pushes to protected refs must authenticate as the app.
        # Minted per job because installation tokens expire after one hour and
        # the desktop builds run between this job and the release job.
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.YNGATECH_NIGHTLY_APP_CLIENT_ID }}
          private-key: ${{ secrets.YNGATECH_NIGHTLY_APP_PRIVATE_KEY }}

      - name: Checkout fork patch stack
        uses: actions/checkout@v6
        with:
          token: ${{ steps.app_token.outputs.token }}
          ref: ${{ inputs.source_ref || 'main' }}
          fetch-depth: 0

      - id: candidate
        name: Rebase candidate onto upstream
        shell: bash
        env:
          WAIVED_MAIN_PATCHES: ${{ inputs.waived_main_patches }}
          DRY_RUN: ${{ inputs.dry_run == true }}
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail

          # fork_ref is the stack this run publishes: main's tip, or the
          # maintainer's resolved stack on a source_ref run. main_ref is the
          # commit promotion replaces, read once here so every later main-side
          # check compares against the same snapshot.
          fork_ref=$(git rev-parse HEAD)
          if [[ -n "${SOURCE_REF:-}" ]]; then
            main_ref=$(git ls-remote origin refs/heads/main | cut -f1)
            if [[ -z "$main_ref" ]]; then
              echo "origin has no main branch to promote onto." >&2
              exit 1
            fi

            # Fetch the immutable main snapshot and current upstream before
            # rebasing. The guard itself is loaded from main so a stale
            # source_ref cannot omit or roll back the check it must pass.
            git fetch --no-tags origin "$main_ref"
            git fetch --no-tags https://github.com/pingdotgg/t3code.git main
            guard_upstream_ref=$(git rev-parse FETCH_HEAD)
            guard_script="$RUNNER_TEMP/check-source-stack.sh"
            if ! git show "${main_ref}:.github/scripts/check-source-stack.sh" > "$guard_script"; then
              echo "main snapshot ${main_ref} does not contain the source_ref patch guard; update main before dispatching a source_ref run." >&2
              exit 1
            fi
            bash "$guard_script" \
              "$main_ref" \
              "$fork_ref" \
              "$guard_upstream_ref" \
              "$WAIVED_MAIN_PATCHES"
          else
            main_ref=$fork_ref
          fi

          git fetch origin '+refs/heads/nightly:refs/remotes/origin/nightly' || true
          git fetch origin \
            '+refs/heads/nightly-candidate:refs/remotes/origin/nightly-candidate' || true

          git switch -C nightly-candidate HEAD
          source .github/scripts/rebase-onto-upstream.sh
          upstream_ref=$UPSTREAM_REF

          candidate_ref=$(git rev-parse HEAD)
          has_changes=true
          if [[ "$DRY_RUN" != "true" ]] && \
            git rev-parse --verify refs/remotes/origin/nightly >/dev/null 2>&1 && \
            git diff --quiet origin/nightly HEAD --; then
            has_changes=false
          fi

          {
            echo "has_changes=$has_changes"
            echo "ref=$candidate_ref"
            echo "fork_ref=$fork_ref"
            echo "main_ref=$main_ref"
            echo "upstream_ref=$upstream_ref"
          } >> "$GITHUB_OUTPUT"

      - name: Align main to released nightly
        if: >-
          inputs.dry_run != true &&
          steps.candidate.outputs.has_changes == 'false'
        shell: bash
        env:
          MAIN_REF: ${{ steps.candidate.outputs.main_ref }}
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail

          # No new upstream this run, so the release job (and its promotion
          # step) will not run. The existing origin/nightly commit has a tree
          # identical to the freshly rebased candidate (that is exactly what
          # has_changes=false means) and already shipped through a fully
          # verified release, so align main to it directly without
          # re-verification. A source_ref run reaching here resolved to that
          # same already-released tree, so origin/nightly is still the right
          # commit to put on main.
          if ! nightly_ref=$(git rev-parse --verify \
            refs/remotes/origin/nightly 2>/dev/null); then
            echo "origin/nightly does not exist; nothing to align main to."
            exit 0
          fi
          if [[ "$MAIN_REF" == "$nightly_ref" ]]; then
            echo "main already matches origin/nightly; skipping promotion."
            exit 0
          fi

          # A PR merged since this run started moves main. On a scheduled run
          # that is normal: skip, and the next candidate includes it. A
          # source_ref run exists to put the resolution on main, so fail
          # loudly instead (notify_failure fires) — nothing silently outlives
          # a resolution that no longer contains main's tip.
          remote_main=$(git ls-remote origin refs/heads/main | cut -f1)
          if [[ "$remote_main" != "$MAIN_REF" ]]; then
            if [[ -n "${SOURCE_REF:-}" ]]; then
              echo "main moved during this source_ref run; refresh the resolution from current main and re-dispatch." >&2
              exit 1
            fi
            echo "main moved during this run; skipping promotion — the next run's candidate will include it."
            exit 0
          fi

          # The day's first promotion snapshots pre-promotion main; later
          # promotions leave the snapshot alone. Same mechanics as the release
          # job's "Promote verified stack to main" step; keep the two in sync.
          backup_ref="refs/heads/backup/main-$(date -u +%Y%m%d)"
          if git ls-remote --exit-code origin "$backup_ref" >/dev/null; then
            echo "${backup_ref#refs/heads/} already exists; leaving it in place."
          else
            status=$?
            if [[ "$status" -ne 2 ]]; then
              echo "Checking origin for ${backup_ref} failed (git ls-remote exit ${status})."
              exit "$status"
            fi
            git push origin "${MAIN_REF}:${backup_ref}"
          fi

          # The lease pins main to the commit this run started from. A failed
          # lease means main moved in the seconds since the check above; fail
          # loudly and let notify_failure fire rather than promote over it.
          git push --force-with-lease="refs/heads/main:${MAIN_REF}" \
            origin "${nightly_ref}:refs/heads/main"

      - name: Setup Vite+
        if: steps.candidate.outputs.has_changes == 'true'
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Ensure Electron runtime is installed
        if: steps.candidate.outputs.has_changes == 'true'
        run: vp run --filter @t3tools/desktop ensure:electron

      - name: Setup Rust
        if: steps.candidate.outputs.has_changes == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Check
        if: steps.candidate.outputs.has_changes == 'true'
        run: vp check

      - name: Typecheck
        if: steps.candidate.outputs.has_changes == 'true'
        run: vp run typecheck

      - name: Build desktop pipeline
        if: steps.candidate.outputs.has_changes == 'true'
        run: vp run build:desktop

      - name: Verify preload bundle output
        if: steps.candidate.outputs.has_changes == 'true'
        run: |
          test -f apps/desktop/dist-electron/preload.cjs
          grep -nE "desktopBridge|getLocalEnvironmentBootstrap|PICK_FOLDER_CHANNEL|wsUrl" apps/desktop/dist-electron/preload.cjs
          grep -n "__clerk_internal_electron_passkeys" apps/desktop/dist-electron/preload.cjs

      - name: Test
        if: steps.candidate.outputs.has_changes == 'true'
        run: |
          vp run -r test --exclude '**/imageCompression.test.ts'
          vp run --filter @t3tools/web test src/lib/imageCompression.test.ts \
            --no-file-parallelism \
            --maxWorkers=1

      - name: Test resource monitor
        if: steps.candidate.outputs.has_changes == 'true'
        run: cargo test --locked --manifest-path native/resource-monitor/Cargo.toml

      - id: release_meta
        name: Resolve nightly version
        if: steps.candidate.outputs.has_changes == 'true'
        shell: bash
        env:
          CANDIDATE_REF: ${{ steps.candidate.outputs.ref }}
          NIGHTLY_RUN_NUMBER: ${{ github.run_number }}
        run: |
          nightly_date=$(date -u +%Y%m%d)
          node scripts/resolve-nightly-release.ts \
            --date "$nightly_date" \
            --run-number "$NIGHTLY_RUN_NUMBER" \
            --sha "$CANDIDATE_REF" \
            --github-output

      - id: previous_tag
        name: Resolve previous fork nightly
        if: steps.candidate.outputs.has_changes == 'true'
        run: |
          node scripts/resolve-previous-release-tag.ts \
            --channel nightly \
            --current-tag "${{ steps.release_meta.outputs.tag }}" \
            --github-output

      - name: Publish verified candidate
        if: steps.candidate.outputs.has_changes == 'true'
        run: git push --force-with-lease origin HEAD:refs/heads/nightly-candidate

  build_desktop:
    name: Build desktop artifacts
    needs: prepare
    if: needs.prepare.outputs.has_changes == 'true'
    uses: ./.github/workflows/fork-desktop-build.yml
    with:
      ref: ${{ needs.prepare.outputs.ref }}
      version: ${{ needs.prepare.outputs.version }}
      target: all
      sign_macos: true
      check_notarization: true
      force_notarization: ${{ inputs.force_notarization == true }}
    secrets: inherit

  release:
    name: Publish GitHub prerelease
    needs: [prepare, build_desktop]
    permissions:
      contents: write
      issues: write
      pull-requests: read
    if: >-
      needs.prepare.outputs.has_changes == 'true' &&
      needs.build_desktop.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - id: app_token
        name: Mint yngatech-nightly app token
        # Fresh token rather than prepare's: installation tokens expire after
        # one hour and the desktop builds run between the two jobs. This job's
        # nightly and main pushes need the app's ruleset bypass too.
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.YNGATECH_NIGHTLY_APP_CLIENT_ID }}
          private-key: ${{ secrets.YNGATECH_NIGHTLY_APP_PRIVATE_KEY }}

      - name: Checkout released source
        uses: actions/checkout@v6
        with:
          token: ${{ steps.app_token.outputs.token }}
          ref: ${{ needs.prepare.outputs.ref }}
          fetch-depth: 0
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Download release assets
        uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          merge-multiple: true
          path: release-assets

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json

      # Extraction reads every commit the fork carries, so without this each run
      # re-reads the whole patch stack. Entries are keyed by patch ID, which the
      # nightly rebase preserves; a miss only costs the extraction it skipped.
      - name: Restore changelog extraction cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/t3code-changelog
          key: changelog-records-${{ github.run_id }}
          restore-keys: changelog-records-

      - id: fork_features
        name: Generate fork features and improvements
        continue-on-error: true
        env:
          FORK_SOURCE_REF: ${{ needs.prepare.outputs.fork_ref }}
          GITHUB_TOKEN: ${{ github.token }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_FORK_CHANGELOG_API_KEY }}
          PREVIOUS_TAG: ${{ needs.prepare.outputs.previous_tag }}
          UPSTREAM_REF: ${{ needs.prepare.outputs.upstream_ref }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "$OPENAI_API_KEY" ]]; then
            echo "OPENAI_FORK_CHANGELOG_API_KEY is not configured; keeping commit-based release notes."
            echo "generated=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git fetch --no-tags origin "$FORK_SOURCE_REF"
          node scripts/generate-fork-features-summary.ts \
            --fork-ref "$FORK_SOURCE_REF" \
            --upstream-ref "$UPSTREAM_REF" \
            --previous-release-ref "$PREVIOUS_TAG" \
            --fork-repository "$GITHUB_REPOSITORY" \
            --upstream-repository pingdotgg/t3code \
            --output fork-features.md \
            --nightly-output nightly-highlights.md \
            --records-cache "$HOME/.cache/t3code-changelog/records.json" \
            --exclude-mobile-only-nightly
          echo "generated=true" >> "$GITHUB_OUTPUT"

      - name: Generate prerelease notes
        shell: bash
        env:
          FORK_SOURCE_REF: ${{ needs.prepare.outputs.fork_ref }}
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_TAG: ${{ needs.prepare.outputs.previous_tag }}
          UPSTREAM_REF: ${{ needs.prepare.outputs.upstream_ref }}
        run: |
          set -euo pipefail

          git fetch --no-tags origin "$FORK_SOURCE_REF"
          git rev-parse --verify "${FORK_SOURCE_REF}^{commit}" >/dev/null
          git rev-parse --verify "${UPSTREAM_REF}^{commit}" >/dev/null
          source .github/scripts/release-changelog.sh

          append_changes() {
            local repository="$1"
            shift

            if (( $# == 0 )); then
              return
            fi

            local sha short_sha subject title pull_number author
            for sha in "$@"; do
              short_sha="${sha:0:7}"
              subject=$(git show -s --format=%s "$sha")
              rendered_change_count=$((rendered_change_count + 1))
              if [[ "$subject" =~ ^(.+)\ \(#([0-9]+)\)$ ]]; then
                title="${BASH_REMATCH[1]}"
                pull_number="${BASH_REMATCH[2]}"
                author=$(gh api "repos/${repository}/pulls/${pull_number}" \
                  --jq '.user.login' 2>/dev/null || true)
                if [[ -n "$author" ]]; then
                  printf -- '- %s ([%s#%s](https://github.com/%s/pull/%s)) by @%s\n' \
                    "$title" "$repository" "$pull_number" "$repository" "$pull_number" "$author"
                else
                  printf -- '- %s ([%s#%s](https://github.com/%s/pull/%s))\n' \
                    "$title" "$repository" "$pull_number" "$repository" "$pull_number"
                fi
              else
                # shellcheck disable=SC2016 # Markdown backticks must remain literal.
                printf -- '- %s ([`%s`](https://github.com/%s/commit/%s))\n' \
                  "$subject" "$short_sha" "$repository" "$sha"
              fi
            done
          }

          if [[ -n "$PREVIOUS_TAG" ]]; then
            git rev-parse --verify "${PREVIOUS_TAG}^{commit}" >/dev/null
            previous_upstream_ref=$(git merge-base "$PREVIOUS_TAG" "$UPSTREAM_REF")
          else
            previous_upstream_ref=$(git merge-base "$FORK_SOURCE_REF" "$UPSTREAM_REF")
          fi

          upstream_changes=()
          while IFS= read -r sha; do
            upstream_changes+=("$sha")
          done < <(git rev-list --reverse "${previous_upstream_ref}..${UPSTREAM_REF}")

          fork_changes=()
          while IFS= read -r sha; do
            fork_changes+=("$sha")
          done < <(
            list_fork_release_commits "$PREVIOUS_TAG" "$FORK_SOURCE_REF" "$UPSTREAM_REF"
          )

          rendered_change_count=0
          {
            if [[ -f nightly-highlights.md ]]; then
              cat nightly-highlights.md
              printf '\n'
            fi
            printf "## What's Changed\n\n"
            if (( ${#fork_changes[@]} > 0 )); then
              append_changes "$GITHUB_REPOSITORY" "${fork_changes[@]}"
            fi
            if (( ${#upstream_changes[@]} > 0 )); then
              append_changes pingdotgg/t3code "${upstream_changes[@]}"
            fi
            if (( rendered_change_count == 0 )); then
              printf 'No user-facing changes.\n'
            fi
            printf '\n**Full Changelog**: https://github.com/pingdotgg/t3code/compare/%s...%s\n' \
              "$previous_upstream_ref" "$UPSTREAM_REF"
          } > release-notes.md

      - id: draft_release
        name: Upload draft prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ needs.prepare.outputs.ref }}
          name: ${{ needs.prepare.outputs.release_name }}
          body_path: release-notes.md
          draft: true
          prerelease: true
          make_latest: false
          files: release-assets/*
          fail_on_unmatched_files: true
          token: ${{ github.token }}

      - name: Publish complete prerelease
        if: inputs.dry_run != true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.draft_release.outputs.id }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_ID"
          gh api --method PATCH \
            "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
            -F draft=false \
            -F prerelease=true \
            -f make_latest=false \
            >/dev/null

      - name: Promote successful nightly source
        if: inputs.dry_run != true
        shell: bash
        run: |
          git fetch origin '+refs/heads/nightly:refs/remotes/origin/nightly' || true
          git push --force-with-lease origin HEAD:refs/heads/nightly

      - name: Promote verified stack to main
        if: inputs.dry_run != true
        shell: bash
        env:
          CANDIDATE_REF: ${{ needs.prepare.outputs.ref }}
          MAIN_REF: ${{ needs.prepare.outputs.main_ref }}
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail

          # Everything here is about main's tip as prepare saw it: the commit
          # promotion replaces, backs up, and leases against. The published
          # stack itself is CANDIDATE_REF.
          git fetch --no-tags origin "$MAIN_REF"
          git rev-parse --verify "${MAIN_REF}^{commit}" >/dev/null
          git rev-parse --verify "${CANDIDATE_REF}^{commit}" >/dev/null

          if [[ "$CANDIDATE_REF" == "$MAIN_REF" ]]; then
            echo "main already matches the candidate; nothing to promote."
            exit 0
          fi

          # A PR merged while this run was building moves main. On a
          # scheduled run that is normal: skip, and the next candidate
          # includes it. A source_ref run exists to put the resolution on
          # main, so fail loudly instead (notify_failure fires). The release
          # and nightly promotion above already landed and stand either way.
          remote_main=$(git ls-remote origin refs/heads/main | cut -f1)
          if [[ "$remote_main" != "$MAIN_REF" ]]; then
            if [[ -n "${SOURCE_REF:-}" ]]; then
              echo "main moved during this source_ref run; the release stands but main was not promoted. Refresh the resolution from current main and re-dispatch." >&2
              exit 1
            fi
            echo "main moved during this run; skipping promotion — the next run's candidate will include it."
            exit 0
          fi

          # The day's first promotion snapshots pre-promotion main; later
          # promotions leave the snapshot alone. Same mechanics as prepare's
          # "Align main to released nightly" step; keep the two in sync.
          backup_ref="refs/heads/backup/main-$(date -u +%Y%m%d)"
          if git ls-remote --exit-code origin "$backup_ref" >/dev/null; then
            echo "${backup_ref#refs/heads/} already exists; leaving it in place."
          else
            status=$?
            if [[ "$status" -ne 2 ]]; then
              echo "Checking origin for ${backup_ref} failed (git ls-remote exit ${status})."
              exit "$status"
            fi
            git push origin "${MAIN_REF}:${backup_ref}"
          fi

          # The lease pins main to the commit this run started from. A failed
          # lease means main moved in the seconds since the check above; fail
          # loudly and let notify_failure fire rather than promote over it.
          git push --force-with-lease="refs/heads/main:${MAIN_REF}" \
            origin "${CANDIDATE_REF}:refs/heads/main"

      - name: Update rolling fork features issue
        if: inputs.dry_run != true && steps.fork_features.outputs.generated == 'true'
        continue-on-error: true
        env:
          FORK_FEATURES_ISSUE_NUMBER: "43"
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh issue edit "$FORK_FEATURES_ISSUE_NUMBER" --body-file fork-features.md

  notify_failure:
    name: Notify Discord of failure
    needs: [prepare, build_desktop, release]
    if: >-
      ${{
        always() &&
        (
          needs.prepare.result == 'failure' ||
          needs.prepare.result == 'cancelled' ||
          needs.build_desktop.result == 'failure' ||
          needs.build_desktop.result == 'cancelled' ||
          needs.release.result == 'failure' ||
          needs.release.result == 'cancelled'
        )
      }}
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - uses: tsickert/discord-webhook@b217a69502f52803de774ded2b1ab7c282e99645 # v7.0.0
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK_CI }}
          embed-title: Fork Nightly failed
          embed-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          embed-description: |
            `${{ github.sha }}` · `${{ github.actor }}`

            Prepare: `${{ needs.prepare.result }}`
            Desktop builds: `${{ needs.build_desktop.result }}`
            Release: `${{ needs.release.result }}`
          embed-color: 15158332
