  - id: mentioned-time-chips
    title: Explain times mentioned in agent messages in the reader's time zone
    status: maintained
    prs: [595, 711]
    invariants:
      - Times in assistant message prose (clock times with or without a zone or date, "N units ago", and cued "in N units") render as chips that keep the written text; code spans, code blocks and link labels are never marked.
      - Hovering a chip shows the moment in the reader's zone, locale and 12/24-hour setting, how far it is from now, and which assumptions were made (the environment's zone, the message's day, or counting from when the message was sent); the relative time is computed when the tooltip opens and never ticks.
      - Zone-less times take the one zone the rest of the message uses, else the zone the environment reports as `platform.timeZone`; against a server that reports none and a message that names none, they stay plain text rather than guessing.
      - Times without a date take the occurrence nearest to when the message was sent, unless a tense cue in the same sentence ("next", "merged") points the other way and the nearest occurrence is more than three hours on the wrong side.
      - Durations such as "finished in 36 seconds" and single-digit zone-less clocks such as "2:48" are not marked.
      - Timeline labels ending in a punctuation colon retain their clock and explicit zone; extra colon-separated tokens and file line/column references stay unmarked.
      - Opening a time explanation emits at most one structural client-usage event per mounted chip through the message's environment, without sending the time, timezone, message content, or identifiers.
