      - Cleanup is bounded and observable so a stuck close, telemetry flush, or backend request cannot indefinitely delay process exit.
    implementation_paths:
      - apps/desktop/src/app/DesktopLifecycle.ts
      - apps/desktop/src/app/DesktopObservability.ts
      - apps/desktop/src/window/DesktopWindow.ts
    upstream_paths:
