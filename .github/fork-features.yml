# Capabilities, not commits. Follow-up fixes belong to the feature they preserve.
features:
  - id: active-terminal-close-confirmation
    title: Confirm closing terminals only while work is active
    status: maintained
    prs: [22, 226]
    invariants:
      - Closing a terminal prompts only while a foreground subprocess or finite setup command is still active; idle shells and exited setup terminals close immediately.
      - Drawer, panel, shortcut, surface, and middle-click close paths share the same server-reported liveness decision instead of inferring activity from client state.
    implementation_paths:
      - apps/server/src/terminal/Manager.ts
      - apps/server/src/ws.ts
      - apps/web/src/components/ChatView.tsx
      - apps/web/src/components/ThreadTerminalDrawer.tsx
      - apps/web/src/hooks/useTerminalCloseConfirmation.ts
      - apps/web/src/lib/terminalCloseConfirm.ts
      - packages/client-runtime/src/state/terminal.ts
      - packages/contracts/src/rpc.ts
      - packages/contracts/src/terminal.ts
    upstream_paths:
      - apps/server/src/terminal/Manager.ts
      - apps/server/src/ws.ts
      - apps/web/src/components/ChatView.tsx
      - apps/web/src/components/ThreadTerminalDrawer.tsx
      - apps/web/src/lib/terminalCloseConfirm.ts
      - packages/client-runtime/src/state/terminal.ts
      - packages/contracts/src/rpc.ts
      - packages/contracts/src/terminal.ts
    tests:
      - apps/server/src/project/ProjectSetupScriptRunner.test.ts
      - apps/server/src/terminal/Manager.test.ts
      - apps/web/src/components/ThreadTerminalDrawer.test.ts
      - apps/web/src/lib/terminalCloseConfirm.test.ts
      - packages/contracts/src/terminal.test.ts
