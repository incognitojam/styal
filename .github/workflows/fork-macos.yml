name: Fork macOS

# Jobs that need a GitHub-hosted macOS runner. The free tier allows only a few at
# once and GitHub cancels a job no runner picks up, so these stay out of Fork CI,
# whose result gates intake promotion and the nightly. Both jobs run only when
# their inputs changed. Merging requires `Fork Mobile Native Lint`; browser
# calibration shows on the pull request or commit without blocking anything.
#
# The workflow runs on every change rather than filtering paths in the trigger:
# a required check must report even on a docs-only pull request.
on:
  pull_request:
  push:
    branches:
      - main
      - "intake/**"

permissions:
  contents: read

concurrency:
  group: fork-macos-${{ startsWith(github.ref, 'refs/heads/intake/') && github.ref || github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/intake/') }}

jobs:
  preview_calibration:
    name: Fork Browser Calibration (macOS)
    needs: changes
    if: ${{ !cancelled() && needs.changes.result != 'skipped' && needs.changes.outputs.calibration != 'false' }}
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup cached dependencies
        uses: ./.github/actions/setup-deps

      - name: Ignore calibration artifacts
        run: echo '.scratch/' >> .git/info/exclude

      - name: Capture calibration snapshots
        run: vp run --filter @t3tools/desktop test:preview-calibration

      - name: Upload calibration snapshots and measurements
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-calibration-macOS
          include-hidden-files: true
          path: |
            .scratch/preview-calibration/*.png
            .scratch/preview-calibration/measurements.json
          if-no-files-found: ignore
          retention-days: 14

  # macOS runners are scarce, so each job runs only when its inputs changed:
  # calibration for anything but docs, the static analysis for the native
  # sources it lints. Detection is API-only (no checkout) and fails open: if the
  # diff cannot be resolved, both run.
  changes:
    name: Fork macOS Changes
    if: github.repository == 'incognitojam/t3code' || github.repository == 'incognitojam/styal'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      calibration: ${{ steps.detect.outputs.calibration }}
      mobile_native: ${{ steps.detect.outputs.mobile_native }}
    steps:
      - name: Detect affected jobs
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -uo pipefail

          fail_open() {
            echo "$* Running every macOS job."
            echo "calibration=true" >> "$GITHUB_OUTPUT"
            echo "mobile_native=true" >> "$GITHUB_OUTPUT"
            exit 0
          }

          count_rows() {
            printf '%s\n' "$1" | grep -c . || true
          }

          # One row per changed file, holding the new path and, for a rename,
          # the path it replaced: renaming a matched file out of the matched
          # paths removes a lint input just like editing it.
          row='[.filename, (.previous_filename // empty)] | @tsv'

          if [[ -n "${PR_NUMBER}" ]]; then
            # The PR files endpoint stops at 3000 files and pagination cannot
            # extend it, so cross-check against the count the PR itself reports.
            expected=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.changed_files') \
              || fail_open "Could not read the pull request."
            rows=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" --paginate --jq ".[] | ${row}") \
              || fail_open "Could not resolve changed files."

            listed=$(count_rows "$rows")
            if [[ "$listed" -lt "$expected" ]]; then
              fail_open "GitHub listed only ${listed} of ${expected} changed files."
            fi
          else
            rows=$(gh api "repos/${GITHUB_REPOSITORY}/compare/${BEFORE_SHA}...${GITHUB_SHA}" --jq ".files[]? | ${row}") \
              || fail_open "Could not resolve changed files."

            # The compare endpoint reports at most 300 files and pagination does
            # not extend that list, so a full list may be hiding native changes.
            listed=$(count_rows "$rows")
            if [[ "$listed" -ge 300 ]]; then
              fail_open "GitHub listed ${listed} changed files, the compare endpoint maximum."
            fi
          fi

          paths=$(tr '\t' '\n' <<< "$rows" | grep . || true)

          # Docs and the files only other workflows read cannot change browser rendering.
          inert='^docs/|\.md$|^\.github/fork-features\.yml$|^\.github/workflows/provider-canary\.yml$'
          if grep -qvE "$inert" <<< "$paths"; then
            echo "calibration=true" >> "$GITHUB_OUTPUT"
          else
            echo "Only docs changed; skipping browser calibration."
            echo "calibration=false" >> "$GITHUB_OUTPUT"
          fi

          # Sources scripts/mobile-native-static-check.ts lints, plus the tool
          # and rule configuration that decides how it lints them, plus the
          # root package.json that defines the lint:mobile command.
          native='^apps/mobile/.*\.(swift|kt|kts)$|^apps/mobile/(\.swiftlint\.yml|detekt\.yml|\.editorconfig|Brewfile)$|^scripts/mobile-native-static-check\.ts$|^package\.json$|^\.github/workflows/fork-macos\.yml$'
          if grep -qE "$native" <<< "$paths"; then
            echo "Native sources or lint configuration changed:"
            grep -E "$native" <<< "$paths"
            echo "mobile_native=true" >> "$GITHUB_OUTPUT"
          else
            echo "No mobile native sources or lint configuration changed."
            echo "mobile_native=false" >> "$GITHUB_OUTPUT"
          fi

  mobile_native_static_analysis:
    name: Fork Mobile Native Static Analysis
    needs: changes
    # Skip only on an explicit "no": a gate job that failed or errored leaves the
    # output empty, and that must run the lint rather than silently skip it. A
    # skipped gate (outside this repository) skips the lint too.
    if: ${{ !cancelled() && needs.changes.result != 'skipped' && needs.changes.outputs.mobile_native != 'false' }}
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: false
          run-install: |
            args:
              - --filter=@t3tools/scripts...

      - name: Install mobile native static analysis tools
        run: brew bundle install --file apps/mobile/Brewfile

      - name: Lint mobile native sources
        run: vp run lint:mobile

  # Rulesets require this job by its name, `Fork Mobile Native Lint`.
  mobile_native_lint:
    name: Fork Mobile Native Lint
    needs: [changes, mobile_native_static_analysis]
    if: ${{ always() && needs.changes.result != 'skipped' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Require native lint when needed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -e '.changes.result == "success"
            and (.mobile_native_static_analysis.result == "success"
              or (.mobile_native_static_analysis.result == "skipped"
                and .changes.outputs.mobile_native == "false"))' > /dev/null
