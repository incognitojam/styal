  - id: pull-request-merge-head-guard
    title: Refuse GitHub merges when the head moved since the panel loaded
    status: maintained
    prs: [589]
    invariants:
      - A GitHub merge, or turning on auto-merge, from the pull request panel or quick actions sends the head commit from the client's last read, and GitHub refuses it when the branch has moved since.
      - After a refused action, the next detail read goes to the host, so retrying a merge uses the current head.
      - A merge refused because the head moved reports that new commits were pushed instead of the generic access hint.
      - Hosts that do not report a head commit, older clients, and older servers merge as before.
    rationale: Upstream pins a single pull request merge to a head only when removing agent credits from its merge message, and then pins the head read at merge time. The fork also guards against pushes since the reader last loaded the pull request.
